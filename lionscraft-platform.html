/* ── The bridge to the workforce board ────────────────────────────────
   That board keeps one markdown file per task with YAML frontmatter. Tasks
   labelled `risk` there are shown here, in the column matching their status —
   read-only, because they belong to that board. Nothing is copied, so the two
   cannot drift.

   Listing the directory costs one API call; the files themselves come from the
   raw CDN, which is not rate-limited. The whole thing is cached, so the desk
   does not spend its unauthenticated API budget on a poll loop. */
const BRIDGE = {
  repo:  "toniilein/workforce",
  dir:   "tasks",
  label: "risk",
  board: "https://toniilein.github.io/workforce/",
  every: 15000
};
const BRIDGE_KEY = "lionscraft-desk-bridge";
let bridged = [], bridgeStale = false, bridgeError = "";

function parseFrontmatter(text){
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
  if (!m) return null;
  const out = {};
  for (const line of m[1].split(/\r?\n/)){
    const i = line.indexOf(":");
    if (i > 0) out[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  return out;
}
const parseLabels = v => String(v || "")
  .replace(/^\[|\]$/g, "").split(",")
  .map(x => x.trim().replace(/^["']|["']$/g, "").toLowerCase())
  .filter(Boolean);

async function loadBridge(){
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(BRIDGE_KEY) || "null"); } catch (e) {}
  if (cache && Array.isArray(cache.tasks)){
    bridged = cache.tasks;
    if (Date.now() - (cache.at || 0) < BRIDGE.every) return;
  }

  /* Through the backend when there is one: it has no CORS problem, no
     per-viewer rate limit, and it caches for everybody at once. */
  if (useProxy){
    try {
      const out = await (await fetch(proxyBase + "/api/bridge", {cache:"no-store"})).json();
      bridgeStale = !!out.stale;
      bridgeError = out.error || "";
      bridged = (out.tasks || []).map(t => Object.assign({}, t, {
        sourceStatus: t.status,
        status: STATUS_CYCLE.includes(t.status) ? t.status : STATUS_CYCLE[0]
      }));
      try { localStorage.setItem(BRIDGE_KEY, JSON.stringify({at: Date.now(), tasks: bridged})); } catch (e) {}
      return;
    } catch (e) { /* fall through to reading GitHub directly */ }
  }

  try {
    const res = await fetch("https://api.github.com/repos/" + BRIDGE.repo + "/contents/" + BRIDGE.dir, {cache:"no-store"});
    if (!res.ok) throw new Error("listing: HTTP " + res.status);
    const files = (await res.json()).filter(f => f.name.endsWith(".md") && f.download_url);
    const texts = await Promise.all(files.map(f => fetch(f.download_url).then(r => r.text()).catch(() => "")));

    const out = [];
    texts.forEach((text, i) => {
      const fm = parseFrontmatter(text);
      if (!fm || !parseLabels(fm.labels).includes(BRIDGE.label)) return;
      out.push({
        id: "wf:" + (fm.id || files[i].name.replace(/\.md$/, "")),
        sourceId: fm.id || files[i].name.replace(/\.md$/, ""),
        title: fm.title || files[i].name,
        /* The other board has statuses this one does not (admin). Park those
           in Backlog but keep the original visible, so nothing is misreported. */
        status: STATUS_CYCLE.includes(fm.status) ? fm.status : "backlog",
        sourceStatus: fm.status || "",
        owner: fm.assignee || "",
        due: /^\d{4}-\d{2}-\d{2}$/.test(fm.due || "") ? fm.due : "",
        bridged: true
      });
    });
    bridged = out;
    try { localStorage.setItem(BRIDGE_KEY, JSON.stringify({at: Date.now(), tasks: out})); } catch (e) {}
  } catch (e) { /* keep whatever the cache had; the bridge is never load-bearing */ }
}

/* ── Board ────────────────────────────────────────────────────────── */

let boardOwner = "", boardQ = "";

function viewBoard(){
  let list = DB.tasks.slice();
  if (boardOwner) list = list.filter(t => (t.owner || "") === (boardOwner === "—" ? "" : boardOwner));
  if (boardQ){
    const q = boardQ.toLowerCase();
    list = list.filter(t => (t.title + " " + t.owner + " " + t.ws).toLowerCase().includes(q));
  }
  /* Explicit order first — set by dragging — then due date for anything never
     moved by hand, so a fresh board still reads soonest-first. */
  const rankT = t => (typeof t.order === "number" ? t.order : Number.MAX_SAFE_INTEGER);
  list.sort((a, b) => (rankT(a) - rankT(b)) || (a.due || "9999").localeCompare(b.due || "9999"));

  /* The MoUs, as cards. They carry a workstream, so the filter applies. */
  let mous = mouCards();
  if (boardOwner) mous = mous.filter(t => (t.owner || "") === (boardOwner === "—" ? "" : boardOwner));
  if (boardQ){
    const q = boardQ.toLowerCase();
    mous = mous.filter(t => t.title.toLowerCase().includes(q));
  }

  let bridge = bridged.slice();
  if (boardOwner) bridge = bridge.filter(t => (t.owner || "") === (boardOwner === "—" ? "" : boardOwner));
  if (boardQ){
    const q = boardQ.toLowerCase();
    bridge = bridge.filter(t => (t.title + " " + t.owner).toLowerCase().includes(q));
  }

  const owners = [...new Set(DB.tasks.map(t => t.owner).filter(Boolean))].sort();
  /* Every card actually on the board, not just DB.tasks — otherwise the strip
     reads 0 while the columns show MoUs and bridged cards sitting right there. */
  const all = list.concat(mous, bridge);
  const inFocus = all.filter(t => t.status === "focus").length;
  const inReview = all.filter(t => t.status === "review").length;
  const late = all.filter(t => isOverdue(t.due) && !isDone(t.status)).length;
  const unassigned = list.concat(mous, bridge).filter(t => !t.owner && !isDone(t.status)).length;

  return `
  <div class="pagehead">
    <div>
      <div class="eyebrow">${esc(DB.meta.facility)}</div>
      <h1>Board</h1>
      <p>Every task by state. Drag a card between columns to change its status; click it to edit. Same tasks as the plan — this is the working view.</p>
    </div>
    <div class="tools"><button class="btn primary" id="addTask">Add task</button></div>
  </div>

  <div class="grid" style="gap:14px">
    <div class="stats">
      <div class="stat"><b>${list.length + mous.length + bridge.length}</b><small>In view</small></div>
      <div class="stat ${inFocus ? "go" : ""}"><b>${inFocus}</b><small>Focus</small></div>
      <div class="stat"><b>${inReview}</b><small>Review</small></div>
      <div class="stat ${late ? "alert" : ""}"><b>${late}</b><small>Overdue</small></div>
      <div class="stat"><b>${unassigned}</b><small>Unassigned</small></div>
    </div>

    <div class="card">
      <header>
        <div class="filters">
          <select id="boardOwner">
            <option value="">Anyone</option>
            <option value="—" ${boardOwner === "—" ? "selected" : ""}>Unassigned</option>
            ${owners.map(o => `<option value="${esc(o)}" ${boardOwner === o ? "selected" : ""}>${esc(o)}</option>`).join("")}
          </select>
          <input type="text" id="boardQ" placeholder="Search…" value="${esc(boardQ)}" style="width:170px">
          ${(boardOwner || boardQ) ? '<button class="btn ghost" id="boardClear">Clear</button>' : ""}
        </div>
        <span class="spacer"></span>
        <span style="display:flex; align-items:center; gap:10px; white-space:nowrap">
          <span class="cat">Drag to reorder</span>
          <button class="btn ghost" id="addColumn" title="Add a column">+ Column</button>
        </span>
      </header>
      <div style="padding:12px">
        <div class="board">
          ${columns().map(col => {
            const s = col.id;
            const mine = list.filter(t => t.status === s);
            const agreements = mous.filter(t => t.status === s);
            const theirs = bridge.filter(t => t.status === s);
            const cards = agreements.concat(mine, theirs);
            return `
            <div class="col" data-col="${esc(s)}" style="--colcolor:${esc(col.color || "")}">
              <header>
                <span class="rail-dot"></span>
                <span class="title" data-rename="${esc(s)}" contenteditable="true" spellcheck="false">${esc(col.title)}</span>
                <b>${cards.length}</b>
                <button class="colmenu" data-colmenu="${esc(s)}" title="Recolour, move or remove this column">⋯</button>
              </header>
              <div class="stack">
                ${cards.length ? cards.map(t => {
                  if (t.mou) return `
                  <article class="kcard mou" draggable="true" data-mou="${esc(t.id)}"
                           style="--cardcolor:${esc(columnColor(t.status))}"
                           title="This is the partner record — moving it changes their stage">
                    <span class="kt">${esc(t.title)}</span>
                    <span class="kmeta">
                      <span class="kmouchip">MoU</span>
                      ${t.owner ? `<span>${esc(t.owner)}</span>` : "<span>unassigned</span>"}
                      <span class="num ${isOverdue(t.due) ? "overdue" : ""}" style="margin-left:auto">${fmtDate(t.due)}</span>
                    </span>
                  </article>`;
                  if (t.bridged) return `
                  <article class="kcard bridged" draggable="true" data-bridged="${esc(t.id)}"
                           title="Lives on the workforce board — drag to change its status there, click to open it">
                    <span class="kt">${esc(t.title)}</span>
                    <span class="kmeta">
                      <span class="kbridge">${esc(t.sourceId)}</span>
                      ${t.sourceStatus && t.sourceStatus !== t.status ? `<span>${esc(t.sourceStatus)}</span>` : ""}
                      ${t.owner ? `<span>${esc(t.owner)}</span>` : "<span>unassigned</span>"}
                      <span class="num ${isOverdue(t.due) ? "overdue" : ""}" style="margin-left:auto">${fmtDate(t.due)}</span>
                    </span>
                  </article>`;
                  const p = DB.partners.find(x => x.id === t.partner);
                  const isLate = isOverdue(t.due) && !isDone(t.status);
                  return `
                  <article class="kcard ${isDone(t.status) ? "isdone" : ""}" draggable="true" data-card="${t.id}" data-s="${t.status}" style="--cardcolor:${esc(columnColor(t.status))}">
                    <span class="kt">${esc(t.title)}</span>
                    ${p ? `<span class="kpartner">${esc(p.name)}</span>` : ""}
                    <span class="kmeta">
                      ${t.owner ? `<span>${esc(t.owner)}</span>` : "<span>unassigned</span>"}
                      <span class="num ${isLate ? "overdue" : ""}" style="margin-left:auto">${fmtDate(t.due)}</span>
                    </span>
                  </article>`;
                }).join("") : '<div class="colempty">Nothing here</div>'}
              </div>
              <button class="coladd" data-addto="${esc(s)}">+ Add a task</button>
            </div>`;
          }).join("")}
        </div>
        ${bridged.length || bridgeStale ? `<div class="bridgenote"><i></i>
          ${bridge.length} task${bridge.length === 1 ? "" : "s"} labelled
          <b style="font-weight:600">${esc(BRIDGE.label)}</b> from the
          <a href="${BRIDGE.board}" target="_blank" rel="noopener">workforce board</a>
          — drag one and it moves there too.
          ${bridgeStale ? `<span style="color:var(--ochre)">Not current: ${esc(bridgeError)}</span>` : ""}</div>` : ""}
      </div>
    </div>
  </div>`;
}

/* Columns are edited in place. Every change is an ordinary board edit, so it
   commits and syncs like any other. */
function ensureColumns(){
  if (!Array.isArray(DB.columns) || !DB.columns.length) DB.columns = structuredClone(DEFAULT_COLUMNS);
}
const slug = t => (t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "col") ;

function addMilestone(){
  const name = prompt("Milestone:", "");
  if (!name || !name.trim()) return;
  const date = prompt("Date it is due (YYYY-MM-DD):", "");
  if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date.trim())){ if (date) toast("Needs a date like 2026-12-19"); return; }
  const m = {id:uid("m"), name:name.trim(), date:date.trim(), hit:false, note:""};
  DB.milestones.push(m);
  logEvent({kind:"change", refType:"milestone", ref:m.id, body:"Added — due " + fmtDate(m.date)});
  save(); render();
}

function milestoneMenu(id){
  const i = DB.milestones.findIndex(m => m.id === id);
  if (i < 0) return;
  const m = DB.milestones[i];
  const choice = prompt('"' + m.name + '" — due ' + fmtDate(m.date) + "\n\n" +
    "  rename   change its name\n  date     change the date\n  note     what it means\n  remove   delete it\n\nType one:", "date");
  if (!choice) return;
  const c = choice.trim().toLowerCase();
  if (c === "rename"){
    const v = prompt("Name:", m.name); if (!v || !v.trim()) return; m.name = v.trim();
  } else if (c === "date"){
    const v = prompt("Date (YYYY-MM-DD):", m.date);
    if (!v || !/^\d{4}-\d{2}-\d{2}$/.test(v.trim())){ if (v) toast("Needs a date like 2026-12-19"); return; }
    m.date = v.trim();
  } else if (c === "note"){
    const v = prompt("What it means:", m.note || ""); if (v === null) return; m.note = v.trim();
  } else if (c === "remove"){
    if (!confirm('Remove "' + m.name + '"?')) return;
    DB.milestones.splice(i, 1);
    logEvent({kind:"change", refType:"board", ref:"", body:"Removed the milestone " + m.name});
  } else { toast("Type rename, date, note or remove"); return; }
  save(); render();
}

function addColumn(){
  const title = prompt("New column name:", "");
  if (!title || !title.trim()) return;
  ensureColumns();
  let id = slug(title.trim()), n = 2;
  while (DB.columns.some(c => c.id === id)) id = slug(title.trim()) + "-" + n++;
  DB.columns.push({id, title:title.trim(), color:"#6B7C99"});
  logEvent({kind:"change", refType:"board", ref:"", body:"Added the column " + title.trim()});
  save(); renderRail(); render();
}

function columnMenu(id){
  ensureColumns();
  const i = DB.columns.findIndex(c => c.id === id);
  if (i < 0) return;
  const col = DB.columns[i];
  const used = DB.tasks.filter(t => t.status === id).length;
  const choice = prompt(
    'Column "' + col.title + '"' + (used ? " — " + used + " task" + (used === 1 ? "" : "s") : "") + "\n\n" +
    "  colour   set a new colour\n" +
    "  left     move it left\n" +
    "  right    move it right\n" +
    "  remove   delete it" + (used ? " (its tasks move to " + DB.columns[0].title + ")" : "") + "\n\n" +
    "Type one:", "colour");
  if (!choice) return;
  const c = choice.trim().toLowerCase();

  if (c === "colour" || c === "color"){
    const v = prompt("Colour as a hex value:", col.color || "#6B7C99");
    if (!v || !/^#[0-9a-f]{6}$/i.test(v.trim())) { if (v) toast("That is not a hex colour like #4C8C7A"); return; }
    col.color = v.trim();
  } else if (c === "left" || c === "right"){
    const j = c === "left" ? i - 1 : i + 1;
    if (j < 0 || j >= DB.columns.length) return;
    DB.columns.splice(j, 0, DB.columns.splice(i, 1)[0]);
  } else if (c === "remove"){
    if (DB.columns.length <= 1){ toast("A board needs at least one column"); return; }
    if (!confirm(used ? "Remove \"" + col.title + "\"? Its " + used + " task" + (used === 1 ? "" : "s") +
                        " move to " + DB.columns.find(x => x.id !== id).title + "."
                      : "Remove \"" + col.title + "\"?")) return;
    DB.columns.splice(i, 1);
    const fallback = DB.columns[0].id;
    DB.tasks.forEach(t => { if (t.status === id) t.status = fallback; });
    logEvent({kind:"change", refType:"board", ref:"", body:"Removed the column " + col.title +
      (used ? "; " + used + " task" + (used === 1 ? "" : "s") + " moved to " + DB.columns[0].title : "")});
  } else { toast("Type colour, left, right or remove"); return; }

  save(); renderRail(); render();
}

function addTaskTo(status){
  const title = prompt("New task in " + statusLabel[status] + ":", "");
  if (!title || !title.trim()) return;
  const t = {id:uid("t"), ws:DB.workstreams[0] ? DB.workstreams[0].id : "WS1",
             title:title.trim(), owner:"", start:"", due:"", status, partner:"", labels:[]};
  DB.tasks.push(t);
  logEvent({kind:"change", refType:"task", ref:t.id, body:"Added to " + statusLabel[status]});
  save(); renderRail(); render();
}

/* Moving an MoU card is moving the partner. Only the three columns that have a
   clear meaning for an agreement are accepted — anything else would be inventing
   a stage the CRM does not have. */
function moveMou(id, status){
  const p = DB.partners.find(x => x.id === id.slice(4));
  if (!p) return;
  const stage = MOU_STAGE[status];
  if (!stage){
    const allowed = Object.keys(MOU_STAGE).map(c => statusLabel[c]).join(", ");
    toast("An MoU can move to " + allowed + " — the rest have no meaning for an agreement");
    return;
  }
  if (p.stage === stage) return;
  const was = p.stage;
  p.stage = stage;
  logEvent({kind:"change", refType:"partner", ref:p.id,
    body: stageLabel(was) + " → " + stageLabel(stage) + " (moved on the board)"});
  save(); renderRail(); render();
  toast(p.name + " → " + stageLabel(stage));
}

/* Push a status change back to the other board. Optimistic, because the round
   trip is a commit — but it puts the card back if the write is refused. */
async function moveBridged(id, status){
  const t = bridged.find(x => x.id === id);
  if (!t || t.status === status) return;
  const was = t.status, wasSource = t.sourceStatus;
  t.status = status; t.sourceStatus = status;
  render();
  document.querySelector('[data-bridged="' + CSS.escape(id) + '"]')?.classList.add("saving");

  if (!useProxy){
    t.status = was; t.sourceStatus = wasSource; render();
    toast("Changing the other board needs the backend running");
    return;
  }
  try {
    const res = await fetch(proxyBase + "/api/bridge", {
      method:"PUT",
      headers:{"content-type":"application/json", "authorization":"Bearer " + (apiToken || "")},
      body: JSON.stringify({id: t.sourceId, status})
    });
    if (res.ok){
      try { localStorage.setItem(BRIDGE_KEY, JSON.stringify({at: Date.now(), tasks: bridged})); } catch (e) {}
      render();
      toast(t.sourceId + " → " + statusLabel[status] + " on the workforce board");
      return;
    }
    const out = await res.json().catch(() => ({}));
    t.status = was; t.sourceStatus = wasSource; render();
    toast(out.error === "bridge_read_only"
      ? "The backend has no token that can write to the workforce board"
      : out.error === "unauthorized" ? "Set the password under Data to change the other board"
      : "Could not update the workforce board" + (out.detail ? " — " + out.detail.slice(0, 60) : ""));
  } catch (e) {
    t.status = was; t.sourceStatus = wasSource; render();
    toast("Could not reach the backend");
  }
}

function wireBoard(){
  const addCol = document.getElementById("addColumn");
  if (addCol) addCol.onclick = addColumn;
  document.querySelectorAll("[data-colmenu]").forEach(b =>
    b.onclick = e => { e.stopPropagation(); columnMenu(b.dataset.colmenu); });
  document.querySelectorAll("[data-addto]").forEach(b =>
    b.onclick = () => addTaskTo(b.dataset.addto));

  /* Rename in place, saving as it is typed rather than on blur — the same rule
     as every other field here, and it does not depend on a blur event that a
     background tab or a stray click can swallow. Escape puts it back. */
  document.querySelectorAll("[data-rename]").forEach(el => {
    const id = el.dataset.rename;
    const original = el.textContent;
    let settle;
    const commit = () => {
      const title = el.textContent.trim();
      if (!title || title === original) return;
      ensureColumns();
      const col = DB.columns.find(c => c.id === id);
      if (!col || col.title === title) return;
      col.title = title;
      logEvent({kind:"change", refType:"board", ref:"",
        body: 'Renamed the column "' + original + '" to "' + title + '"'});
      save(); renderRail();
    };
    el.oninput = () => { clearTimeout(settle); settle = setTimeout(commit, 900); };
    el.onkeydown = ev => {
      if (ev.key === "Enter"){ ev.preventDefault(); clearTimeout(settle); commit(); el.blur(); }
      if (ev.key === "Escape"){ clearTimeout(settle); el.textContent = original; el.blur(); }
    };
    el.onblur = () => { clearTimeout(settle); commit(); };
  });

  const ow = document.getElementById("boardOwner");
  if (ow) ow.onchange = e => { boardOwner = e.target.value; render(); };
  const q = document.getElementById("boardQ");
  if (q) q.oninput = e => {
    boardQ = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("boardQ");
    if (el){ el.focus(); el.setSelectionRange(pos, pos); }
  };
  const cl = document.getElementById("boardClear");
  if (cl) cl.onclick = () => { boardOwner = boardQ = ""; render(); };

  let dragId = null;
  document.querySelectorAll(".kcard").forEach(card => {
    card.addEventListener("dragstart", e => {
      dragId = card.dataset.card || card.dataset.bridged || card.dataset.mou;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragId);
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      document.querySelectorAll(".col.over").forEach(c => c.classList.remove("over"));
    });
  });

  /* Where would a drop land? Among this column's own cards — bridged ones
     belong to the other board and are not reorderable. */
  const insertionPoint = (col, y, movingId) => {
    const cards = [...col.querySelectorAll(".kcard[data-card]")]
      .filter(c => c.dataset.card !== movingId);
    for (let i = 0; i < cards.length; i++){
      const r = cards[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) return {index: i, before: cards[i]};
    }
    return {index: cards.length, before: null};
  };
  const clearMarks = () => {
    document.querySelectorAll(".kcard.dropbefore").forEach(c => c.classList.remove("dropbefore"));
    document.querySelectorAll(".stack.dropend").forEach(c => c.classList.remove("dropend"));
  };

  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => {
      e.preventDefault();
      col.classList.add("over");
      clearMarks();
      const {before} = insertionPoint(col, e.clientY, dragId);
      if (before) before.classList.add("dropbefore");
      else col.querySelector(".stack").classList.add("dropend");
    });
    col.addEventListener("dragleave", e => {
      if (!col.contains(e.relatedTarget)){ col.classList.remove("over"); clearMarks(); }
    });
    col.addEventListener("drop", e => {
      e.preventDefault();
      col.classList.remove("over");
      clearMarks();
      const id = dragId || e.dataTransfer.getData("text/plain");
      const status = col.dataset.col;

      /* A task from the other board: its status lives in that repository, so
         the move has to go back there. */
      if (String(id).startsWith("wf:")) return moveBridged(id, status);

      /* An MoU card has no state of its own — it is the partner's stage. */
      if (String(id).startsWith("mou:")) return moveMou(id, status);

      const t = DB.tasks.find(x => x.id === id);
      if (!t) return;
      const moved = t.status !== status;
      const was = t.status;
      const {index} = insertionPoint(col, e.clientY, id);

      /* Rewrite this column's order so the sequence is explicit rather than
         implied by whatever the array happened to look like. */
      const rank = x => (typeof x.order === "number" ? x.order : Number.MAX_SAFE_INTEGER);
      const rest = DB.tasks
        .filter(x => x.status === status && x.id !== id)
        .sort((a, b) => (rank(a) - rank(b)) || (a.due || "9999").localeCompare(b.due || ""));
      t.status = status;
      rest.splice(Math.min(index, rest.length), 0, t);
      rest.forEach((x, i) => { x.order = i; });

      if (moved) logEvent({kind:"change", refType:"task", ref:t.id,
        body:statusLabel[was] + " → " + statusLabel[status]});
      save(); renderRail(); render();
      if (moved) toast("Moved to " + statusLabel[status]);
    });
  });
}

/* ── MoUs as work ─────────────────────────────────────────────────────
   Each MoU in flight is a card, derived from its partner record rather than
   stored, so the two can never disagree. The board vocabulary already fits:
   negotiating is Focus, sent and waiting on them is Review, signed is Done.
   Dragging one moves the partner's stage — the card has no state of its own. */
const MOU_COLUMN = {aligning:"focus", mou_sent:"review", mou_signed:"done", active:"done"};
const MOU_STAGE  = {focus:"aligning", review:"mou_sent", done:"mou_signed"};

/* Which workstream MoUs belong to. Mark one with "mou": true in
   workstreams.json to move them; Legal & regulatory is the sensible default,
   since an MoU is the instrument that carries rights and obligations. */
function mouWs(){
  const w = DB.workstreams || [];
  return (w.find(x => x.mou) || w.find(x => x.id === "WS3") || w[0] || {id:"WS3", name:"Legal & regulatory"});
}

/* Advisors and network contacts are people, and people do not sign the MoU.
   They move through the same stages because the stages describe a
   conversation, but they must never turn into an MoU card or be counted as a
   counterparty. */
const PEOPLE_CATS = new Set(["advisor", "network"]);
const isCounterparty = p => !PEOPLE_CATS.has(p.cat);

/* Everything actually sitting on the board: real tasks, the MoU cards derived
   from partner stages, and whatever the workforce bridge is showing. The rail
   badges used to count DB.tasks alone and read 0 while nine cards sat in the
   columns. */
function allCards(){
  return DB.tasks.concat(mouCards(), bridged);
}

function mouCards(){
  return DB.partners
    .filter(isCounterparty)
    .filter(p => MOU_COLUMN[p.stage])
    .map(p => ({
      id: "mou:" + p.id,
      partnerId: p.id,
      title: "MoU — " + p.name,
      ws: mouWs().id,
      status: MOU_COLUMN[p.stage],
      stage: p.stage,
      owner: p.owner || "",
      due: p.nextDate || "",
      mou: true
    }));
}

/* ── Timeline ─────────────────────────────────────────────────────── */

function planGantt(){
  /* MoUs belong on the timeline too, but only once they have a date to sit on;
     the legend says how many are missing rather than leaving them out silently. */
  const mous = mouCards();
  const ts = DB.tasks.filter(t => t.due).concat(mous.filter(m => m.due));
  const undatedMous = mous.length - mous.filter(m => m.due).length;
  if (!ts.length) return '<div class="card"><div class="empty">No dated tasks to plot yet.</div></div>';

  const starts = ts.map(t => t.start || shiftDays(t.due, -21));
  const ends = ts.map(t => t.due).concat(DB.milestones.map(m => m.date));
  const first = starts.concat(DB.milestones.map(m => m.date)).sort()[0];
  const last = ends.sort()[ends.length - 1];
  const months = monthsBetween(first, last);
  const t0 = toMs(monthStart(months[0]));
  const t1 = toMs(monthEnd(months[months.length - 1])) + DAY;
  const pct = d => ((toMs(d) - t0) / (t1 - t0) * 100);
  const clamp = n => Math.max(0, Math.min(100, n));

  const bar = (from, to) => {
    const l = clamp(pct(from));
    const w = Math.max(0.6, clamp(pct(to) + (100 / months.length / 30)) - l);
    return `left:${l.toFixed(3)}%; width:${w.toFixed(3)}%`;
  };

  const todayLine = pct(TODAY) >= 0 && pct(TODAY) <= 100
    ? `<div class="today" style="left:${pct(TODAY).toFixed(3)}%"></div>` : "";

  const rows = ts.slice()
    .sort((a, b) => (a.start || shiftDays(a.due, -21)).localeCompare(b.start || shiftDays(b.due, -21)))
    .map(t => {
      const st = t.start || shiftDays(t.due, -21);
      const late = isOverdue(t.due) && !isDone(t.status);
      return `
      <div class="grow">
        <div class="glabel" data-task="${t.id}" style="cursor:pointer">
          <span class="t" title="${esc(t.title)}">${esc(t.title)}</span>
          ${t.owner ? `<span class="gcode" style="margin-left:auto">${esc(t.owner)}</span>` : ""}
        </div>
        <div class="gtrack">
          ${todayLine}
          <div class="gbar ${t.status} ${late ? "late" : ""}" data-task="${t.id}" data-drag="task"
               style="${bar(st, t.due)}"
               title="${esc(t.title)} — ${fmtDate(st)} → ${fmtDate(t.due)}${late ? " (overdue)" : ""}"
            ><i class="grip l"></i><i class="grip r"></i></div>
        </div>
      </div>`;
    }).join("");

  return `
  <section class="card ws" style="margin-bottom:14px">
    <div class="gantt" style="--n:${months.length}" data-t0="${monthStart(months[0])}" data-t1="${shiftDays(monthEnd(months[months.length - 1]), 1)}">
      <div class="inner">
        <div class="ghead">
          <div class="glabel"><span class="eyebrow">Task</span></div>
          <div class="gmonths" style="grid-template-columns:repeat(${months.length},1fr)">
            ${months.map(mo => `<span class="${[1,4,7,10].includes(mo.m) ? "q" : ""}">${MONTHS[mo.m - 1]}${mo.m === 1 || mo === months[0] ? " " + String(mo.y).slice(2) : ""}</span>`).join("")}
          </div>
        </div>

        <div class="grow msrow">
          <div class="glabel"><span class="eyebrow">Milestones</span></div>
          <div class="gtrack">
            ${todayLine}
            ${DB.milestones.map((m, i) => `
              <div class="gms ${m.hit ? "hit" : ""}" style="left:${clamp(pct(m.date)).toFixed(3)}%"
                   data-drag="ms" data-msid="${m.id}"
                   title="M${i + 1} — ${esc(m.name)} · ${fmtDate(m.date)} — drag to move"></div>
              <div class="gmslabel" style="left:${clamp(pct(m.date)).toFixed(3)}%">M${i + 1}</div>`).join("")}
          </div>
        </div>

        ${rows}
      </div>
    </div>
    <div class="glegend">
      <span><b></b>Backlog / Weekly</span>
      <span><b class="focus"></b>Focus</span>
      <span><b class="review"></b>Review</span>
      <span><b class="done"></b>Done</span>
      <span><b class="today"></b>Today, ${fmtDate(TODAY)}</span>
      <span style="margin-left:auto">Drag to reschedule · dashed outline = past its due date</span>
      ${undatedMous ? `<span style="width:100%; margin-left:0!important; color:var(--ochre)">
        ${undatedMous} MoU${undatedMous === 1 ? " is" : "s are"} not plotted — give the partner a next-move date and it appears here.</span>` : ""}
    </div>
  </section>`;
}

/* Dragging on the timeline. Bars move or resize by whole days; milestone
   diamonds move their date. Nothing is written until the pointer is released,
   so an abandoned drag changes nothing. */
let ganttScroll = {x:0, y:0};
let drag = null;

function wireGantt(){
  const g = document.querySelector(".gantt");
  if (!g) return;

  g.scrollLeft = ganttScroll.x;
  g.scrollTop = ganttScroll.y;
  g.addEventListener("scroll", () => { ganttScroll = {x:g.scrollLeft, y:g.scrollTop}; }, {passive:true});

  const spanDays = Math.round((toMs(g.dataset.t1) - toMs(g.dataset.t0)) / DAY);
  const tip = document.getElementById("dragtip");

  g.addEventListener("pointerdown", e => {
    const handle = e.target.closest("[data-drag]");
    if (!handle || e.button !== 0) return;
    const track = handle.parentElement;
    const kind = handle.dataset.drag;
    const rec = kind === "ms"
      ? DB.milestones.find(m => m.id === handle.dataset.msid)
      : DB.tasks.find(t => t.id === handle.dataset.task);
    if (!rec) return;

    const mode = kind === "ms" ? "ms"
      : e.target.classList.contains("grip")
        ? (e.target.classList.contains("l") ? "start" : "end")
        : "move";

    drag = {
      handle, rec, mode, kind, moved:false,
      x0:e.clientX,
      perDay: track.clientWidth / spanDays,
      pctDay: 100 / spanDays,
      left0: parseFloat(handle.style.left) || 0,
      width0: parseFloat(handle.style.width) || 0,
      s0: kind === "ms" ? rec.date : (rec.start || shiftDays(rec.due, -21)),
      d0: kind === "ms" ? rec.date : rec.due
    };
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    handle.classList.add("dragging");
    e.preventDefault();
  });

  g.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x0;
    if (!drag.moved && Math.abs(dx) < 3) return;
    drag.moved = true;
    const days = Math.round(dx / drag.perDay);
    const shift = days * drag.pctDay;
    const h = drag.handle;

    if (drag.mode === "move" || drag.mode === "ms"){
      h.style.left = (drag.left0 + shift) + "%";
    } else if (drag.mode === "start"){
      const w = Math.max(drag.pctDay, drag.width0 - shift);
      h.style.left = (drag.left0 + drag.width0 - w) + "%";
      h.style.width = w + "%";
    } else {
      h.style.width = Math.max(drag.pctDay, drag.width0 + shift) + "%";
    }

    const [ns, nd] = previewDates(drag, days);
    tip.textContent = drag.kind === "ms" ? fmtDate(ns) : fmtDate(ns) + " → " + fmtDate(nd);
    tip.style.left = e.clientX + "px";
    tip.style.top = e.clientY + "px";
    tip.classList.add("show");
  });

  const finish = e => {
    if (!drag) return;
    const d = drag; drag = null;
    d.handle.classList.remove("dragging");
    tip.classList.remove("show");

    if (!d.moved){
      if (d.kind === "task") taskDrawer(d.rec.id);
      else { d.rec.hit = !d.rec.hit; save(); render(); }
      return;
    }
    const days = Math.round((e.clientX - d.x0) / d.perDay);
    const [ns, nd] = previewDates(d, days);
    if (d.kind === "ms") d.rec.date = ns;
    else { d.rec.start = ns; d.rec.due = nd; }
    save(); render();
    toast(d.kind === "ms" ? "Milestone moved to " + fmtDate(ns) : fmtDate(ns) + " → " + fmtDate(nd));
  };
  g.addEventListener("pointerup", finish);
  g.addEventListener("pointercancel", () => {
    if (!drag) return;
    drag.handle.classList.remove("dragging");
    drag = null; tip.classList.remove("show"); render();
  });
}

function previewDates(d, days){
  if (d.kind === "ms") return [shiftDays(d.s0, days), ""];
  if (d.mode === "move") return [shiftDays(d.s0, days), shiftDays(d.d0, days)];
  if (d.mode === "start"){
    const ns = shiftDays(d.s0, days);
    return [ns > d.d0 ? d.d0 : ns, d.d0];
  }
  const nd = shiftDays(d.d0, days);
  return [d.s0, nd < d.s0 ? d.s0 : nd];
}

function wireActivity(){
  const a = document.getElementById("actActor");
  if (a) a.onchange = e => { actFilter.actor = e.target.value; render(); };
  const k = document.getElementById("actKind");
  if (k) k.onchange = e => { actFilter.kind = e.target.value; render(); };
  const q = document.getElementById("actQ");
  if (q) q.oninput = e => {
    actFilter.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("actQ");
    if (el){ el.focus(); el.setSelectionRange(pos, pos); }
  };
  const c = document.getElementById("actClear");
  if (c) c.onclick = () => { actFilter = {actor:"", kind:"", q:""}; render(); };
}

/* A thread plus composer, embedded in the partner and task drawers. */
function threadBlock(refType, ref){
  const list = eventsFor(refType, ref);
  return `
  <div>
    <span class="eyebrow">Thread${list.length ? " · " + list.length : ""}</span>
    <div class="thread" style="margin-bottom:9px">
      ${list.length ? list.map(e => eventRow(e, false)).join("")
        : '<p style="color:var(--ink-3); font-size:12.5px; margin:6px 0 0">Nothing yet. Notes you add here are visible to everyone, including agents.</p>'}
    </div>
    <div class="composer">
      <textarea id="cmtBody" rows="2" placeholder="Add a note…"></textarea>
      <div class="row">
        <select id="cmtKind">
          ${Object.entries(EVENT_KINDS).filter(([k]) => k !== "change")
            .map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("")}
        </select>
        <button class="btn" id="cmtAdd">Post</button>
      </div>
    </div>
  </div>`;
}

function wireThread(refType, ref, after){
  const btn = drawer.querySelector("#cmtAdd");
  if (!btn) return;
  btn.onclick = () => {
    const body = drawer.querySelector("#cmtBody").value.trim();
    if (!body){ toast("Write something first"); return; }
    if (!me){
      const name = prompt("Your name, so the note is attributable:", "");
      if (!name) return;
      me = name.trim(); try { localStorage.setItem(ME_KEY, me); } catch (e) {}
    }
    logEvent({kind:drawer.querySelector("#cmtKind").value, refType, ref, body});
    save(); renderRail();
    if (after) after();
    toast("Posted");
  };
}

const drawer = document.getElementById("drawer");
const scrim = document.getElementById("scrim");

/* Hold the board still while a dialog is open — scrolling the page behind a
   modal loses your place for no reason. */
const lockScroll = on => { document.documentElement.style.overflow = on ? "hidden" : ""; };

function closeDrawer(){
  drawer.classList.remove("open"); scrim.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true"); drawer.innerHTML = "";
  lockScroll(false);
}
scrim.onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function openDrawer(html){
  drawer.innerHTML = html;
  lockScroll(true);
  drawer.classList.add("open"); scrim.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  const f = drawer.querySelector("input,select,textarea");
  if (f) f.focus();
  drawer.querySelectorAll("[data-close]").forEach(b => b.onclick = closeDrawer);
}

function field(label, name, value, type){
  return `<label class="field"><span>${label}</span>
    <input type="${type || "text"}" name="${name}" value="${esc(value)}"></label>`;
}

function partnerDrawer(id){
  const isNew = !id;
  const p = isNew
    ? {id:uid("p"), name:"", cat:"carrier", country:"", why:"", ask:"", stage:"identified",
       owner:"", contact:"", next:"", nextDate:"", notes:""}
    : DB.partners.find(x => x.id === id);
  if (!p) return;

  openDrawer(`
    <header>
      <h3>${isNew ? "New partner" : esc(p.name)}</h3>
      <button class="btn ghost" data-close>Close</button>
    </header>
    <div class="body">
      ${field("Organisation", "name", p.name)}
      <div style="display:grid; grid-template-columns:1fr 96px; gap:10px">
        <label class="field"><span>Type</span><select name="cat">
          ${Object.entries(CATEGORIES).map(([k, c]) => `<option value="${k}" ${p.cat === k ? "selected" : ""}>${c.label}</option>`).join("")}
        </select></label>
        ${field("Country", "country", p.country)}
      </div>
      <label class="field"><span>Stage</span><select name="stage">
        ${ALL_STAGES.map(s => `<option value="${s.id}" ${p.stage === s.id ? "selected" : ""}>${s.label} — ${s.hint}</option>`).join("")}
      </select></label>
      <label class="field"><span>Why them</span><textarea name="why" rows="2">${esc(p.why)}</textarea></label>
      <label class="field"><span>What we want from them</span><textarea name="ask" rows="2">${esc(p.ask)}</textarea></label>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
        ${field("Owner (us)", "owner", p.owner)}
        ${field("Contact (them)", "contact", p.contact)}
      </div>
      <div style="display:grid; grid-template-columns:1fr 130px; gap:10px">
        ${field("Next move", "next", p.next)}
        ${field("Due", "nextDate", p.nextDate, "date")}
      </div>
      <label class="field"><span>Notes</span><textarea name="notes" rows="5">${esc(p.notes)}</textarea></label>
      ${isNew ? "" : threadBlock("partner", p.id)}
    </div>
    <footer>
      ${isNew ? "" : '<button class="btn danger" data-del>Delete</button>'}
      <span class="spacer"></span>
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" data-save>Save</button>
    </footer>`);

  wireThread("partner", p.id, () => partnerDrawer(p.id));

  drawer.querySelector("[data-save]").onclick = () => {
    const wasStage = p.stage;
    drawer.querySelectorAll("[name]").forEach(el => p[el.name] = el.value.trim());
    if (!p.name){ toast("Give it a name first"); return; }
    delete p.seeded;
    if (isNew) DB.partners.push(p);
    else if (wasStage !== p.stage){
      logEvent({kind:"change", refType:"partner", ref:p.id,
        body:stageLabel(wasStage) + " → " + stageLabel(p.stage)});
    }
    save(); closeDrawer(); renderRail(); render(); toast(isNew ? "Partner added" : "Saved");
  };
  const del = drawer.querySelector("[data-del]");
  if (del) del.onclick = () => {
    if (!confirm("Delete " + p.name + "? This cannot be undone.")) return;
    DB.partners = DB.partners.filter(x => x.id !== p.id);
    save(); closeDrawer(); renderRail(); render(); toast("Deleted");
  };
}

  openDrawer(`
    <header><h3>${isNew ? "New task" : "Task"}</h3><button class="btn ghost" data-close>Close</button></header>
    <div class="body">
      <label class="field"><span>Task</span><textarea name="title" rows="2">${esc(t.title)}</textarea></label>
      <label class="field"><span>Status</span><select name="status">
        ${STATUS_CYCLE.map(s => `<option value="${s}" ${t.status === s ? "selected" : ""}>${statusLabel[s]}</option>`).join("")}
      </select></label>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
        ${field("Start", "start", t.start || "", "date")}
        ${field("Due", "due", t.due, "date")}
      </div>
      ${field("Owner", "owner", t.owner)}
      <label class="field"><span>Linked partner</span><select name="partner">
        <option value="">— none —</option>
        ${DB.partners.slice().sort((a, b) => a.name.localeCompare(b.name))
          .map(p => `<option value="${p.id}" ${t.partner === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
      </select></label>
      ${isNew ? "" : threadBlock("task", t.id)}
    </div>
    <footer>
      ${isNew ? "" : '<button class="btn danger" data-del>Delete</button>'}
      <span class="spacer"></span>
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" data-save>Save</button>
    </footer>`);

  wireThread("task", t.id, () => taskDrawer(t.id));

  drawer.querySelector("[data-save]").onclick = () => {
    const wasStatus = t.status;
    drawer.querySelectorAll("[name]").forEach(el => t[el.name] = el.value.trim());
    if (!t.title){ toast("Give it a title first"); return; }
    if (isNew) DB.tasks.push(t);
    else if (wasStatus !== t.status){
      logEvent({kind:"change", refType:"task", ref:t.id,
        body:statusLabel[wasStatus] + " → " + statusLabel[t.status]});
    }
    save(); closeDrawer(); renderRail(); render(); toast(isNew ? "Task added" : "Saved");
  };
  const del = drawer.querySelector("[data-del]");
  if (del) del.onclick = () => {
    DB.tasks = DB.tasks.filter(x => x.id !== t.id);
    save(); closeDrawer(); renderRail(); render(); toast("Deleted");
  };
}

/* A note against the board as a whole, or aimed at a named actor — the way a
   person answers an agent's question without opening the record it came from. */
function noteDrawer(){
  openDrawer(`
    <header><h3>Add a note</h3><button class="btn ghost" data-close>Close</button></header>
    <div class="body">
      <label class="field"><span>Note</span><textarea id="nBody" rows="5" placeholder="What happened, what you found, or what someone should pick up."></textarea></label>
      <label class="field"><span>Kind</span><select id="nKind">
        ${Object.entries(EVENT_KINDS).filter(([k]) => k !== "change")
          .map(([k, v]) => `<option value="${k}">${v.label} — ${v.hint}</option>`).join("")}
      </select></label>
      <label class="field"><span>About</span><select id="nRef">
        <option value="board:">The board generally</option>
        <optgroup label="Partners">
          ${DB.partners.slice().sort((a, b) => a.name.localeCompare(b.name))
            .map(p => `<option value="partner:${p.id}">${esc(p.name)}</option>`).join("")}
        </optgroup>
        <optgroup label="Tasks">
          ${DB.tasks.map(t => `<option value="task:${t.id}">${esc(t.title)}</option>`).join("")}
        </optgroup>
      </select></label>
      <label class="field"><span>Directed at (optional)</span>
        <input type="text" id="nTo" placeholder="e.g. partner-researcher"></label>
      <div class="note">Anything here is readable by every agent working on this board, and by anyone with the link. It is a shared log, not a private note.</div>
    </div>
    <footer><span class="spacer"></span>
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="nSave">Post</button></footer>`);

  drawer.querySelector("#nSave").onclick = () => {
    const body = drawer.querySelector("#nBody").value.trim();
    if (!body){ toast("Write something first"); return; }
    if (!me){
      const name = prompt("Your name, so the note is attributable:", "");
      if (!name) return;
      me = name.trim(); try { localStorage.setItem(ME_KEY, me); } catch (e) {}
    }
    const [refType, ref] = drawer.querySelector("#nRef").value.split(":");
    const to = drawer.querySelector("#nTo").value.trim();
    logEvent({
      kind: drawer.querySelector("#nKind").value,
      refType, ref: ref || "", body,
      to: to || undefined
    });
    save(); closeDrawer(); renderRail(); render(); toast("Posted");
  };
}

function dataDrawer(){
  const state = {
    live:    localBackend
      ? `This backend is in <b>development mode</b>: it writes to its own working tree at revision <code>${revOf(DB)}</code> and does not commit. Your changes are saved to disk but reach nobody else until someone commits them. Give the server a <code style="font-family:var(--data)">GITHUB_TOKEN</code> to have it commit to <code>${esc(ghRepo)}</code> instead.`
      : `Connected to <code>${esc(ghRepo)}</code> at revision <code>${revOf(DB)}</code>. Every save is one commit under <code>data/</code> — git is the database and the audit trail.`,
    ahead:   apiToken ? `Pushing your edits to the board…`
                      : `The board is reachable but this browser has no write token, so your edits stay local. Set the token below.`,
    behind:  `The board is at revision <code>${revOf(shared)}</code>; your unpushed edits started from <code>${sync.base}</code>. Use the banner to resolve it.`,
    offline: `The board's backend is unreachable right now. You are working from this browser's copy; it reconnects automatically and unpushed edits go up when it returns.`
  }[syncState];

  openDrawer(`
    <header><h3>Data</h3><button class="btn ghost" data-close>Close</button></header>
    <div class="body">
      <div class="note" style="${syncState === "live" ? "border-left-color:var(--accent); background:var(--accent-soft)" : ""}">${state}</div>

      <div>
        <span class="eyebrow">Backup</span>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:7px">
          <button class="btn" data-copy>Copy JSON backup</button>
          <button class="btn danger" data-reset>${shared ? "Discard my edits, reload the board" : "Reset to seed"}</button>
        </div>
      </div>

      <label class="field"><span>Your name — used to attribute notes and changes</span>
        <input type="text" id="meName" value="${esc(me)}" placeholder="e.g. Toni"></label>

      <div>
        <span class="eyebrow">GitHub</span>
        <div style="display:grid; gap:9px; margin-top:7px">
          <label class="field"><span>Repository</span>
            <input type="text" id="apiUrl" value="${esc(ghRepo === GH_REPO ? "" : ghRepo)}" placeholder="${esc(GH_REPO)}"></label>
          <label class="field"><span>${useProxy ? "Password — the one your team was given" : "Access token — a fine-grained PAT with Contents: read and write"}</span>
            <input type="password" id="apiTok" value="${esc(apiToken)}" placeholder="${useProxy ? "team password" : "github_pat_…"}"></label>
          <p style="margin:0; color:var(--ink-3); font-size:11.5px">${useProxy
            ? `Without it you can read the board but not change it. Saved as you type, kept in this browser. Your GitHub token is not here — it stays on the server at <code style="font-family:var(--data)">${esc(proxyBase)}</code>, so this password cannot touch the repository directly.`
            : "Without a token you can read the board but not change it. It is saved as you type and stays in this browser — never committed. Scope it to this one repository, and revoke it on GitHub if it leaks."}</p>
          ${apiToken ? `
          <div style="border-top:1px solid var(--line); padding-top:10px; display:grid; gap:7px">
            <span class="eyebrow">Set up another browser or phone</span>
            <p style="margin:0; color:var(--ink-2); font-size:12.5px">Copy a link that configures whichever browser opens it — no pasting the token again. Open it once on your phone and that device is set up for good.</p>
            <button class="btn" data-setuplink style="justify-self:start">Copy setup link</button>
            <p style="margin:0; color:var(--ochre); font-size:11.5px">${useProxy
              ? "That link contains the team password. Anyone who opens it can edit the board."
              : "That link contains your token. Anyone who opens it can edit the board — send it only to yourself or someone you would give the token to."}</p>
          </div>` : ""}
        </div>
      </div>

      <label class="field"><span>Paste JSON to import</span>
        <textarea id="importBox" rows="7" placeholder="Paste an exported file here, then press Import."></textarea></label>
      <button class="btn" data-import style="align-self:flex-start">Import</button>

      <p style="color:var(--ink-3); font-size:12px; margin:0">
        ${DB.partners.length} partners · ${DB.tasks.length} tasks · ${DB.milestones.length} milestones
        · ${DB.activity.length} log entries · last published ${fmtDate(DB.meta.updated)}
      </p>
    </div>
    <footer><span class="spacer"></span><button class="btn" data-close>Done</button></footer>`);

  const copy = async (text, ok) => {
    try { await navigator.clipboard.writeText(text); toast(ok); return true; }
    catch (e) { toast("Clipboard blocked"); return false; }
  };
  drawer.querySelector("[data-copy]").onclick = () => copy(JSON.stringify(DB, null, 2), "Backup copied");

  const linkBtn = drawer.querySelector("[data-setuplink]");
  if (linkBtn) linkBtn.onclick = () => copy(setupLink(), "Setup link copied — open it on the other device");

  const nameBox = drawer.querySelector("#meName");
  if (nameBox) nameBox.oninput = () => {
    me = nameBox.value.trim();
    try { localStorage.setItem(ME_KEY, me); } catch (e) {}
  };
  const apiBox = drawer.querySelector("#apiUrl");
  if (apiBox) apiBox.oninput = () => {
    try { localStorage.setItem(REPO_KEY, apiBox.value.trim()); } catch (e) {}
  };
  /* Save as it is typed, not on blur: pasting a token and closing the drawer
     with Escape would otherwise lose it silently. */
  const tokBox = drawer.querySelector("#apiTok");
  if (tokBox){
    let settle;
    tokBox.oninput = () => {
      apiToken = tokBox.value.trim();
      try {
        if (apiToken) localStorage.setItem(TOKEN_KEY, apiToken);
        else localStorage.removeItem(TOKEN_KEY);
      } catch (e) {}
      clearTimeout(settle);
      settle = setTimeout(async () => {
        if (apiToken){
          /* Pick up the head commit so the first save can write straight away,
             with no reload needed. */
          try { headSha = await headCommit(); liveMode = true; } catch (e) {}
          if (sync.dirty) queuePush();
          syncState = sync.dirty ? "ahead" : "live";
          renderBanner();
        }
        toast(apiToken ? "Token saved — it stays in this browser" : "Token cleared");
      }, 700);
    };
  }

  drawer.querySelector("[data-import]").onclick = () => {
    const raw = document.getElementById("importBox").value.trim();
    if (!raw){ toast("Paste some JSON first"); return; }
    let next;
    try { next = JSON.parse(raw); }
    catch (e){ toast("That is not valid JSON"); return; }
    if (!Array.isArray(next.partners) || !Array.isArray(next.tasks)){
      toast("That file is missing partners or tasks"); return;
    }
    DB = next; save(); closeDrawer(); renderRail(); renderBanner(); render(); toast("Imported");
  };
  drawer.querySelector("[data-reset]").onclick = async () => {
    if (!confirm(shared
      ? "Discard everything in this browser and reload the board from the backend?"
      : "Discard everything in this browser and go back to the built-in seed?")) return;
    if (liveMode){
      try {
        shared = await fetchBoard();
      } catch (e) {}
    }
    const target = shared || SEED;
    DB = structuredClone(target);
    sync = {base:revOf(target), dirty:false};
    save(true); saveSync();
    syncState = liveMode ? "live" : "offline";
    closeDrawer(); renderRail(); renderBanner(); render();
    toast(shared ? "Reloaded the board" : "Reset to seed");
  };
}

/* ══ Global wiring ════════════════════════════════════════════════════ */

document.getElementById("dataBtn").onclick = dataDrawer;

document.getElementById("view").addEventListener("click", e => {
  const nav = e.target.closest("[data-view]");
  if (nav){ go(nav.dataset.view); return; }

  const cyc = e.target.closest("[data-cycle]");
  if (cyc){
    e.stopPropagation();
    const t = DB.tasks.find(x => x.id === cyc.dataset.cycle);
    const was = t.status;
    t.status = STATUS_CYCLE[(STATUS_CYCLE.indexOf(t.status) + 1) % STATUS_CYCLE.length];
    logEvent({kind:"change", refType:"task", ref:t.id, body:statusLabel[was] + " → " + statusLabel[t.status]});
    save(); renderRail(); render(); return;
  }

  const mode = e.target.closest("[data-mode]");
  if (mode){ planMode = mode.dataset.mode; applyRoute(true); render(); return; }

  const ref = e.target.closest("[data-goref]");
  if (ref){
    const [type, id] = ref.dataset.goref.split(":");
    if (type === "partner") partnerDrawer(id);
    else if (type === "task") taskDrawer(id);
    return;
  }

  /* Checked ahead of the row toggle below: the ⋯ button lives inside the row
     it belongs to, which carries [data-ms] — closest() matches that ancestor
     too, and the toggle used to win and fire instead of the menu. */
  const msm = e.target.closest("[data-msmenu]");
  if (msm){ e.stopPropagation(); milestoneMenu(msm.dataset.msmenu); return; }

  const ms = e.target.closest("[data-ms]");
  if (ms && current === "plan"){
    const m = DB.milestones.find(x => x.id === ms.dataset.ms);
    m.hit = !m.hit;
    logEvent({kind:"change", refType:"milestone", ref:m.id, body:m.hit ? "Milestone reached" : "Milestone reopened"});
    save(); render(); return;
  }

  /* Timeline bars and diamonds are driven by pointer events, not clicks. */
  if (e.target.closest(".gbar, .gms")) return;

  const mc = e.target.closest("[data-mou]");
  if (mc){ partnerDrawer(mc.dataset.mou.slice(4)); return; }

  const bc = e.target.closest("[data-bridged]");
  if (bc){ window.open(BRIDGE.board, "_blank", "noopener"); return; }

  const kc = e.target.closest("[data-card]");
  if (kc){ taskDrawer(kc.dataset.card); return; }

  const pr = e.target.closest("[data-partner]");
  if (pr){ partnerDrawer(pr.dataset.partner); return; }

  const tr = e.target.closest("[data-task]");
  if (tr){ taskDrawer(tr.dataset.task); return; }

  if (e.target.id === "addPartner"){ partnerDrawer(null); return; }
  if (e.target.id === "addTask"){ taskDrawer(null); return; }
  if (e.target.id === "newNote"){ noteDrawer(); return; }
  if (e.target.id === "addMilestone"){ addMilestone(); return; }
  if (e.target.id === "fClear"){ filters = {stage:"", cat:"", q:""}; render(); return; }
});

document.getElementById("view").addEventListener("change", e => {
  if (e.target.id === "fStage"){ filters.stage = e.target.value; render(); }
  if (e.target.id === "fCat"){ filters.cat = e.target.value; render(); }
});
document.getElementById("view").addEventListener("input", e => {
  if (e.target.id === "fQ"){
    filters.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("fQ");
    if (el){ el.focus(); el.setSelectionRange(pos, pos); }
  }
});

document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
};

document.getElementById("syncChip").onclick = dataDrawer;

(async function init(){
  const arrivedWithToken = takeTokenFromHash();

  const r = routeFromHash();
  current = r.view;
  if (r.mode) planMode = r.mode;
  syncZone();
  applyRoute(true);

  if (arrivedWithToken) setTimeout(() => toast("This browser can now edit the board"), 400);

  renderRail();
  render();
  renderBanner();
  await connectBackend();
  renderRail();
  renderBanner();
  render();

  /* Non-blocking: the board is useful without it. */
  /* The bridge lands after first paint and adds cards, so the rail badges have
     to be recounted — not just the board redrawn — or Plan and Board sit on a
     number that was already wrong by the time it was painted. */
  loadBridge().then(() => { renderRail(); if (current === "board") render(); });
})();
</script>
