<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lionscraft — Partner & Facility Desk</title>

<style>
/* ─── Tokens ─────────────────────────────────────────────────────────── */
:root{
  --paper:#F5F8F6; --surface:#FFFFFF; --surface-2:#EAF0ED; --surface-3:#DFE8E4;
  --line:#D6E0DB; --line-strong:#BECBC5;
  --ink:#111917; --ink-2:#44534E; --ink-3:#73827D;
  --accent:#0E5F50; --accent-ink:#0B473C; --accent-soft:#D8EAE4;
  --ochre:#8E6410; --ochre-soft:#F2E8D3;
  --danger:#9C3627; --danger-soft:#F6E1DC;
  --bridge:#4C5B8C; --bridge-soft:#E4E7F3;
  --shadow:0 1px 2px rgba(17,25,23,.05), 0 8px 24px -12px rgba(17,25,23,.18);
  --radius:6px;
  --display:ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --data:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0C1211; --surface:#131A18; --surface-2:#1A2422; --surface-3:#222E2B;
    --line:#283431; --line-strong:#3A4844;
    --ink:#E7EFEC; --ink-2:#A2B1AC; --ink-3:#71817C;
    --accent:#4FC2A4; --accent-ink:#7FD6BF; --accent-soft:#12302A;
    --ochre:#D3A24C; --ochre-soft:#31270F;
    --danger:#E08170; --danger-soft:#3A1C17;
    --bridge:#9AA8DC; --bridge-soft:#1E2340;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="light"]{
  --paper:#F5F8F6; --surface:#FFFFFF; --surface-2:#EAF0ED; --surface-3:#DFE8E4;
  --line:#D6E0DB; --line-strong:#BECBC5;
  --ink:#111917; --ink-2:#44534E; --ink-3:#73827D;
  --accent:#0E5F50; --accent-ink:#0B473C; --accent-soft:#D8EAE4;
  --ochre:#8E6410; --ochre-soft:#F2E8D3;
  --danger:#9C3627; --danger-soft:#F6E1DC;
  --bridge:#4C5B8C; --bridge-soft:#E4E7F3;
  --shadow:0 1px 2px rgba(17,25,23,.05), 0 8px 24px -12px rgba(17,25,23,.18);
}
:root[data-theme="dark"]{
  --paper:#0C1211; --surface:#131A18; --surface-2:#1A2422; --surface-3:#222E2B;
  --line:#283431; --line-strong:#3A4844;
  --ink:#E7EFEC; --ink-2:#A2B1AC; --ink-3:#71817C;
  --accent:#4FC2A4; --accent-ink:#7FD6BF; --accent-soft:#12302A;
  --ochre:#D3A24C; --ochre-soft:#31270F;
  --danger:#E08170; --danger-soft:#3A1C17;
  --bridge:#9AA8DC; --bridge-soft:#1E2340;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
/* Reserve the scrollbar gutter always, so opening a dialog cannot shift the
   page sideways when the background stops scrolling. */
html{scrollbar-gutter:stable}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; text-wrap:balance; margin:0; letter-spacing:-.011em}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

.eyebrow{
  font-family:var(--data); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); font-weight:500;
}
.num{font-variant-numeric:tabular-nums; font-family:var(--data)}

/* ─── Shell ──────────────────────────────────────────────────────────── */
.topbar{
  display:flex; align-items:center; gap:16px; padding:0 20px; height:56px;
  border-bottom:1px solid var(--line); background:var(--surface);
  position:sticky; top:0; z-index:40;
}
.mark{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.mark b{font-family:var(--display); font-size:17px; font-weight:600; letter-spacing:-.02em}
.mark span{
  font-family:var(--data); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tools{display:flex; align-items:center; gap:8px; flex:none}
.btn{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius);
  padding:6px 11px; font-size:12.5px; cursor:pointer; color:var(--ink-2);
  transition:background .12s, border-color .12s, color .12s; white-space:nowrap;
}
.btn:hover{background:var(--surface-2); color:var(--ink); border-color:var(--ink-3)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .btn.primary, :root:not([data-theme="light"]) .btn.primary{}
@media (prefers-color-scheme: dark){.btn.primary{color:#08110F}}
:root[data-theme="dark"] .btn.primary{color:#08110F}
:root[data-theme="light"] .btn.primary{color:#fff}
.btn.primary:hover{filter:brightness(1.08); background:var(--accent); color:inherit}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger); border-color:var(--line-strong)}
.btn.danger:hover{background:var(--danger-soft); border-color:var(--danger)}

.shell{display:grid; grid-template-columns:198px minmax(0,1fr); align-items:start}
.rail{
  position:sticky; top:56px; height:calc(100vh - 56px); overflow-y:auto;
  border-right:1px solid var(--line); padding:18px 10px; display:flex; flex-direction:column; gap:2px;
  background:var(--paper);
}
.rail .eyebrow{padding:14px 10px 6px}
/* Two jobs, one desk. The switch is the first thing in the rail because it
   decides what the rest of the rail means. */
.zoneswitch{display:flex; gap:2px; padding:3px; margin-bottom:8px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius)}
.zonebtn{flex:1; padding:6px 9px; border:0; border-radius:calc(var(--radius) - 3px);
  background:none; color:var(--ink-3); font:600 12.5px/1.3 var(--body);
  cursor:pointer; transition:background .12s, color .12s, box-shadow .12s}
.zonebtn:hover{color:var(--ink)}
.zonebtn[aria-pressed="true"]{background:var(--paper); color:var(--ink); box-shadow:var(--shadow)}
.navitem{
  display:flex; align-items:baseline; gap:9px; width:100%; text-align:left;
  background:none; border:0; padding:7px 10px; border-radius:var(--radius);
  cursor:pointer; color:var(--ink-2); font-size:13.5px; transition:background .12s,color .12s;
}
.navitem:hover{background:var(--surface-2); color:var(--ink)}
.navitem[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
:root[data-theme="dark"] .navitem[aria-current="true"]{color:var(--accent)}
@media (prefers-color-scheme: dark){.navitem[aria-current="true"]{color:var(--accent)}}
:root[data-theme="light"] .navitem[aria-current="true"]{color:var(--accent-ink)}
.navitem em{font-style:normal; margin-left:auto; font-family:var(--data); font-size:11px; color:var(--ink-3)}

main{padding:26px 28px 90px; min-width:0; max-width:1180px}
.pagehead{display:flex; align-items:flex-end; gap:18px; margin-bottom:22px; flex-wrap:wrap}
.pagehead h1{font-size:25px}
.pagehead p{margin:5px 0 0; color:var(--ink-2); max-width:64ch; font-size:13.5px}
.pagehead .tools{margin-left:auto}

/* ─── Cards / tables ─────────────────────────────────────────────────── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
.card > header{
  padding:12px 15px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.card > header h2{font-size:15px}
.card > header .spacer{margin-left:auto}
.grid{display:grid; gap:14px}
/* Without this, a wide scroller inside a grid child (the board's columns, a
   timeline) sizes the whole track to its content and the page scrolls sideways. */
.grid > *{min-width:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13px}
th{
  text-align:left; font-family:var(--data); font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500;
  padding:9px 14px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface);
}
td{padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--surface-2)}
td .sub{color:var(--ink-3); font-size:12px; display:block; margin-top:2px}
td.num{white-space:nowrap}
.grid.pair{align-items:start}

/* ─── Chips / stage ──────────────────────────────────────────────────── */
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px;
  font-size:11.5px; font-weight:500; white-space:nowrap; border:1px solid transparent;
}
.chip .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.chip.s0{background:var(--surface-2); color:var(--ink-3); border-color:var(--line)}
.chip.s1{background:var(--surface-2); color:var(--ink-2); border-color:var(--line-strong)}
.chip.s2{background:var(--ochre-soft); color:var(--ochre)}
.chip.s3{background:var(--ochre-soft); color:var(--ochre)}
.chip.s4{background:var(--accent-soft); color:var(--accent-ink)}
.chip.s5{background:var(--accent-soft); color:var(--accent-ink)}
.chip.s6{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent)}
.chip.s7{background:var(--accent); color:var(--paper)}
:root[data-theme="dark"] .chip.s6{color:var(--accent)}
@media (prefers-color-scheme: dark){.chip.s6{color:var(--accent)}}
:root[data-theme="light"] .chip.s6{color:var(--accent-ink)}
.chip.out{background:transparent; color:var(--ink-3); border-color:var(--line-strong); opacity:.75}
.chip.warn{background:var(--danger-soft); color:var(--danger)}
:root[data-theme="dark"] .chip.s4,:root[data-theme="dark"] .chip.s5{color:var(--accent)}
@media (prefers-color-scheme: dark){.chip.s4,.chip.s5{color:var(--accent)}}
:root[data-theme="light"] .chip.s4,:root[data-theme="light"] .chip.s5{color:var(--accent-ink)}
.cat{font-family:var(--data); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}

/* ─── Stat strip ─────────────────────────────────────────────────────── */
/* Separate tiles rather than one joined strip: a partial last row then leaves
   page background instead of an orphaned slab, at any count and any width. */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(136px,1fr)); gap:10px}
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:13px 15px;
}
.stat b{display:block; font-family:var(--data); font-size:24px; font-weight:600; letter-spacing:-.02em; line-height:1.15; font-variant-numeric:tabular-nums}
.stat small{display:block; margin-top:3px; font-size:11.5px; color:var(--ink-3)}
.stat.alert b{color:var(--danger)}
.stat.go b{color:var(--accent)}

/* ─── Where each MoU stands (Overview) ──────────────────────────────── */
.mourows{display:flex; flex-direction:column}
.mourow{
  display:grid; grid-template-columns:184px minmax(0,1fr); gap:14px; align-items:baseline;
  padding:11px 15px; border-bottom:1px solid var(--line); font-size:13px;
}
.mourow:last-child{border-bottom:0}
.mourow.quiet{color:var(--ink-3)}
.pnames{display:flex; flex-wrap:wrap; gap:6px}
.pname{
  background:var(--surface-2); border:1px solid var(--line); border-radius:20px;
  padding:2px 10px; font-size:12.5px; color:var(--ink-2); cursor:pointer; white-space:nowrap;
}
.pname:hover{border-color:var(--ink-3); color:var(--ink); background:var(--surface)}
@media (max-width:640px){
  .mourow{grid-template-columns:1fr; gap:7px}
}

/* ─── Filters ────────────────────────────────────────────────────────── */
.filters{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
select, input[type=text], input[type=date], textarea{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius);
  padding:5px 8px; font-size:12.5px; max-width:100%;
}
textarea{width:100%; font-family:var(--data); font-size:12px; line-height:1.6; resize:vertical}
label.field{display:flex; flex-direction:column; gap:4px}
label.field > span{font-family:var(--data); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}

/* ─── Plan ───────────────────────────────────────────────────────────── */
.ws{margin-bottom:14px}
.ws > header{cursor:pointer; user-select:none}
.ws code{font-family:var(--data); font-size:11px; color:var(--accent); background:var(--accent-soft); padding:2px 6px; border-radius:3px}
:root[data-theme="dark"] .ws code{color:var(--accent)}
.progress{width:88px; height:5px; background:var(--surface-3); border-radius:3px; overflow:hidden; flex:none}
.progress i{display:block; height:100%; background:var(--accent); transition:width .3s}
.status{
  font-family:var(--data); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  border:1px solid var(--line-strong); background:var(--surface); border-radius:3px;
  padding:2px 7px; cursor:pointer; white-space:nowrap;
}
.status[data-s="backlog"]{color:var(--ink-3)}
.status[data-s="weekly"]{background:var(--surface-2); color:var(--ink-2); border-color:var(--line-strong)}
.status[data-s="focus"]{background:var(--ochre-soft); color:var(--ochre); border-color:transparent}
.status[data-s="review"]{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent; opacity:.85}
.status[data-s="done"]{background:var(--accent); color:var(--paper); border-color:transparent}
:root[data-theme="dark"] .status[data-s="review"]{color:var(--accent)}
@media (prefers-color-scheme: dark){.status[data-s="review"]{color:var(--accent)}}
:root[data-theme="light"] .status[data-s="review"]{color:var(--accent-ink)}
.done td:nth-child(2){text-decoration:line-through; text-decoration-color:var(--ink-3); color:var(--ink-3)}
.overdue{color:var(--danger); font-weight:600}

/* ─── Timeline (Gantt) ───────────────────────────────────────────────── */
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:var(--radius); overflow:hidden}
.seg button{
  background:var(--surface); border:0; padding:6px 13px; font-size:12.5px; cursor:pointer;
  color:var(--ink-2); border-right:1px solid var(--line-strong);
}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2); color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:var(--accent)}
@media (prefers-color-scheme: dark){.seg button[aria-pressed="true"]{color:var(--accent)}}
:root[data-theme="light"] .seg button[aria-pressed="true"]{color:var(--accent-ink)}

.gantt{--mw:88px; --lw:246px; overflow:auto; max-height:min(72vh,640px); overscroll-behavior:contain}
.gantt .inner{min-width:calc(var(--lw) + var(--n) * var(--mw))}
.grow{display:grid; grid-template-columns:var(--lw) 1fr; border-bottom:1px solid var(--line); min-height:31px}
.grow:last-child{border-bottom:0}
.glabel{
  position:sticky; left:0; z-index:2; background:var(--surface);
  border-right:1px solid var(--line); padding:6px 13px; font-size:12.5px;
  display:flex; align-items:center; gap:8px; min-width:0;
}
.glabel span.t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.gtrack{position:relative; min-width:calc(var(--n) * var(--mw))}

/* month grid drawn as a repeating background so every row lines up exactly */
.gtrack{
  background-image:linear-gradient(to right, var(--line) 0 1px, transparent 1px 100%);
  background-size:var(--mw) 100%;
}

.ghead{display:grid; grid-template-columns:var(--lw) 1fr; border-bottom:1px solid var(--line-strong); position:sticky; top:0; z-index:5; background:var(--surface)}
.ghead .glabel{z-index:6; border-bottom:0}
.gmonths{display:grid; min-width:calc(var(--n) * var(--mw))}
.gmonths span{
  font-family:var(--data); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); padding:8px 0 8px 9px; border-left:1px solid var(--line); white-space:nowrap;
}
.gmonths span.q{border-left-color:var(--line-strong); color:var(--ink-2)}

.gbar{
  position:absolute; top:6px; height:17px; border-radius:3px; min-width:9px;
  font-size:10.5px; overflow:hidden; white-space:nowrap; touch-action:none;
  color:var(--ink-2); background:var(--surface-3); border:1px solid var(--line-strong);
  cursor:grab;
}
.gbar:hover{filter:brightness(.97); border-color:var(--ink-3)}
.gbar.dragging{cursor:grabbing; box-shadow:0 2px 8px rgba(0,0,0,.22); z-index:3; filter:none}
.gbar .grip{position:absolute; top:-2px; bottom:-2px; width:7px; cursor:col-resize}
.gbar .grip.l{left:0} .gbar .grip.r{right:0}
.gbar:hover .grip{background:linear-gradient(var(--ink-3),var(--ink-3)) center/1px 9px no-repeat}
.dragtip{
  position:fixed; z-index:90; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--ink); color:var(--paper); font-family:var(--data); font-size:11px;
  padding:4px 9px; border-radius:4px; white-space:nowrap; transform:translate(-50%,-190%);
}
.dragtip.show{opacity:1}
.gbar.weekly{border-color:var(--ink-3)}
.gbar.focus{background:var(--ochre-soft); border-color:var(--ochre); color:var(--ochre)}
.gbar.review{background:var(--accent-soft); border-color:var(--accent); opacity:.85}
.gbar.done{background:var(--accent-soft); border-color:transparent; color:var(--accent-ink); opacity:.6}
:root[data-theme="dark"] .gbar.done{color:var(--accent)}
@media (prefers-color-scheme: dark){.gbar.done{color:var(--accent)}}
:root[data-theme="light"] .gbar.done{color:var(--accent-ink)}
.gbar.late{border-color:var(--danger); border-style:dashed}

.grow.wsrow{background:var(--surface-2)}
.grow.wsrow .glabel{background:var(--surface-2); font-weight:600; cursor:pointer}
.grow.wsrow .gtrack{background-color:var(--surface-2)}
.gsum{position:absolute; top:11px; height:7px; border-radius:4px; background:var(--line-strong); overflow:hidden}
.gsum i{display:block; height:100%; background:var(--accent); border-radius:4px}
.gcode{font-family:var(--data); font-size:10px; color:var(--ink-3); flex:none}
.gcaret{font-family:var(--data); font-size:9px; color:var(--ink-3); width:9px; flex:none}

.today{position:absolute; top:0; bottom:0; width:0; border-left:1px dashed var(--danger); opacity:.55; z-index:1}
.grow.msrow{background:var(--surface); min-height:34px}
.gms{
  position:absolute; top:9px; width:11px; height:11px; margin-left:-5.5px; transform:rotate(45deg);
  background:var(--surface); border:1.5px solid var(--ink-2); border-radius:2px;
  cursor:grab; touch-action:none;
}
.gms:hover{border-color:var(--accent)}
.gms.dragging{cursor:grabbing; border-color:var(--accent); z-index:3}
.gms.hit{background:var(--accent); border-color:var(--accent)}
.gmslabel{position:absolute; top:8px; font-family:var(--data); font-size:9.5px; color:var(--ink-3); margin-left:9px; white-space:nowrap}
.glegend{display:flex; gap:15px; flex-wrap:wrap; padding:11px 15px; font-size:11.5px; color:var(--ink-3); border-top:1px solid var(--line)}
.glegend b{display:inline-block; width:15px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle; border:1px solid var(--line-strong); background:var(--surface-3)}
.glegend b.focus{background:var(--ochre-soft); border-color:var(--ochre)}
.glegend b.review{background:var(--accent-soft); border-color:var(--accent)}
.glegend b.done{background:var(--accent-soft); border-color:transparent}
.glegend b.today{border:0; border-left:1px dashed var(--danger); width:1px; height:11px; border-radius:0; margin-right:9px}

/* ─── Board (Kanban) ─────────────────────────────────────────────────── */
.board{display:grid; grid-template-columns:repeat(5,minmax(190px,1fr)); gap:12px; align-items:start; overflow-x:auto; padding-bottom:6px}
.col{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); min-height:150px; display:flex; flex-direction:column}
.col > header{
  display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line);
  font-family:var(--data); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3);
}
.col > header b{margin-left:auto; font-family:var(--data); font-size:11px; color:var(--ink-2); font-weight:500}
.col .rail-dot{width:7px; height:7px; border-radius:2px; background:var(--line-strong)}
.col > header .rail-dot{background:var(--colcolor, var(--line-strong))}
.col > header{cursor:default}
.col > header .title{cursor:text; border-radius:3px; padding:1px 3px; margin:-1px -3px}
.col > header .title:hover{background:var(--surface-3)}

<script>
"use strict";

/* ══ Reference data ═══════════════════════════════════════════════════ */

/* Stages are data, like the board columns — add or rename one in
   data/partners/stages.json without touching this file. Order is the pipeline.
   `engaged` marks where a real conversation has started, `committed` where
   something has been signed, `terminal` takes a partner out of the pipeline —
   so the counts stay meaningful when the list changes. */
const DEFAULT_STAGES = [
  {id:"identified", label:"Identified",   hint:"On the target list, no contact yet"},
  {id:"researched", label:"Researched",   hint:"Right person and angle worked out"},
  {id:"approached", label:"Approached",   hint:"First approach sent, awaiting reply"},
  {id:"meeting",    label:"Meeting held", hint:"First substantive conversation done", engaged:true},
  {id:"aligning",   label:"Aligning MoU", hint:"Talking, and agreeing what the MoU will say"},
  {id:"mou_sent",   label:"MoU sent",     hint:"Agreed text is with them to sign"},
  {id:"mou_signed", label:"MoU signed",   hint:"Non-binding commitment in place", committed:true},
  {id:"active",     label:"Active",       hint:"Working on the facility together", committed:true},
  {id:"parked",     label:"Parked",       hint:"Right partner, wrong moment", terminal:true},
  {id:"declined",   label:"Declined",     hint:"Not proceeding", terminal:true}
];
const stageDefs = () => (Array.isArray(DB.stages) && DB.stages.length) ? DB.stages : DEFAULT_STAGES;
Object.defineProperty(window, "STAGES",     {get: () => stageDefs().filter(s => !s.terminal)});
Object.defineProperty(window, "OUT_STAGES", {get: () => stageDefs().filter(s => s.terminal)});
Object.defineProperty(window, "ALL_STAGES", {get: () => stageDefs()});

const stageRank = id => STAGES.findIndex(s => s.id === id);
const stageLabel = id => (ALL_STAGES.find(s => s.id === id) || {label:id}).label;
/* Chip tone runs from neutral to accent along the pipeline. Eight distinct
   tones; a longer pipeline than that shares the last one rather than leaving
   a stage unstyled. */
const stageClass = id => {
  const i = stageRank(id);
  return i < 0 ? "out" : "s" + Math.min(7, i);
};
/* Where a real conversation has started, and where something is signed. */
const engagedFrom = () => { const i = STAGES.findIndex(s => s.engaged); return i < 0 ? 3 : i; };
const isEngaged = id => stageRank(id) >= engagedFrom();
const isCommitted = id => !!(ALL_STAGES.find(s => s.id === id) || {}).committed;

/* Only the label is read. This used to carry a hook, an ask, and discovery
   questions per type, all of which fed the Outreach tab; that tab was removed
   and the content moved to docs/partners/by-type.md rather than left here
   looking like it still drives something. */
const CATEGORIES = {
  carrier: {label:"Risk carriers"},
  capital: {label:"Capital providers"},
  donor: {label:"Donors & foundations"},
  dfi: {label:"Development finance"},
  operator: {label:"Infrastructure operators"},
  digital: {label:"Digital-asset infrastructure"},
  data: {label:"AI & data partners"},
  verifier: {label:"Verification & assurance"},
  public: {label:"Regulators & public bodies"},
  advisor: {label:"Advisors"},
  network: {label:"Network"}
};
const catLabel = id => (CATEGORIES[id] || {label:id}).label;

/* ══ Seed content ═════════════════════════════════════════════════════ */

const P = (id,name,cat,country,why,ask,stage,next) =>
  ({id, name, cat, country, why, ask, stage, owner:"", contact:"",
    next, nextDate:"", notes:""});

const SEED = {
  version: 1,
  meta: {
    org:"Lionscraft",
    facility:"Sri Lanka Telecom Resilience Facility",
    product:"Response-Linked ART",
    revision:0,
    updated:"2026-08-10"
  },
  /* Structure only. The board itself lives in data/ and is fetched at load —
     this stands in when nothing can be reached, and must never carry content
     that could be mistaken for the real thing. */
  partners: [],
  workstreams: [
    {id:"WS1", name:"Risk & modelling",             layer:"Layer 1 — Risk and modelling",          lead:""},
    {id:"WS2", name:"Capital & structure",          layer:"Layer 2 — Financial structure",         lead:""},
    {id:"WS3", name:"Legal & regulatory",           layer:"Layer 3 — Rights and obligations",      lead:""},
    {id:"WS4", name:"Operator engagement",          layer:"Layers 3 & 5 — Obligations, evidence",  lead:""},
    {id:"WS5", name:"Digital-asset infrastructure", layer:"Layer 4 — Digital asset infrastructure",lead:""},
    {id:"WS6", name:"Data & evidence",              layer:"Layer 5 — Data and evidence",           lead:""},
    {id:"WS7", name:"AI administration",            layer:"Layer 6 — AI administration",           lead:""},
    {id:"WS8", name:"Funding & partnerships",       layer:"Cross-cutting",                         lead:""},
    {id:"WS9", name:"Narrative & materials",        layer:"Cross-cutting",                         lead:""}
  ],
  activity: [],
  tasks: [],
  milestones: []
};

/* ══ Store ════════════════════════════════════════════════════════════ */

const KEY = "lionscraft-desk-v1";
const META_KEY = "lionscraft-desk-sync";

let DB, hadLocal = false;
try {
  const raw = localStorage.getItem(KEY);
  hadLocal = !!raw;
  DB = raw ? JSON.parse(raw) : structuredClone(SEED);
} catch (e) { DB = structuredClone(SEED); }
if (!DB.partners){ DB = structuredClone(SEED); hadLocal = false; }

/* Sync state. `base` is the shared revision this browser's copy was taken from;
   `dirty` means it has been edited since. Together they tell us whether the
   shared file has moved on underneath us. */
let sync = {base:0, dirty:false};
try {
  const m = localStorage.getItem(META_KEY);
  if (m) sync = Object.assign(sync, JSON.parse(m));
} catch (e) {}

let shared = null;                 // the fetched shared dataset, if reachable
let syncState = "offline";         // live | ahead | behind | offline

const saveSync = () => { try { localStorage.setItem(META_KEY, JSON.stringify(sync)); } catch (e) {} };
const revOf = d => (d && d.meta && d.meta.revision) || 0;

/* ── GitHub as the store ──────────────────────────────────────────────
   The board is split across files under data/, one per section, so each is
   small enough to read and review on its own. There is no server: reads come
   from GitHub, a save is a single commit touching only what changed, and git
   history is the audit trail. Agents use the same files — see AGENTS.md. */
const GH_REPO   = "Lionscraft-io/risk-cockpit";
const GH_BRANCH = "main";
const GH_API    = "https://api.github.com";
const REPO_KEY  = "lionscraft-desk-repo";     // override, for forks
const TOKEN_KEY = "lionscraft-desk-token";    // app password, or a GitHub PAT
const PROXY_KEY = "lionscraft-desk-proxy";

/* With a proxy configured, it holds the GitHub token and the browser only ever
   sends a short app password. Without one, the browser talks to GitHub itself
   and needs a PAT. Either way the board is the same files in the same repo. */
const DEFAULT_PROXY = "";
const proxyBase = (() => {
  try { const o = localStorage.getItem(PROXY_KEY); if (o !== null) return o.replace(/\/+$/, ""); } catch (e) {}
  /* Served by the proxy itself — its own origin is the backend, no setup.
     Covers the hosted deployment and `node server/proxy.mjs` locally. */
  if (/\.(replit\.app|repl\.co|replit\.dev)$/.test(location.hostname)) return location.origin;
  if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return location.origin;
  return DEFAULT_PROXY;
})();
const useProxy = !!proxyBase;

/* Each part of the board is its own file. `key` is where it lives on the
   in-memory document; `wrap` means the file holds an object rather than the
   bare array. */
const FILES = [
  {key:"meta",        path:"data/meta.json",              wrap:true},
  {key:"partners",    path:"data/partners/partners.json"},
  {key:"workstreams", path:"data/plan/workstreams.json"},
  {key:"tasks",       path:"data/plan/tasks.json"},
  {key:"milestones",  path:"data/plan/milestones.json"},
  {key:"columns",     path:"data/plan/columns.json"},
  {key:"activity",    path:"data/activity/activity.json"}
];

const ghRepo = (() => {
  try { return localStorage.getItem(REPO_KEY) || GH_REPO; } catch (e) { return GH_REPO; }
})();
let apiToken = "";
try { apiToken = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) {}

let liveMode = false;          // reached the store this session
let authRequired = true;       // false when the backend accepts open writes
let localBackend = false;      // backend writes to a working tree, not GitHub
let headSha = null;            // commit the working copy came from — our CAS token
let pushTimer = null, pollTimer = null, pushing = false;

/* Base64 <-> UTF-8. btoa/atob are byte-oriented, and the board is full of
   em-dashes, so go through TextEncoder/TextDecoder. */
const b64encode = str => {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
};
const b64decode = b64 => {
  const bin = atob(b64.replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
};

const serialize = f => JSON.stringify(f.wrap ? {version:DB.version || 1, meta:DB.meta} : DB[f.key], null, 2) + "\n";

function ghHeaders(extra){
  const h = {"accept": "application/vnd.github+json", "x-github-api-version": "2022-11-28"};
  if (apiToken) h.authorization = "Bearer " + apiToken;
  return Object.assign(h, extra || {});
}

async function ghFetch(path, opts){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 15000);
  try {
    return await fetch(GH_API + path, Object.assign({signal:ctrl.signal, cache:"no-store"}, opts, {
      headers: ghHeaders(opts && opts.headers)
    }));
  } finally { clearTimeout(t); }
}

/* The commit the branch currently points at. One cheap call, so polling can
   ask "has anything changed?" without downloading the board. */
async function headCommit(){
  if (useProxy){
    const res = await fetch(proxyBase + "/api/board", {cache:"no-store"});
    if (!res.ok) throw new Error("head failed: HTTP " + res.status);
    return (await res.json()).head;
  }
  const res = await ghFetch("/repos/" + ghRepo + "/commits/" + GH_BRANCH + "?per_page=1");
  if (!res.ok) throw new Error("head failed: HTTP " + res.status);
  return (await res.json()).sha;
}

/* Read every part and assemble the document. With a token this goes through
   the API, which is immediate after a commit; without one it reads the copies
   GitHub Pages serves beside this page, which costs no rate limit. */
async function fetchBoard(){
  if (useProxy){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(proxyBase + "/api/board", {signal:ctrl.signal, cache:"no-store"});
      if (!res.ok) throw new Error("proxy read: HTTP " + res.status);
      const out = await res.json();
      headSha = out.head;
      if (!Array.isArray(out.desk.activity)) out.desk.activity = [];
      return out.desk;
    } finally { clearTimeout(t); }
  }
  const parts = await Promise.all(FILES.map(async f => {
    if (apiToken){
      const res = await ghFetch("/repos/" + ghRepo + "/contents/" + f.path + "?ref=" + GH_BRANCH);
      if (!res.ok) throw new Error(f.path + ": HTTP " + res.status);
      return JSON.parse(b64decode((await res.json()).content));
    }
    const res = await fetch(f.path + "?t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) throw new Error(f.path + ": HTTP " + res.status);
    return res.json();
  }));

  const doc = {};
  FILES.forEach((f, i) => {
    if (f.wrap) Object.assign(doc, parts[i]);
    else doc[f.key] = parts[i];
  });
  if (!Array.isArray(doc.activity)) doc.activity = [];
  return doc;
}

/* Commit the board. Re-reads first and unions the activity log by id, so a
   comment or agent finding written since our last read is never lost; other
   fields are last-write-wins.

   The write goes through the git data API rather than the contents API,
   because the board is several files and a save must be one commit: a
   half-applied save would leave partners updated and the log describing it
   missing. Blobs -> tree -> commit -> move the branch. Moving the branch is
   the compare-and-swap: it only succeeds if nobody else committed in between. */
async function pushLive(retried){
  if (!liveMode || pushing) return;
  if (authRequired && !apiToken){ syncState = "ahead"; renderBanner(); return; }
  pushing = true;

  if (useProxy){
    try {
      const cur = await fetchBoard();
      const seen = new Set(DB.activity.map(e => e.id));
      for (const e of (cur.activity || [])) if (!seen.has(e.id)) DB.activity.push(e);
      DB.activity.sort((a, b) => (a.at || "").localeCompare(b.at || ""));
      DB.meta.revision = revOf(cur) + 1;
      DB.meta.updated = TODAY;

      const res = await fetch(proxyBase + "/api/board", {
        method:"PUT",
        headers:{"content-type":"application/json", "authorization":"Bearer " + (apiToken || "")},
        body: JSON.stringify({desk: DB, head: headSha, actor: whoami()})
      });
      if (res.ok){
        headSha = (await res.json()).head;
        sync = {base:DB.meta.revision, dirty:false}; saveSync();
        try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {}
        syncState = "live"; renderBanner(); renderRail();
      } else if (res.status === 409 && !retried){
        headSha = (await res.json()).head;
        pushing = false; return pushLive(true);
      } else if (res.status === 401){
        apiToken = ""; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
        syncState = "ahead"; renderBanner();
        toast("Password rejected — set it under Data");
      } else {
        syncState = "ahead"; renderBanner();
      }
    } catch (e) {
      syncState = "ahead"; renderBanner();
    } finally { pushing = false; }
    return;
  }

  try {
    const parent = await headCommit();
    const cur = await fetchBoard();
    const seen = new Set(DB.activity.map(e => e.id));
    for (const e of (cur.activity || [])) if (!seen.has(e.id)) DB.activity.push(e);
    DB.activity.sort((a, b) => (a.at || "").localeCompare(b.at || ""));
    DB.meta.revision = revOf(cur) + 1;
    DB.meta.updated = TODAY;

    /* Only write files whose contents actually differ, so a comment does not
       rewrite the partner list. */
    const changed = FILES.filter(f => {
      const before = f.wrap ? {version:cur.version || 1, meta:cur.meta} : cur[f.key];
      return JSON.stringify(before) !== JSON.stringify(f.wrap ? {version:DB.version || 1, meta:DB.meta} : DB[f.key]);
    });
    if (!changed.length){
      sync = {base:DB.meta.revision, dirty:false}; saveSync();
      syncState = "live"; renderBanner(); pushing = false; return;
    }

    const blobs = await Promise.all(changed.map(async f => {
      const res = await ghFetch("/repos/" + ghRepo + "/git/blobs", {
        method:"POST", headers:{"content-type":"application/json"},
        body: JSON.stringify({content: b64encode(serialize(f)), encoding: "base64"})
      });
      if (!res.ok) throw new Error("blob " + f.path + ": HTTP " + res.status);
      return {path: f.path, mode: "100644", type: "blob", sha: (await res.json()).sha};
    }));

    const treeRes = await ghFetch("/repos/" + ghRepo + "/git/trees", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({base_tree: parent, tree: blobs})
    });
    if (!treeRes.ok) throw new Error("tree: HTTP " + treeRes.status);

    const commitRes = await ghFetch("/repos/" + ghRepo + "/git/commits", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({
        message: "Desk: revision " + DB.meta.revision + " (" + whoami() + ")",
        tree: (await treeRes.json()).sha,
        parents: [parent]
      })
    });
    if (!commitRes.ok) throw new Error("commit: HTTP " + commitRes.status);
    const newSha = (await commitRes.json()).sha;

    const refRes = await ghFetch("/repos/" + ghRepo + "/git/refs/heads/" + GH_BRANCH, {
      method:"PATCH", headers:{"content-type":"application/json"},
      body: JSON.stringify({sha: newSha, force: false})
    });

    if (refRes.ok){
      headSha = newSha;
      sync = {base:DB.meta.revision, dirty:false}; saveSync();
      try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {}
      syncState = "live"; renderBanner(); renderRail();
    } else if ((refRes.status === 422 || refRes.status === 409) && !retried){
      pushing = false; return pushLive(true);        // someone committed first
    } else if (refRes.status === 401 || refRes.status === 403){
      apiToken = ""; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      syncState = "ahead"; renderBanner();
      toast(refRes.status === 403 ? "Token lacks write access to the repo" : "Token rejected — set it under Data");
    } else {
      syncState = "ahead"; renderBanner();
    }
  } catch (e) {
    syncState = "ahead"; renderBanner();             // offline or refused; next save retries
  } finally { pushing = false; }
}

/* Each push is a commit, so batch a burst of edits into one. */
const queuePush = () => {
  if (!liveMode) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushLive(false), 4000);
};

/* One poll, two jobs: reconnect while offline, and pick up what other people
   and agents committed. Checks the branch head first — one cheap call — and
   only downloads the board when it has actually moved. */
function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (document.hidden || pushing) return;
    try {
      if (apiToken){
        const head = await headCommit();
        if (liveMode && head === headSha) return;
        headSha = head;
      }
      const cur = await fetchBoard();
      if (!liveMode){ liveMode = true; toast("Back online"); }
      shared = cur;
      if (revOf(shared) <= sync.base) return;
      if (!sync.dirty){
        DB = structuredClone(shared);
        sync = {base:revOf(shared), dirty:false}; saveSync();
        try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {}
        syncState = "live";
        renderRail(); renderBanner();
        if (!drawer.classList.contains("open")) render();
      } else {
        syncState = "behind"; renderBanner();
      }
    } catch (e) {
      liveMode = false;
      syncState = "offline";
      renderBanner();
    }
  }, 30000);
}

/* Connect to the store. Unreachable just means offline: keep working from the
   local cache, keep trying, and push unpushed edits when it returns. */
async function connectBackend(){
  try {
    if (useProxy){
      /* Ask whether this backend wants a password at all. A local dev server
         does not, and refusing to push without one would silently lose edits. */
      try {
        const h = await (await fetch(proxyBase + "/healthz", {cache:"no-store"})).json();
        authRequired = h.auth !== "open";
        localBackend = !!h.local;
      } catch (e) { authRequired = true; localBackend = false; }
    }
    const cur = await fetchBoard();
    if (!Array.isArray(cur.partners)) throw new Error("unexpected shape");
    shared = cur;
    liveMode = true;
    if (apiToken){ try { headSha = await headCommit(); } catch (e) {} }
    /* Decide on the current dirty flag, not the boot-time state — this also
       runs on reconnection, where unpushed offline edits must survive. */
    if (!sync.dirty){
      DB = structuredClone(shared);
      sync = {base:revOf(shared), dirty:false};
      save(true); saveSync();
      syncState = "live";
    } else if (revOf(shared) > sync.base){
      syncState = "behind";
    } else {
      syncState = "ahead";
      queuePush();
    }
  } catch (e) {
    liveMode = false;
    syncState = "offline";
  }
  startPolling();
}

/* Take the shared version, discarding local edits. */
function adoptShared(){
  DB = structuredClone(shared);
  sync = {base:revOf(shared), dirty:false};
  save(true); saveSync();
  syncState = "live";
  renderRail(); renderBanner(); render();
  toast("Loaded the board at revision " + revOf(shared));
}

/* Keep working locally, but stop being told about a revision already seen.
   In live mode "keep mine" means mine wins: push it (the activity log still
   merges, so nothing anyone else said is lost). */
function dismissShared(){
  sync.base = revOf(shared);
  sync.dirty = true;
  saveSync();
  syncState = "ahead";
  renderBanner(); render();
  queuePush();
}


/* Who this browser is, so comments and changes are attributable. Agents identify
   themselves by their own name in the same field. */
const ME_KEY = "lionscraft-desk-me";
let me = "";
try { me = localStorage.getItem(ME_KEY) || ""; } catch (e) {}
const whoami = () => me || "unattributed";

if (!Array.isArray(DB.activity)) DB.activity = [];

/* Backfill start dates for data saved before the timeline existed. Only fills
   a missing field — never overwrites anything the team has edited. */
(function backfillStarts(){
  let touched = false;
  DB.tasks.forEach(t => {
    if (t.start) return;
    const seeded = SEED.tasks.find(s => s.id === t.id);
    t.start = seeded ? seeded.start : shiftDays(t.due, -21);
    touched = true;
  });
  if (touched) try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {}
})();

/* `quiet` is used by the sync machinery, which manages the dirty flag itself.
   Every other caller is a user edit, so it marks the copy as unpublished. */
const save = (quiet) => {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { toast("Could not save locally — this browser is blocking storage"); return; }
  if (!quiet){
    if (!sync.dirty){
      sync.dirty = true; saveSync();
      if (syncState === "synced" || syncState === "live"){ syncState = "ahead"; renderBanner(); }
    }
    queuePush();     // no-op unless live mode is on
  }
};
const uid = p => p + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Real calendar date in the viewer's own timezone, so "overdue" stays true
   without anyone having to edit a constant. */
const TODAY = (() => {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
})();
const fmtDate = d => {
  if (!d) return "—";
  const [y, m, dd] = d.split("-");
  return dd + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m - 1] + " " + y.slice(2);
};
const isOverdue = d => !!d && d < TODAY;

/* Date maths for the timeline. All dates are plain YYYY-MM-DD, handled in UTC
   so a viewer's timezone can never shift a bar by a day. */
const DAY = 86400000;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function toMs(d){ return Date.parse(d + "T00:00:00Z"); }
function shiftDays(d, n){
  if (!d) return "";
  return new Date(toMs(d) + n * DAY).toISOString().slice(0, 10);
}
function monthsBetween(from, to){
  const out = [];
  let y = +from.slice(0, 4), m = +from.slice(5, 7);
  const ey = +to.slice(0, 4), em = +to.slice(5, 7);
  while (y < ey || (y === ey && m <= em)){
    out.push({y, m, key:y + "-" + String(m).padStart(2, "0")});
    if (++m > 12){ m = 1; y++; }
  }
  return out;
}
const monthStart = mo => mo.key + "-01";
const monthEnd = mo => new Date(Date.UTC(mo.y, mo.m, 0)).toISOString().slice(0, 10);

/* ══ Activity log ═════════════════════════════════════════════════════ */

/* One entry per thing said or changed. Agents write these too — the log is how
   they leave findings for each other and for you. Shape is documented in
   AGENTS.md and must stay stable, because external agents write against it. */
const EVENT_KINDS = {
  comment:  {label:"Comment",  hint:"Something said about this"},
  change:   {label:"Change",   hint:"A state change worth recording"},
  finding:  {label:"Finding",  hint:"Research an agent turned up"},
  question: {label:"Question", hint:"Needs an answer before work continues"},
  handoff:  {label:"Handoff",  hint:"Passed to a named actor"}
};

function logEvent(e){
  const entry = Object.assign({
    id: uid("e"),
    at: new Date().toISOString(),
    actor: whoami(),
    actorKind: "human",
    kind: "comment"
  }, e);
  DB.activity.push(entry);
  return entry;
}

const eventsFor = (refType, ref) =>
  DB.activity.filter(e => e.refType === refType && e.ref === ref)
             .sort((a, b) => (a.at || "").localeCompare(b.at || ""));

/* Human-scale relative time; falls back to the date once it stops being useful. */
function ago(iso){
  if (!iso) return "";
  const t = Date.parse(iso);
  if (isNaN(t)) return iso;
  const mins = Math.round((Date.now() - t) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  const days = Math.round(hrs / 24);
  if (days < 8) return days + "d ago";
  return fmtDate(iso.slice(0, 10));
}

let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

/* ══ Navigation ═══════════════════════════════════════════════════════ */

/* The desk does two different jobs. Keeping the relationship work and the
   delivery work in one flat list made every tab look equally relevant at every
   moment, which is how a CRM tab gets opened when the question was about the
   board. Zones split them. CRM is deliberately short — two tabs — because
   the question it answers is short: who are they, and where is the MoU. */
const ZONES = [
  {id:"crm",  label:"CRM",     home:"overview", blurb:"Partners and where each MoU stands"},
  {id:"work", label:"Project", home:"board",    blurb:"The plan, the board and the record"}
];

const VIEWS = [
  {id:"overview",  label:"Overview",  zone:"crm",  count:() => ""},
  {id:"partners",  label:"Partners",  zone:"crm",  count:() => DB.partners.length},
  {id:"plan",      label:"Plan",      zone:"work", count:() => allCards().filter(c => !isDone(c.status)).length},
  {id:"board",     label:"Board",     zone:"work", count:() => allCards().filter(c => c.status === "focus" || c.status === "review").length},
  {id:"activity",  label:"Activity",  zone:"work", count:() => DB.activity.length || ""},
  {id:"narrative", label:"Narrative", zone:"work", count:() => ""}
];
let current = "overview";
let zone = "crm";
const ZONE_LAST = {crm:"overview", work:"board"};
let filters = {stage:"", cat:"", q:""};

/* The zone follows the open tab rather than living in the URL, so every
   existing link and bookmark — #partners, #plan/gantt — still works and still
   lands in the right half. Every view belongs to exactly one zone, so the open
   tab always determines it and there is nothing to remember across a refresh. */
function syncZone(){
  const v = VIEWS.find(x => x.id === current);
  if (v){ zone = v.zone; ZONE_LAST[zone] = current; }
}

function goZone(id){
  if (id === zone) return;
  zone = id;
  go(ZONE_LAST[id] || (ZONES.find(z => z.id === id) || {}).home || "overview");
}

function renderRail(){
  const item = v =>
    `<button class="navitem" data-view="${v.id}" aria-current="${v.id === current}">
       ${v.label}<em class="num">${v.count()}</em>
     </button>`;
  document.getElementById("rail").innerHTML =
    `<div class="zoneswitch" role="group" aria-label="Which half of the desk">${
      ZONES.map(z => `<button class="zonebtn" data-zone="${z.id}" aria-pressed="${
        z.id === zone}" title="${esc(z.blurb)}">${esc(z.label)}</button>`).join("")
    }</div>` +
    VIEWS.filter(v => v.zone === zone).map(item).join("");
}

/* The open tab lives in the URL hash, so a refresh keeps you where you were,
   back and forward work, and a tab can be linked to directly. Plan carries its
   sub-view too: #plan/gantt. */
/* A setup link carries the access token in the URL fragment — `#board&k=…` —
   so a new browser or phone is configured by opening one link instead of
   pasting a token. The fragment is never sent to any server. It is consumed
   and wiped from the address bar immediately, so it does not linger in the
   tab, in a screenshot, or in what gets copied out of the address bar.

   The link is the credential. Treat it like one. */
function takeTokenFromHash(){
  const raw = (location.hash || "").replace(/^#/, "");
  if (!raw.includes("k=")) return false;
  const [route, ...rest] = raw.split("&");
  const params = new URLSearchParams(rest.join("&"));
  const k = (params.get("k") || "").trim();
  params.delete("k");
  const tail = params.toString();
  history.replaceState(null, "",
    location.pathname + (route ? "#" + route + (tail ? "&" + tail : "") : ""));
  if (!k) return false;
  apiToken = k;
  try { localStorage.setItem(TOKEN_KEY, apiToken); } catch (e) {}
  return true;
}

function setupLink(){
  return location.origin + location.pathname + "#overview&k=" + encodeURIComponent(apiToken);
}

function routeFromHash(){
  const [view, mode] = (location.hash || "").replace(/^#\/?/, "").split("&")[0].split("/");
  return {
    view: VIEWS.some(v => v.id === view) ? view : "overview",
    mode: ["list", "gantt"].includes(mode) ? mode : null
  };
}

function applyRoute(replace){
  const h = "#" + current + (current === "plan" && planMode !== "list" ? "/" + planMode : "");
  if (location.hash === h) return;
  history[replace ? "replaceState" : "pushState"](null, "", h);
}

function go(id){
  current = id;
  syncZone();
  applyRoute(false);
  renderRail(); render();
  window.scrollTo({top:0});
}

window.addEventListener("popstate", () => {
  const r = routeFromHash();
  current = r.view;
  if (r.mode) planMode = r.mode;
  syncZone();
  renderRail(); render();
});

/* ══ Sync surface ═════════════════════════════════════════════════════ */

const SYNC_LABEL = {
  /* "live" must mean the shared board. A development backend writes to somebody's
     working tree and reaches nobody else, so it says so. */
  live:    () => (localBackend ? "working copy · rev " : "live · rev ") + revOf(DB),
  ahead:   () => (apiToken || !authRequired) ? "saving…" : "token needed",
  behind:  () => "update available",
  offline: () => "offline"
};

function renderBanner(){
  const chip = document.getElementById("syncChip");
  chip.dataset.s = syncState;
  chip.classList.toggle("localonly", localBackend);
  chip.querySelector(".txt").textContent = SYNC_LABEL[syncState]();
  chip.title = {
    live:    localBackend
      ? "This backend is in development mode: saves are written to its working tree, not committed to GitHub. Nobody else sees them until someone commits."
      : "Connected to the backend. Saves push automatically and others' changes arrive on their own.",
    ahead:   apiToken ? "Pushing your edits to the backend…" : "Edits are local only — set the write token under Data to push them.",
    behind:  "The board has moved on since your copy was taken.",
    offline: "Backend unreachable — working from this browser's copy and reconnecting automatically. Unpushed edits go up when it returns."
  }[syncState];

  const el = document.getElementById("banner");
  if (syncState !== "behind"){ el.innerHTML = ""; return; }
  el.innerHTML = `
    <div class="bnr">
      <span><b>The board has moved on.</b>
        It is at revision <code>${revOf(shared)}</code>; your unpushed edits started from
        revision <code>${sync.base}</code>.</span>
      <span class="grow">
        <button class="btn" id="keepMine">Push mine anyway</button>
        <button class="btn primary" id="takeShared">Load the board</button>
      </span>
    </div>`;
  document.getElementById("takeShared").onclick = () => {
    if (sync.dirty && !confirm("Loading the board replaces your local edits. Continue?")) return;
    adoptShared();
  };
  document.getElementById("keepMine").onclick = dismissShared;
}

document.getElementById("rail").addEventListener("click", e => {
  const z = e.target.closest("[data-zone]");
  if (z){ goZone(z.dataset.zone); return; }
  const b = e.target.closest("[data-view]");
  if (b) go(b.dataset.view);
});
