<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lionscraft — Partner & Facility Desk</title>

<style>
/* ─── Tokens ─────────────────────────────────────────────────────────── */
:root{
  --paper:#F5F8F6; --surface:#FFFFFF; --surface-2:#EAF0ED; --surface-3:#DFE8E4;
  --line:#D6E0DB; --line-strong:#BECBC5;
  --ink:#111917; --ink-2:#44534E; --ink-3:#73827D;
  --accent:#0E5F50; --accent-ink:#0B473C; --accent-soft:#D8EAE4;
  --ochre:#8E6410; --ochre-soft:#F2E8D3;
  --danger:#9C3627; --danger-soft:#F6E1DC;
  --shadow:0 1px 2px rgba(17,25,23,.05), 0 8px 24px -12px rgba(17,25,23,.18);
  --radius:6px;
  --display:ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --data:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0C1211; --surface:#131A18; --surface-2:#1A2422; --surface-3:#222E2B;
    --line:#283431; --line-strong:#3A4844;
    --ink:#E7EFEC; --ink-2:#A2B1AC; --ink-3:#71817C;
    --accent:#4FC2A4; --accent-ink:#7FD6BF; --accent-soft:#12302A;
    --ochre:#D3A24C; --ochre-soft:#31270F;
    --danger:#E08170; --danger-soft:#3A1C17;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="light"]{
  --paper:#F5F8F6; --surface:#FFFFFF; --surface-2:#EAF0ED; --surface-3:#DFE8E4;
  --line:#D6E0DB; --line-strong:#BECBC5;
  --ink:#111917; --ink-2:#44534E; --ink-3:#73827D;
  --accent:#0E5F50; --accent-ink:#0B473C; --accent-soft:#D8EAE4;
  --ochre:#8E6410; --ochre-soft:#F2E8D3;
  --danger:#9C3627; --danger-soft:#F6E1DC;
  --shadow:0 1px 2px rgba(17,25,23,.05), 0 8px 24px -12px rgba(17,25,23,.18);
}
:root[data-theme="dark"]{
  --paper:#0C1211; --surface:#131A18; --surface-2:#1A2422; --surface-3:#222E2B;
  --line:#283431; --line-strong:#3A4844;
  --ink:#E7EFEC; --ink-2:#A2B1AC; --ink-3:#71817C;
  --accent:#4FC2A4; --accent-ink:#7FD6BF; --accent-soft:#12302A;
  --ochre:#D3A24C; --ochre-soft:#31270F;
  --danger:#E08170; --danger-soft:#3A1C17;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; text-wrap:balance; margin:0; letter-spacing:-.011em}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

.eyebrow{
  font-family:var(--data); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); font-weight:500;
}
.num{font-variant-numeric:tabular-nums; font-family:var(--data)}

/* ─── Shell ──────────────────────────────────────────────────────────── */
.topbar{
  display:flex; align-items:center; gap:16px; padding:0 20px; height:56px;
  border-bottom:1px solid var(--line); background:var(--surface);
  position:sticky; top:0; z-index:40;
}
.mark{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.mark b{font-family:var(--display); font-size:17px; font-weight:600; letter-spacing:-.02em}
.mark span{
  font-family:var(--data); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tools{display:flex; align-items:center; gap:8px; flex:none}
.btn{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius);
  padding:6px 11px; font-size:12.5px; cursor:pointer; color:var(--ink-2);
  transition:background .12s, border-color .12s, color .12s; white-space:nowrap;
}
.btn:hover{background:var(--surface-2); color:var(--ink); border-color:var(--ink-3)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .btn.primary, :root:not([data-theme="light"]) .btn.primary{}
@media (prefers-color-scheme: dark){.btn.primary{color:#08110F}}
:root[data-theme="dark"] .btn.primary{color:#08110F}
:root[data-theme="light"] .btn.primary{color:#fff}
.btn.primary:hover{filter:brightness(1.08); background:var(--accent); color:inherit}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger); border-color:var(--line-strong)}
.btn.danger:hover{background:var(--danger-soft); border-color:var(--danger)}

.shell{display:grid; grid-template-columns:198px minmax(0,1fr); align-items:start}
.rail{
  position:sticky; top:56px; height:calc(100vh - 56px); overflow-y:auto;
  border-right:1px solid var(--line); padding:18px 10px; display:flex; flex-direction:column; gap:2px;
  background:var(--paper);
}
.rail .eyebrow{padding:14px 10px 6px}
.navitem{
  display:flex; align-items:baseline; gap:9px; width:100%; text-align:left;
  background:none; border:0; padding:7px 10px; border-radius:var(--radius);
  cursor:pointer; color:var(--ink-2); font-size:13.5px; transition:background .12s,color .12s;
}
.navitem:hover{background:var(--surface-2); color:var(--ink)}
.navitem[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
:root[data-theme="dark"] .navitem[aria-current="true"]{color:var(--accent)}
@media (prefers-color-scheme: dark){.navitem[aria-current="true"]{color:var(--accent)}}
:root[data-theme="light"] .navitem[aria-current="true"]{color:var(--accent-ink)}
.navitem em{font-style:normal; margin-left:auto; font-family:var(--data); font-size:11px; color:var(--ink-3)}

main{padding:26px 28px 90px; min-width:0; max-width:1180px}
.pagehead{display:flex; align-items:flex-end; gap:18px; margin-bottom:22px; flex-wrap:wrap}
.pagehead h1{font-size:25px}
.pagehead p{margin:5px 0 0; color:var(--ink-2); max-width:64ch; font-size:13.5px}
.pagehead .tools{margin-left:auto}

/* ─── Cards / tables ─────────────────────────────────────────────────── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
.card > header{
  padding:12px 15px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.card > header h2{font-size:15px}
.card > header .spacer{margin-left:auto}
.grid{display:grid; gap:14px}
/* Without this, a wide scroller inside a grid child (the board's columns, a
   timeline) sizes the whole track to its content and the page scrolls sideways. */
.grid > *{min-width:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13px}
th{
  text-align:left; font-family:var(--data); font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500;
  padding:9px 14px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface);
}
td{padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--surface-2)}
td .sub{color:var(--ink-3); font-size:12px; display:block; margin-top:2px}
td.num{white-space:nowrap}
.grid.pair{align-items:start}

/* ─── Chips / stage ──────────────────────────────────────────────────── */
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px;
  font-size:11.5px; font-weight:500; white-space:nowrap; border:1px solid transparent;
}
.chip .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.chip.s0{background:var(--surface-2); color:var(--ink-3); border-color:var(--line)}
.chip.s1{background:var(--surface-2); color:var(--ink-2); border-color:var(--line-strong)}
.chip.s2{background:var(--ochre-soft); color:var(--ochre)}
.chip.s3{background:var(--ochre-soft); color:var(--ochre)}
.chip.s4{background:var(--accent-soft); color:var(--accent-ink)}
.chip.s5{background:var(--accent-soft); color:var(--accent-ink)}
.chip.s6{background:var(--accent); color:var(--paper)}
.chip.out{background:transparent; color:var(--ink-3); border-color:var(--line-strong); opacity:.75}
.chip.warn{background:var(--danger-soft); color:var(--danger)}
:root[data-theme="dark"] .chip.s4,:root[data-theme="dark"] .chip.s5{color:var(--accent)}
@media (prefers-color-scheme: dark){.chip.s4,.chip.s5{color:var(--accent)}}
:root[data-theme="light"] .chip.s4,:root[data-theme="light"] .chip.s5{color:var(--accent-ink)}
.cat{font-family:var(--data); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}

/* ─── Stat strip ─────────────────────────────────────────────────────── */
/* Separate tiles rather than one joined strip: a partial last row then leaves
   page background instead of an orphaned slab, at any count and any width. */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(136px,1fr)); gap:10px}
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:13px 15px;
}
.stat b{display:block; font-family:var(--data); font-size:24px; font-weight:600; letter-spacing:-.02em; line-height:1.15; font-variant-numeric:tabular-nums}
.stat small{display:block; margin-top:3px; font-size:11.5px; color:var(--ink-3)}
.stat.alert b{color:var(--danger)}
.stat.go b{color:var(--accent)}

/* ─── Funnel ─────────────────────────────────────────────────────────── */
.funnel{display:flex; flex-direction:column; gap:7px; padding:15px}
.frow{display:grid; grid-template-columns:120px 1fr 34px; align-items:center; gap:11px; font-size:12.5px}
.frow .bar{height:20px; background:var(--surface-2); border-radius:3px; overflow:hidden; position:relative}
.frow .bar i{display:block; height:100%; background:var(--accent); opacity:.28; border-radius:3px; transition:width .3s}
.frow.hot .bar i{opacity:.75}
.frow .n{text-align:right; font-family:var(--data); font-variant-numeric:tabular-nums; color:var(--ink-2)}
.frow label{color:var(--ink-2); cursor:pointer}
.frow:hover label{color:var(--ink)}

/* ─── Filters ────────────────────────────────────────────────────────── */
.filters{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
select, input[type=text], input[type=date], textarea{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius);
  padding:5px 8px; font-size:12.5px; max-width:100%;
}
textarea{width:100%; font-family:var(--data); font-size:12px; line-height:1.6; resize:vertical}
label.field{display:flex; flex-direction:column; gap:4px}
label.field > span{font-family:var(--data); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}

/* ─── Plan ───────────────────────────────────────────────────────────── */
.ws{margin-bottom:14px}
.ws > header{cursor:pointer; user-select:none}
.ws code{font-family:var(--data); font-size:11px; color:var(--accent); background:var(--accent-soft); padding:2px 6px; border-radius:3px}
:root[data-theme="dark"] .ws code{color:var(--accent)}
.progress{width:88px; height:5px; background:var(--surface-3); border-radius:3px; overflow:hidden; flex:none}
.progress i{display:block; height:100%; background:var(--accent); transition:width .3s}
.status{
  font-family:var(--data); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  border:1px solid var(--line-strong); background:var(--surface); border-radius:3px;
  padding:2px 7px; cursor:pointer; white-space:nowrap;
}
.status[data-s="done"]{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}
:root[data-theme="dark"] .status[data-s="done"]{color:var(--accent)}
@media (prefers-color-scheme: dark){.status[data-s="done"]{color:var(--accent)}}
:root[data-theme="light"] .status[data-s="done"]{color:var(--accent-ink)}
.status[data-s="doing"]{background:var(--ochre-soft); color:var(--ochre); border-color:transparent}
.status[data-s="blocked"]{background:var(--danger-soft); color:var(--danger); border-color:transparent}
.done td:nth-child(2){text-decoration:line-through; text-decoration-color:var(--ink-3); color:var(--ink-3)}
.overdue{color:var(--danger); font-weight:600}

/* ─── Timeline (Gantt) ───────────────────────────────────────────────── */
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:var(--radius); overflow:hidden}
.seg button{
  background:var(--surface); border:0; padding:6px 13px; font-size:12.5px; cursor:pointer;
  color:var(--ink-2); border-right:1px solid var(--line-strong);
}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2); color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:var(--accent)}
@media (prefers-color-scheme: dark){.seg button[aria-pressed="true"]{color:var(--accent)}}
:root[data-theme="light"] .seg button[aria-pressed="true"]{color:var(--accent-ink)}

.gantt{--mw:88px; --lw:246px; overflow:auto; max-height:min(72vh,640px); overscroll-behavior:contain}
.gantt .inner{min-width:calc(var(--lw) + var(--n) * var(--mw))}
.grow{display:grid; grid-template-columns:var(--lw) 1fr; border-bottom:1px solid var(--line); min-height:31px}
.grow:last-child{border-bottom:0}
.glabel{
  position:sticky; left:0; z-index:2; background:var(--surface);
  border-right:1px solid var(--line); padding:6px 13px; font-size:12.5px;
  display:flex; align-items:center; gap:8px; min-width:0;
}
.glabel span.t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.gtrack{position:relative; min-width:calc(var(--n) * var(--mw))}

/* month grid drawn as a repeating background so every row lines up exactly */
.gtrack{
  background-image:linear-gradient(to right, var(--line) 0 1px, transparent 1px 100%);
  background-size:var(--mw) 100%;
}

.ghead{display:grid; grid-template-columns:var(--lw) 1fr; border-bottom:1px solid var(--line-strong); position:sticky; top:0; z-index:5; background:var(--surface)}
.ghead .glabel{z-index:6; border-bottom:0}
.gmonths{display:grid; min-width:calc(var(--n) * var(--mw))}
.gmonths span{
  font-family:var(--data); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); padding:8px 0 8px 9px; border-left:1px solid var(--line); white-space:nowrap;
}
.gmonths span.q{border-left-color:var(--line-strong); color:var(--ink-2)}

.gbar{
  position:absolute; top:6px; height:17px; border-radius:3px; min-width:9px;
  font-size:10.5px; overflow:hidden; white-space:nowrap; touch-action:none;
  color:var(--ink-2); background:var(--surface-3); border:1px solid var(--line-strong);
  cursor:grab;
}
.gbar:hover{filter:brightness(.97); border-color:var(--ink-3)}
.gbar.dragging{cursor:grabbing; box-shadow:0 2px 8px rgba(0,0,0,.22); z-index:3; filter:none}
.gbar .grip{position:absolute; top:-2px; bottom:-2px; width:7px; cursor:col-resize}
.gbar .grip.l{left:0} .gbar .grip.r{right:0}
.gbar:hover .grip{background:linear-gradient(var(--ink-3),var(--ink-3)) center/1px 9px no-repeat}
.dragtip{
  position:fixed; z-index:90; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--ink); color:var(--paper); font-family:var(--data); font-size:11px;
  padding:4px 9px; border-radius:4px; white-space:nowrap; transform:translate(-50%,-190%);
}
.dragtip.show{opacity:1}
.gbar.doing{background:var(--ochre-soft); border-color:var(--ochre); color:var(--ochre)}
.gbar.blocked{background:var(--danger-soft); border-color:var(--danger); color:var(--danger)}
.gbar.done{background:var(--accent-soft); border-color:transparent; color:var(--accent-ink); opacity:.7}
:root[data-theme="dark"] .gbar.done{color:var(--accent)}
@media (prefers-color-scheme: dark){.gbar.done{color:var(--accent)}}
:root[data-theme="light"] .gbar.done{color:var(--accent-ink)}
.gbar.late{border-color:var(--danger); border-style:dashed}

.grow.wsrow{background:var(--surface-2)}
.grow.wsrow .glabel{background:var(--surface-2); font-weight:600; cursor:pointer}
.grow.wsrow .gtrack{background-color:var(--surface-2)}
.gsum{position:absolute; top:11px; height:7px; border-radius:4px; background:var(--line-strong); overflow:hidden}
.gsum i{display:block; height:100%; background:var(--accent); border-radius:4px}
.gcode{font-family:var(--data); font-size:10px; color:var(--ink-3); flex:none}
.gcaret{font-family:var(--data); font-size:9px; color:var(--ink-3); width:9px; flex:none}

.today{position:absolute; top:0; bottom:0; width:0; border-left:1px dashed var(--danger); opacity:.55; z-index:1}
.grow.msrow{background:var(--surface); min-height:34px}
.gms{
  position:absolute; top:9px; width:11px; height:11px; margin-left:-5.5px; transform:rotate(45deg);
  background:var(--surface); border:1.5px solid var(--ink-2); border-radius:2px;
  cursor:grab; touch-action:none;
}
.gms:hover{border-color:var(--accent)}
.gms.dragging{cursor:grabbing; border-color:var(--accent); z-index:3}
.gms.hit{background:var(--accent); border-color:var(--accent)}
.gmslabel{position:absolute; top:8px; font-family:var(--data); font-size:9.5px; color:var(--ink-3); margin-left:9px; white-space:nowrap}
.glegend{display:flex; gap:15px; flex-wrap:wrap; padding:11px 15px; font-size:11.5px; color:var(--ink-3); border-top:1px solid var(--line)}
.glegend b{display:inline-block; width:15px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle; border:1px solid var(--line-strong); background:var(--surface-3)}
.glegend b.doing{background:var(--ochre-soft); border-color:var(--ochre)}
.glegend b.blocked{background:var(--danger-soft); border-color:var(--danger)}
.glegend b.done{background:var(--accent-soft); border-color:transparent}
.glegend b.today{border:0; border-left:1px dashed var(--danger); width:1px; height:11px; border-radius:0; margin-right:9px}

/* ─── Board (Kanban) ─────────────────────────────────────────────────── */
.board{display:grid; grid-template-columns:repeat(4,minmax(210px,1fr)); gap:12px; align-items:start; overflow-x:auto; padding-bottom:6px}
.col{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); min-height:150px; display:flex; flex-direction:column}
.col > header{
  display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line);
  font-family:var(--data); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3);
}
.col > header b{margin-left:auto; font-family:var(--data); font-size:11px; color:var(--ink-2); font-weight:500}
.col .rail-dot{width:7px; height:7px; border-radius:2px; background:var(--line-strong)}
.col[data-col="doing"] .rail-dot{background:var(--ochre)}
.col[data-col="blocked"] .rail-dot{background:var(--danger)}
.col[data-col="done"] .rail-dot{background:var(--accent)}
.col{max-height:min(68vh,660px)}
.col .stack{padding:9px; display:flex; flex-direction:column; gap:8px; flex:1; overflow-y:auto; overscroll-behavior:contain}
.col.over{border-color:var(--accent); background:var(--accent-soft)}
.kcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:9px 11px; cursor:grab; display:flex; flex-direction:column; gap:5px;
  border-left:2px solid var(--line-strong);
}
.kcard:hover{border-color:var(--line-strong); box-shadow:var(--shadow)}
.kcard.dragging{opacity:.4}
.kcard[data-s="doing"]{border-left-color:var(--ochre)}
.kcard[data-s="blocked"]{border-left-color:var(--danger)}
.kcard[data-s="done"]{border-left-color:var(--accent)}
.kcard[data-s="done"] .kt{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--line-strong)}
.kcard .kt{font-size:12.5px; line-height:1.4}
.kcard .kmeta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11px; color:var(--ink-3)}
.kcard .kmeta .num{font-variant-numeric:tabular-nums}
.kcard .kws{font-family:var(--data); font-size:9.5px; letter-spacing:.06em; color:var(--accent); background:var(--accent-soft); padding:1px 5px; border-radius:3px}
:root[data-theme="light"] .kcard .kws{color:var(--accent-ink)}
.kcard .kpartner{color:var(--ink-3); font-size:11px}
.colempty{padding:16px 4px; text-align:center; color:var(--ink-3); font-size:11.5px}

/* ─── Milestones ─────────────────────────────────────────────────────── */
.ms{display:flex; flex-direction:column}
.ms-item{display:grid; grid-template-columns:16px 1fr auto; gap:13px; padding:11px 15px; border-bottom:1px solid var(--line); align-items:start}
.ms-item:last-child{border-bottom:0}
.ms-item .pip{width:11px; height:11px; border-radius:50%; border:2px solid var(--line-strong); margin-top:4px; background:var(--surface)}
.ms-item.hit .pip{background:var(--accent); border-color:var(--accent)}
.ms-item b{font-weight:600; font-size:13.5px}
.ms-item p{margin:3px 0 0; color:var(--ink-2); font-size:12.5px}

/* ─── Outreach ───────────────────────────────────────────────────────── */
.outgrid{display:grid; grid-template-columns:270px minmax(0,1fr); gap:14px; align-items:start}
.tpl{display:flex; flex-direction:column; gap:2px; padding:9px}
.tplbtn{
  text-align:left; background:none; border:0; padding:8px 10px; border-radius:var(--radius);
  cursor:pointer; color:var(--ink-2); font-size:13px; transition:background .12s;
}
.tplbtn:hover{background:var(--surface-2); color:var(--ink)}
.tplbtn[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
:root[data-theme="dark"] .tplbtn[aria-current="true"]{color:var(--accent)}
@media (prefers-color-scheme: dark){.tplbtn[aria-current="true"]{color:var(--accent)}}
:root[data-theme="light"] .tplbtn[aria-current="true"]{color:var(--accent-ink)}
.tplbtn small{display:block; font-weight:400; color:var(--ink-3); font-size:11.5px; margin-top:1px}
.out{padding:0}
.out textarea{border:0; border-radius:0; min-height:520px; padding:17px 19px; background:var(--surface); font-size:12.5px}
.out textarea:focus-visible{outline-offset:-2px}

/* ─── Narrative ──────────────────────────────────────────────────────── */
.prose{max-width:none}
.ladder{display:flex; flex-direction:column; gap:0; padding:4px 0}
.rung{display:grid; grid-template-columns:104px minmax(0,1fr); gap:14px; padding:11px 15px; border-bottom:1px solid var(--line); align-items:baseline}
.rung:last-child{border-bottom:0}
.rung > b{
  font-family:var(--data); font-size:10px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); font-weight:500; overflow-wrap:anywhere;
}
.rung div b{font-size:14px; font-family:var(--display)}
.rung p{margin:3px 0 0; color:var(--ink-2); font-size:12.5px}
.pull{
  font-family:var(--display); font-size:16px; line-height:1.45; color:var(--ink);
  padding:13px 16px; border-left:2px solid var(--accent); background:var(--surface-2);
  border-radius:0 var(--radius) var(--radius) 0; margin:0;
}
.bank{display:grid; grid-template-columns:repeat(auto-fill,minmax(266px,1fr)); gap:9px; padding:15px}
.bank q{
  display:block; quotes:none; font-family:var(--display); font-size:13.5px; line-height:1.45;
  padding:11px 13px; background:var(--surface-2); border-radius:var(--radius); color:var(--ink);
}
.rules{display:grid; gap:1px; background:var(--line)}
.rule{background:var(--surface); padding:12px 15px; display:grid; grid-template-columns:22px 1fr; gap:11px; align-items:start}
.rule .glyph{font-family:var(--data); font-weight:600; font-size:13px; line-height:1.5}
.rule.no .glyph{color:var(--danger)}
.rule.yes .glyph{color:var(--accent)}
.rule b{display:block; font-size:13px; font-weight:600}
.rule p{margin:2px 0 0; color:var(--ink-2); font-size:12.5px}
.six{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:1px; background:var(--line)}
.layer{background:var(--surface); padding:14px 15px}
.layer .eyebrow{color:var(--accent)}
:root[data-theme="light"] .layer .eyebrow{color:var(--accent-ink)}
.layer b{display:block; font-family:var(--display); font-size:15px; margin:5px 0 3px}
.layer p{margin:0; font-size:12.5px; color:var(--ink-2)}

/* ─── Drawer ─────────────────────────────────────────────────────────── */
.scrim{position:fixed; inset:0; background:rgba(10,16,15,.42); z-index:60; opacity:0; pointer-events:none; transition:opacity .18s}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; height:100%; width:min(460px,100%); z-index:61;
  background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow);
  transform:translateX(100%); transition:transform .22s ease; display:flex; flex-direction:column;
}
.drawer.open{transform:none}
.drawer > header{padding:15px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.drawer > header h3{font-size:16px; margin-right:auto}
.drawer .body{padding:16px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:13px; flex:1}
.drawer > footer{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px}
.drawer > footer .spacer{margin-left:auto}

/* ─── Activity feed and threads ──────────────────────────────────────── */
.feed{display:flex; flex-direction:column}
.ev{
  display:grid; grid-template-columns:24px minmax(0,1fr); gap:11px;
  padding:12px 15px; border-bottom:1px solid var(--line);
}
.ev:last-child{border-bottom:0}
.ev .av{
  width:24px; height:24px; border-radius:5px; display:grid; place-items:center;
  font-family:var(--data); font-size:10px; font-weight:600; letter-spacing:0;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); flex:none;
}
.ev.agent .av{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}
:root[data-theme="dark"] .ev.agent .av{color:var(--accent)}
@media (prefers-color-scheme: dark){.ev.agent .av{color:var(--accent)}}
:root[data-theme="light"] .ev.agent .av{color:var(--accent-ink)}
.ev .hd{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:2px}
.ev .who{font-weight:600; font-size:12.5px}
.ev .when, .ev .on{font-family:var(--data); font-size:10.5px; color:var(--ink-3)}
.ev .on{cursor:pointer}
.ev .on:hover{color:var(--accent)}
.ev .body{font-size:13px; color:var(--ink-2); white-space:pre-wrap; overflow-wrap:anywhere}
.ev .body b{color:var(--ink); font-weight:600}
.kind{
  font-family:var(--data); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase;
  padding:1px 6px; border-radius:3px; background:var(--surface-2); color:var(--ink-3); border:1px solid var(--line);
}
.kind.finding{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}
:root[data-theme="dark"] .kind.finding{color:var(--accent)}
@media (prefers-color-scheme: dark){.kind.finding{color:var(--accent)}}
:root[data-theme="light"] .kind.finding{color:var(--accent-ink)}
.kind.question{background:var(--ochre-soft); color:var(--ochre); border-color:transparent}
.kind.handoff{background:var(--ochre-soft); color:var(--ochre); border-color:transparent}
.kind.change{background:transparent}
.ev .to{font-family:var(--data); font-size:10.5px; color:var(--ochre)}

.thread{display:flex; flex-direction:column; gap:9px; margin-top:2px}
.thread .ev{padding:9px 0; border-bottom:1px solid var(--line); grid-template-columns:20px minmax(0,1fr); gap:9px}
.thread .ev .av{width:20px; height:20px; font-size:9px}
.thread .ev:last-child{border-bottom:0}
.composer{display:flex; flex-direction:column; gap:7px}
.composer textarea{min-height:62px; font-family:var(--body); font-size:13px}
.composer .row{display:flex; gap:7px; align-items:center}
.composer select{flex:none}

/* ─── Sync chip and banner ───────────────────────────────────────────── */
.syncchip{
  display:inline-flex; align-items:center; gap:7px; background:transparent; border:1px solid var(--line);
  border-radius:20px; padding:4px 11px 4px 9px; cursor:pointer; color:var(--ink-3);
  font-family:var(--data); font-size:10.5px; letter-spacing:.05em; white-space:nowrap;
}
.syncchip:hover{border-color:var(--line-strong); color:var(--ink-2)}
.syncchip .dot{width:6px; height:6px; border-radius:50%; background:var(--ink-3); flex:none}
.syncchip[data-s="synced"] .dot{background:var(--accent)}
.syncchip[data-s="live"] .dot{background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.syncchip[data-s="live"]{color:var(--accent-ink); border-color:var(--accent-soft)}
:root[data-theme="dark"] .syncchip[data-s="live"]{color:var(--accent)}
@media (prefers-color-scheme: dark){.syncchip[data-s="live"]{color:var(--accent)}}
:root[data-theme="light"] .syncchip[data-s="live"]{color:var(--accent-ink)}
.syncchip[data-s="ahead"] .dot{background:var(--ochre)}
.syncchip[data-s="behind"] .dot{background:var(--danger)}
.syncchip[data-s="ahead"]{color:var(--ochre); border-color:var(--ochre-soft)}
.syncchip[data-s="behind"]{color:var(--danger); border-color:var(--danger-soft)}

#banner:empty{display:none}
.bnr{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:9px 20px; border-bottom:1px solid var(--line); font-size:12.5px;
  background:var(--ochre-soft); color:var(--ink);
}
.bnr.info{background:var(--accent-soft)}
.bnr .grow{margin-left:auto; display:flex; gap:7px}
.bnr b{font-weight:600}
.bnr code{font-family:var(--data); font-size:11.5px}

.empty{padding:30px 16px; text-align:center; color:var(--ink-3); font-size:13px}
.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(14px);
  background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:20px; font-size:12.5px;
  z-index:80; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1; transform:translateX(-50%)}
.note{
  font-size:12px; color:var(--ink-2); background:var(--ochre-soft); border-radius:var(--radius);
  padding:9px 13px; border-left:2px solid var(--ochre);
}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:sticky; top:56px; z-index:30; height:auto; flex-direction:row; overflow-x:auto;

}

/* ─── Phones ─────────────────────────────────────────────────────────── */
@media (max-width:640px){
  .topbar{height:52px; padding:0 12px; gap:8px}
  .mark b{font-size:16px}
  .mark span{display:none}

  .pagehead{gap:12px; margin-bottom:16px}
  .pagehead h1{font-size:21px}
  .pagehead p{font-size:13px}
  .pagehead .tools{margin-left:0; width:100%}
  .pagehead .tools .btn{flex:1}

  /* Comfortable tap targets, and 16px inputs so iOS stops zooming on focus */
  .btn{padding:9px 13px}
  .navitem{padding:9px 12px; font-size:14px}
  select, input[type=text], input[type=date]{padding:8px 10px; font-size:16px}
  .status{padding:5px 9px}
  .filters{gap:8px}
  .filters select, .filters input[type=text]{flex:1; min-width:130px; width:auto}

  .card > header{padding:11px 13px}
  th, td{padding:9px 11px}
  .stats{gap:8px; grid-template-columns:repeat(auto-fit,minmax(108px,1fr))}
  .stat{padding:11px 12px}
  .stat b{font-size:21px}

  /* Tables that are too wide to scan sideways become stacked cards */
  .cardtable thead{display:none}
  .cardtable, .cardtable tbody, .cardtable tr, .cardtable td{display:block; width:100%}
  .cardtable{border-collapse:separate; margin:10px}
  .cardtable tr{
    border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);
    padding:11px 13px; margin-bottom:9px;
  }
  .cardtable tr:last-child{margin-bottom:0}
  .cardtable td{border:0; padding:3px 0; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
  .cardtable td .sub{flex-basis:100%; margin-left:84px; margin-top:1px}
  .cardtable td.lead .sub{margin-left:0}
  .cardtable td::before{
    content:attr(data-label); flex:none; width:74px;
    font-family:var(--data); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-3); line-height:1.7;
  }
  .cardtable td.lead{display:block; margin-bottom:6px}
  .cardtable td.lead::before{display:none}
  .cardtable .tablewrap{overflow:visible}
  .hide-sm{display:none}

  /* One board column per screen, swiped between */
  .board{
    grid-auto-flow:column; grid-auto-columns:82vw; grid-template-columns:none;
    gap:10px; scroll-snap-type:x mandatory; padding-bottom:10px;
  }
  .col{scroll-snap-align:start; max-height:none}
  .col .stack{max-height:60vh}

  /* The timeline stays a timeline — just fit more of it on screen */
  .gantt{--mw:62px; --lw:148px; max-height:64vh}
  .glabel{padding:6px 9px; font-size:12px}
  .glegend{gap:10px; font-size:11px; padding:10px 12px}
  .glegend span:last-child{width:100%; margin-left:0!important}

  .out textarea{min-height:340px; padding:14px}
  .bnr{padding:10px 12px}
  .bnr .grow{margin-left:0; width:100%}
  .bnr .grow .btn{flex:1}
  .drawer > footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .board, .tablewrap, .gantt{-webkit-overflow-scrolling:touch}
}

@media (max-width:560px){
  #themeBtn{display:none}          /* falls back to the OS theme, which is right on a phone */
  .syncchip{padding:4px 9px}
}
</style>

<script>
"use strict";

/* ══ Reference data ═══════════════════════════════════════════════════ */

const STAGES = [
  {id:"identified", label:"Identified",   hint:"On the target list, no contact yet"},
  {id:"researched", label:"Researched",   hint:"Right person and angle worked out"},
  {id:"approached", label:"Approached",   hint:"Outreach sent, awaiting reply"},
  {id:"meeting",    label:"Meeting held", hint:"First substantive conversation done"},

  {id:"active",     label:"Active",       hint:"Working on the facility together"}
];
const OUT_STAGES = [
  {id:"parked",   label:"Parked",   hint:"Right partner, wrong moment"},
  {id:"declined", label:"Declined", hint:"Not proceeding"}
];
const ALL_STAGES = STAGES.concat(OUT_STAGES);
const stageRank = id => STAGES.findIndex(s => s.id === id);
const stageLabel = id => (ALL_STAGES.find(s => s.id === id) || {label:id}).label;
const stageClass = id => stageRank(id) < 0 ? (id === "declined" ? "out" : "out") : "s" + stageRank(id);

const CATEGORIES = {
  carrier: {
    label:"Risk carriers",
    blurb:"Insurers and reinsurers who can carry the catastrophe layer.",
    hook:"you already price and carry catastrophe risk of exactly this shape — what we are adding is what the capital does after the trigger",
    ask:"a technical read on our trigger design, and an indication of appetite for a small collateralised layer",
    give:"a live test of response-linked structuring on a bounded, well-instrumented risk, with the modelling and evidence work done alongside you",
    questions:[
      "How do you currently see Sri Lanka / South Asia telecom exposure?",
      "Where does a response-linked structure create problems for you — reserving, capital treatment, or rating?",

  capital: {

    blurb:"ILS funds and investors who take collateralised risk positions.",

    ask:"a view on investability, and what you would need to see before an indicative position",
    give:"early sight of a new instrument class with a clean, bounded first implementation and real telemetry behind the trigger",
    questions:[
      "What is your minimum ticket and what wrapper do you need — note, cat bond lite, or private ILS?",
      "Does a purpose-linked obligation on the capital break anything in your mandate?",
      "What collateral and custody arrangement would you require?",
      "How do you underwrite basis risk on a modelled or parametric trigger?",
      "What would make this a portfolio diversifier rather than a curiosity?"
    ]
  },
  donor: {
    label:"Donors & foundations",
    blurb:"Philanthropic and public funders who can sponsor protection.",
    hook:"the people most exposed here are not the people who can pay to transfer the risk — sponsored premium is what closes that gap",
    ask:"grant or premium-support funding for the first facility, and a view on which of your programmes it fits",
    give:"a protection instrument where the money is tied to delivered response, restoration and recovery, with outcome evidence built into the contract rather than added as reporting",
    questions:[
      "Which of your windows funds premium support versus technical assistance?",
      "What outcome evidence would you need to see to justify sponsoring a renewal?",
      "Do you have an existing relationship with the Sri Lankan authorities we should route through?",
      "What is your timeline from concept note to decision?",
      "Would you co-fund with another donor or do you need to be sole sponsor?"
    ]
  },
  dfi: {
    label:"Development finance",
    blurb:"Multilateral banks and development finance institutions.",
    hook:"critical telecom is the dependency behind almost every other emergency function, and it is currently unfunded in most disaster risk financing frameworks",
    ask:"technical partnership, and a route into your disaster risk financing programme for the country",
    give:"a replicable facility design for an infrastructure class your existing DRF instruments do not reach",
    questions:[
      "Where does telecom sit in your current DRF work for Sri Lanka?",
      "What is the path from concept to an instrument you could co-finance?",
      "Do you need a sovereign counterparty, or can this sit with the operator?",
      "What procurement or eligibility rules would we need to design around?",
      "Which of your teams — DRF, digital infrastructure, or country office — should own this?"
    ]
  },
  operator: {
    label:"Infrastructure operators",
    blurb:"Telecom operators whose network is the protected asset.",
    hook:"you already carry the cost of emergency restoration and you already hold the telemetry that proves it — this turns both into a financed, contracted capability",
    ask:"a working session on your restoration cost experience, and access to outage telemetry under NDA",
    give:"pre-funded emergency response and restoration capacity, priced ahead of the event rather than absorbed on your balance sheet after it",
    questions:[
      "What did the last major event actually cost you in restoration, and over what period?",
      "Which sites are the critical dependency for emergency services?",
      "What outage and restoration telemetry do you hold, at what granularity, and who owns it?",
      "What emergency commitments are you already obliged to meet by licence or regulation?",
      "Who signs off on a risk transfer arrangement — treasury, network, or the board?"
    ]
  },
  digital: {
    label:"Digital-asset infrastructure",
    blurb:"Regulated issuance, custody and settlement providers.",
    hook:"we need capital states, claims and settlement to be machine-readable and auditable — not a token for its own sake",
    ask:"an architecture conversation and a view on the regulated issuance path",
    give:"a real financial instrument with genuine state complexity, rather than another tokenisation demo",
    questions:[
      "What regulated wrapper do you support for a collateralised risk instrument?",
      "How do you handle conditional release of collateral against off-chain evidence?",
      "What custody model applies, and under which regulator?",
      "Can rights and obligations be represented natively, or only referenced?",
      "What does the audit trail look like to an insurance regulator?"
    ]
  },
  data: {
    label:"AI & data partners",
    blurb:"Hazard modelling, telemetry, and administration technology.",
    hook:"the trigger is only as good as the data behind it, and the administration cost is what has historically killed granular structures",
    ask:"data access or a modelling collaboration for the Sri Lanka peril set",
    give:"a defined, fundable use case with a real counterparty rather than a research exercise",
    questions:[
      "What hazard and exposure data do you hold for Sri Lanka, and at what resolution?",
      "What is your licensing model for use inside a financial trigger?",
      "Could your data be referenced contractually as the settlement source?",
      "What is your view on basis risk for this peril set?",
      "What would a joint validation exercise look like?"

  },
  verifier: {
    label:"Verification & assurance",
    blurb:"Independent parties who evidence what was delivered.",
    hook:"if the capital is tied to delivered response, someone independent has to be able to say what was actually delivered",

    give:"a chance to define the verification standard for a new instrument class at the point it is being designed",
    questions:[
      "What would you need to attest that emergency connectivity was actually delivered?",

      "What would a pre-approval or no-objection process look like?"
    ]
  }
};
const catLabel = id => (CATEGORIES[id] || {label:id}).label;

/* ══ Seed content ═════════════════════════════════════════════════════ */

const P = (id,name,cat,country,why,ask) =>
  ({id, name, cat, country, why, ask, stage:"identified", owner:"", contact:"",
    next:"Research the right entry point and warm intro path", nextDate:"", notes:"", seeded:true});

const SEED = {
  version: 1,
  meta: {
    org:"Lionscraft",
    facility:"Sri Lanka Telecom Resilience Facility",
    product:"Response-Linked ART",
    revision:1,
    updated:"2026-08-08"
  },
  partners: [

/* ══ Store ════════════════════════════════════════════════════════════ */

const KEY = "lionscraft-desk-v1";
const META_KEY = "lionscraft-desk-sync";
const SHARED_URL = "data/desk.json";

let DB, hadLocal = false;
try {
  const raw = localStorage.getItem(KEY);
  hadLocal = !!raw;
  DB = raw ? JSON.parse(raw) : structuredClone(SEED);
} catch (e) { DB = structuredClone(SEED); }
if (!DB.partners){ DB = structuredClone(SEED); hadLocal = false; }

/* Sync state. `base` is the shared revision this browser's copy was taken from;
   `dirty` means it has been edited since. Together they tell us whether the
   shared file has moved on underneath us. */
let sync = {base:0, dirty:false};
try {
  const m = localStorage.getItem(META_KEY);
  if (m) sync = Object.assign(sync, JSON.parse(m));
} catch (e) {}

let shared = null;                 // the fetched shared dataset, if reachable
let syncState = "local";           // local | synced | ahead | behind | live

/* ── Live backend ─────────────────────────────────────────────────────
   When an API server is reachable, the desk works server-first: saves push
   automatically, and a poll picks up what others (people or agents) changed.
   Without it, everything falls back to the git flow above. */
const DEFAULT_API = "https://risk-cockpit-api.replit.app";
const API_KEY = "lionscraft-desk-api";
const TOKEN_KEY = "lionscraft-desk-token";

const apiBase = (() => {
  try { const o = localStorage.getItem(API_KEY); if (o) return o.replace(/\/+$/, ""); } catch (e) {}
  if (/\.(replit\.app|repl\.co|replit\.dev)$/.test(location.hostname)) return location.origin;
  return DEFAULT_API;
})();
let apiToken = "";
try { apiToken = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) {}

let liveMode = false;
let pushTimer = null, pollTimer = null, pushing = false;

async function apiFetch(path, opts){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 6000);
  try {
    const res = await fetch(apiBase + path, Object.assign({signal:ctrl.signal, cache:"no-store"}, opts));
    return res;
  } finally { clearTimeout(t); }
}

/* Push local state to the server. Re-reads the server first and unions the
   activity logs by id, so nothing anyone appended is ever lost — data fields
   are last-write-wins, the log is merge-always. */
async function pushLive(retried){
  if (!liveMode || pushing) return;
  if (!apiToken){ syncState = "ahead"; renderBanner(); return; }
  pushing = true;
  try {
    const cur = await (await apiFetch("/api/desk")).json();
    const seen = new Set(DB.activity.map(e => e.id));
    for (const e of (cur.desk.activity || [])) if (!seen.has(e.id)) DB.activity.push(e);
    DB.activity.sort((a, b) => (a.at || "").localeCompare(b.at || ""));
    DB.meta.revision = cur.revision + 1;
    DB.meta.updated = TODAY;
    const res = await apiFetch("/api/desk", {
      method:"PUT",
      headers:{"content-type":"application/json", "authorization":"Bearer " + apiToken},
      body:JSON.stringify(DB)
    });
    if (res.ok){
      sync = {base:DB.meta.revision, dirty:false}; saveSync();
      try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {}
      syncState = "live"; renderBanner(); renderRail();
    } else if (res.status === 409 && !retried){
      pushing = false; return pushLive(true);
    } else if (res.status === 401){
      apiToken = ""; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      syncState = "ahead"; renderBanner();
      toast("Write token rejected — set it under Data");
    } else {
      syncState = "ahead"; renderBanner();
    }
  } catch (e) {
    syncState = "ahead"; renderBanner();   // offline; next save retries
  } finally { pushing = false; }
}

const queuePush = () => {
  if (!liveMode) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushLive(false), 900);
};

/* Poll for other people's and agents' changes. Adopt silently when this copy
   has nothing unpushed; otherwise raise the banner and let the human choose. */
function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (document.hidden || pushing) return;
    try {
      const h = await (await apiFetch("/healthz")).json();
      if (h.revision <= sync.base) return;
      const cur = await (await apiFetch("/api/desk")).json();
      shared = cur.desk;
      if (!sync.dirty){
        DB = structuredClone(shared);
        sync = {base:cur.revision, dirty:false}; saveSync();
        try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {}
        syncState = "live";
        renderRail(); renderBanner();
        if (!drawer.classList.contains("open")) render();
      } else {
        syncState = "behind"; renderBanner();
      }
    } catch (e) { /* unreachable this tick; try again next tick */ }
  }, 20000);
}

const saveSync = () => { try { localStorage.setItem(META_KEY, JSON.stringify(sync)); } catch (e) {} };
const revOf = d => (d && d.meta && d.meta.revision) || 0;

/* Load the shared dataset committed in the repo. Reachable over http(s) — which
   is how the team uses it. On file:// and inside the claude.ai artifact the fetch
   is blocked by design, so the embedded seed stands in and we say so plainly
   rather than pretending to be in sync. */
async function loadShared(){
  /* Prefer the live API when one is configured and reachable. */
  if (apiBase){
    try {
      const cur = await (await apiFetch("/api/desk")).json();
      if (Array.isArray(cur.desk.partners)){
        shared = cur.desk;
        liveMode = true;
        if (!hadLocal || !sync.dirty){
          DB = structuredClone(shared);
          sync = {base:cur.revision, dirty:false};
          save(true); saveSync();
          syncState = "live";
        } else if (cur.revision > sync.base){
          syncState = "behind";
        } else {
          syncState = "ahead";
          queuePush();          // unpushed edits from last session — push them
        }
        startPolling();
        return;
      }
    } catch (e) { /* API down or unreachable — fall through to the git file */ }
  }

  try {
    const res = await fetch(SHARED_URL, {cache:"no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    if (!Array.isArray(json.partners) || !Array.isArray(json.tasks)) throw new Error("unexpected shape");
    shared = json;
  } catch (e) {
    syncState = "local";
    return;
  }

  if (!hadLocal){
    DB = structuredClone(shared);
    sync = {base:revOf(shared), dirty:false};
    save(true); saveSync();
    syncState = "synced";
  } else if (revOf(shared) > sync.base){
    syncState = "behind";
  } else {
    syncState = sync.dirty ? "ahead" : "synced";
  }
}

/* Take the shared version, discarding local edits. */
function adoptShared(){
  DB = structuredClone(shared);
  sync = {base:revOf(shared), dirty:false};
  save(true); saveSync();
  syncState = liveMode ? "live" : "synced";
  renderRail(); renderBanner(); render();
  toast("Loaded shared revision " + revOf(shared));
}

/* Keep working locally, but stop being told about a revision already seen.
   In live mode "keep mine" means mine wins: push it (the activity log still
   merges, so nothing anyone else said is lost). */
function dismissShared(){
  sync.base = revOf(shared);
  sync.dirty = true;
  saveSync();
  syncState = "ahead";
  renderBanner(); render();
  queuePush();
}

/* Stamp the current data as the next shared revision, ready to be committed. */
function publishPayload(){
  const out = structuredClone(DB);
  out.meta = Object.assign({}, out.meta, {
    revision: Math.max(revOf(DB), revOf(shared)) + 1,
    updated: TODAY
  });
  return out;
}
function markPublished(rev){
  DB.meta.revision = rev;
  DB.meta.updated = TODAY;
  sync = {base:rev, dirty:false};
  save(true); saveSync();
  syncState = "synced";
  renderRail(); renderBanner(); render();
}

/* Who this browser is, so comments and changes are attributable. Agents identify
   themselves by their own name in the same field. */
const ME_KEY = "lionscraft-desk-me";
let me = "";
try { me = localStorage.getItem(ME_KEY) || ""; } catch (e) {}
const whoami = () => me || "unattributed";

if (!Array.isArray(DB.activity)) DB.activity = [];

/* Backfill start dates for data saved before the timeline existed. Only fills
   a missing field — never overwrites anything the team has edited. */
(function backfillStarts(){
  let touched = false;
  DB.tasks.forEach(t => {
    if (t.start) return;
    const seeded = SEED.tasks.find(s => s.id === t.id);
    t.start = seeded ? seeded.start : shiftDays(t.due, -21);
    touched = true;
  });
  if (touched) try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {}
})();

/* `quiet` is used by the sync machinery, which manages the dirty flag itself.
   Every other caller is a user edit, so it marks the copy as unpublished. */
const save = (quiet) => {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { toast("Could not save locally — this browser is blocking storage"); return; }
  if (!quiet){
    if (!sync.dirty){
      sync.dirty = true; saveSync();
      if (syncState === "synced" || syncState === "live"){ syncState = "ahead"; renderBanner(); }
    }
    queuePush();     // no-op unless live mode is on
  }
};
const uid = p => p + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Real calendar date in the viewer's own timezone, so "overdue" stays true
   without anyone having to edit a constant. */
const TODAY = (() => {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
})();
const fmtDate = d => {
  if (!d) return "—";
  const [y, m, dd] = d.split("-");
  return dd + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m - 1] + " " + y.slice(2);
};
const isOverdue = d => !!d && d < TODAY;

/* Date maths for the timeline. All dates are plain YYYY-MM-DD, handled in UTC
   so a viewer's timezone can never shift a bar by a day. */
const DAY = 86400000;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function toMs(d){ return Date.parse(d + "T00:00:00Z"); }
function shiftDays(d, n){
  if (!d) return "";
  return new Date(toMs(d) + n * DAY).toISOString().slice(0, 10);
}
function monthsBetween(from, to){
  const out = [];
  let y = +from.slice(0, 4), m = +from.slice(5, 7);
  const ey = +to.slice(0, 4), em = +to.slice(5, 7);
  while (y < ey || (y === ey && m <= em)){
    out.push({y, m, key:y + "-" + String(m).padStart(2, "0")});
    if (++m > 12){ m = 1; y++; }
  }
  return out;
}
const monthStart = mo => mo.key + "-01";
const monthEnd = mo => new Date(Date.UTC(mo.y, mo.m, 0)).toISOString().slice(0, 10);

    actor: whoami(),
    actorKind: "human",
    kind: "comment"
  }, e);
  DB.activity.push(entry);
  return entry;
}

const eventsFor = (refType, ref) =>
  DB.activity.filter(e => e.refType === refType && e.ref === ref)
             .sort((a, b) => (a.at || "").localeCompare(b.at || ""));

/* Human-scale relative time; falls back to the date once it stops being useful. */
function ago(iso){
  if (!iso) return "";
  const t = Date.parse(iso);
  if (isNaN(t)) return iso;
  const mins = Math.round((Date.now() - t) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  const days = Math.round(hrs / 24);
  if (days < 8) return days + "d ago";
  return fmtDate(iso.slice(0, 10));
}

let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

  {id:"narrative", label:"Narrative",  count:() => ""}
];

function renderRail(){
  document.getElementById("rail").innerHTML =
    '<div class="eyebrow">Desk</div>' +
    VIEWS.map(v =>
      `<button class="navitem" data-view="${v.id}" aria-current="${v.id === current}">
         ${v.label}<em class="num">${v.count()}</em>
       </button>`).join("");
}

/* The open tab lives in the URL hash, so a refresh keeps you where you were,
   back and forward work, and a tab can be linked to directly. Plan carries its
   sub-view too: #plan/gantt. */
function routeFromHash(){
  const [view, mode] = (location.hash || "").replace(/^#\/?/, "").split("/");
  return {
    view: VIEWS.some(v => v.id === view) ? view : "overview",
    mode: ["list", "gantt"].includes(mode) ? mode : null
  };
}

function applyRoute(replace){
  const h = "#" + current + (current === "plan" && planMode !== "list" ? "/" + planMode : "");
  if (location.hash === h) return;
  history[replace ? "replaceState" : "pushState"](null, "", h);
}

function go(id){
  current = id;
  applyRoute(false);
  renderRail(); render();
  window.scrollTo({top:0});
}

window.addEventListener("popstate", () => {
  const r = routeFromHash();
  current = r.view;
  if (r.mode) planMode = r.mode;
  renderRail(); render();
});

const SYNC_LABEL = {

  ahead:  () => liveMode ? (apiToken ? "saving…" : "token needed") : "rev " + revOf(DB) + " · unpublished",
  behind: () => "update available",

};

function renderBanner(){
  const chip = document.getElementById("syncChip");
  chip.dataset.s = syncState;
  chip.querySelector(".txt").textContent = SYNC_LABEL[syncState]();
  chip.title = {
    live:   "Connected to the live backend. Saves push automatically and others' changes arrive on their own.",
    synced: "This browser matches the shared version committed to the repo.",
    ahead:  liveMode ? (apiToken ? "Pushing your edits to the live backend…" : "Edits are local only — set the write token under Data to push them.")
                     : "You have edits that are not in the shared version yet. Open Data to publish them.",
    behind: "The shared version has moved on since your copy was taken.",
    local:  "No shared source could be reached, so this is a standalone local copy."
  }[syncState];

  const el = document.getElementById("banner");
  if (syncState !== "behind"){ el.innerHTML = ""; return; }
  el.innerHTML = `
    <div class="bnr">
      <span><b>Shared data has moved on.</b>
        Revision <code>${revOf(shared)}</code> was published on ${fmtDate(shared.meta.updated)};

    </div>`;
  document.getElementById("takeShared").onclick = () => {
    if (sync.dirty && !confirm("Loading the shared version replaces your local edits. Continue?")) return;

  };
  document.getElementById("keepMine").onclick = dismissShared;
}

function wireBoard(){
  const ws = document.getElementById("boardWs");
  if (ws) ws.onchange = e => { boardWs = e.target.value; render(); };
  const ow = document.getElementById("boardOwner");
  if (ow) ow.onchange = e => { boardOwner = e.target.value; render(); };
  const q = document.getElementById("boardQ");
  if (q) q.oninput = e => {
    boardQ = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("boardQ");
    if (el){ el.focus(); el.setSelectionRange(pos, pos); }
  };
  const cl = document.getElementById("boardClear");
  if (cl) cl.onclick = () => { boardWs = boardOwner = boardQ = ""; render(); };

  let dragId = null;
  document.querySelectorAll(".kcard").forEach(card => {
    card.addEventListener("dragstart", e => {
      dragId = card.dataset.card;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragId);
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      document.querySelectorAll(".col.over").forEach(c => c.classList.remove("over"));
    });
  });

  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", e => {
      if (!col.contains(e.relatedTarget)) col.classList.remove("over");
    });
    col.addEventListener("drop", e => {
      e.preventDefault();
      col.classList.remove("over");
      const id = dragId || e.dataTransfer.getData("text/plain");
      const t = DB.tasks.find(x => x.id === id);
      if (!t || t.status === col.dataset.col) return;
      const was = t.status;
      t.status = col.dataset.col;
      logEvent({kind:"change", refType:"task", ref:t.id, body:statusLabel[was] + " → " + statusLabel[t.status]});
      save(); renderRail(); render();
      toast("Moved to " + statusLabel[t.status]);
    });
  });
}

/* ── Timeline ─────────────────────────────────────────────────────── */

function planGantt(){
  const ts = DB.tasks.filter(t => t.due);
  if (!ts.length) return '<div class="card"><div class="empty">No dated tasks to plot yet.</div></div>';

  const starts = ts.map(t => t.start || shiftDays(t.due, -21));
  const ends = ts.map(t => t.due).concat(DB.milestones.map(m => m.date));
  const first = starts.concat(DB.milestones.map(m => m.date)).sort()[0];
  const last = ends.sort()[ends.length - 1];
  const months = monthsBetween(first, last);
  const t0 = toMs(monthStart(months[0]));
  const t1 = toMs(monthEnd(months[months.length - 1])) + DAY;
  const pct = d => ((toMs(d) - t0) / (t1 - t0) * 100);
  const clamp = n => Math.max(0, Math.min(100, n));

  const bar = (from, to) => {
    const l = clamp(pct(from));
    const w = Math.max(0.6, clamp(pct(to) + (100 / months.length / 30)) - l);
    return `left:${l.toFixed(3)}%; width:${w.toFixed(3)}%`;
  };

  const todayLine = pct(TODAY) >= 0 && pct(TODAY) <= 100
    ? `<div class="today" style="left:${pct(TODAY).toFixed(3)}%"></div>` : "";

  const rows = DB.workstreams.map(ws => {
    const list = ts.filter(t => t.ws === ws.id);
    if (!list.length) return "";
    const done = list.filter(t => t.status === "done").length;
    const wsStart = list.map(t => t.start || shiftDays(t.due, -21)).sort()[0];
    const wsEnd = list.map(t => t.due).sort()[list.length - 1];
    const isOpen = !collapsed.has(ws.id);

          <div class="gsum" style="${bar(wsStart, wsEnd)}" title="${fmtDate(wsStart)} → ${fmtDate(wsEnd)}">
            <i style="width:${Math.round(done / list.length * 100)}%"></i>
          </div>
        </div>
      </div>`;

    if (!isOpen) return head;

    return head + list.map(t => {
      const s = t.start || shiftDays(t.due, -21);
      const late = isOverdue(t.due) && t.status !== "done";
      return `
      <div class="grow">
        <div class="glabel" data-task="${t.id}" style="cursor:pointer; padding-left:31px">
          <span class="t" title="${esc(t.title)}">${esc(t.title)}</span>

        <div class="gtrack">

          <div class="gbar ${t.status} ${late ? "late" : ""}" data-task="${t.id}" data-drag="task"
               style="${bar(s, t.due)}"
               title="${esc(t.title)} — ${fmtDate(s)} → ${fmtDate(t.due)}${late ? " (overdue)" : ""}"
            ><i class="grip l"></i><i class="grip r"></i></div>

  }).join("");

  return `
  <section class="card ws" style="margin-bottom:14px">
    <div class="gantt" style="--n:${months.length}" data-t0="${monthStart(months[0])}" data-t1="${shiftDays(monthEnd(months[months.length - 1]), 1)}">
      <div class="inner">
        <div class="ghead">
          <div class="glabel"><span class="eyebrow">Workstream / task</span></div>
          <div class="gmonths" style="grid-template-columns:repeat(${months.length},1fr)">
            ${months.map(mo => `<span class="${[1,4,7,10].includes(mo.m) ? "q" : ""}">${MONTHS[mo.m - 1]}${mo.m === 1 || mo === months[0] ? " " + String(mo.y).slice(2) : ""}</span>`).join("")}
          </div>
        </div>

        <div class="grow msrow">
          <div class="glabel"><span class="eyebrow">Milestones</span></div>
          <div class="gtrack">
            ${todayLine}
            ${DB.milestones.map((m, i) => `
              <div class="gms ${m.hit ? "hit" : ""}" style="left:${clamp(pct(m.date)).toFixed(3)}%"
                   data-drag="ms" data-msid="${m.id}"
                   title="M${i + 1} — ${esc(m.name)} · ${fmtDate(m.date)} — drag to move"></div>
              <div class="gmslabel" style="left:${clamp(pct(m.date)).toFixed(3)}%">M${i + 1}</div>`).join("")}
          </div>
        </div>

        ${rows}
      </div>
    </div>
    <div class="glegend">
      <span><b></b>To do</span>
      <span><b class="doing"></b>Doing</span>
      <span><b class="blocked"></b>Blocked</span>
      <span><b class="done"></b>Done</span>
      <span><b class="today"></b>Today, ${fmtDate(TODAY)}</span>
      <span style="margin-left:auto">Drag to reschedule · dashed outline = past its due date</span>
    </div>
  </section>`;
}

/* Dragging on the timeline. Bars move or resize by whole days; milestone
   diamonds move their date. Nothing is written until the pointer is released,
   so an abandoned drag changes nothing. */
let ganttScroll = {x:0, y:0};
let drag = null;

function wireGantt(){
  const g = document.querySelector(".gantt");
  if (!g) return;

  g.scrollLeft = ganttScroll.x;
  g.scrollTop = ganttScroll.y;
  g.addEventListener("scroll", () => { ganttScroll = {x:g.scrollLeft, y:g.scrollTop}; }, {passive:true});

  const spanDays = Math.round((toMs(g.dataset.t1) - toMs(g.dataset.t0)) / DAY);
  const tip = document.getElementById("dragtip");

  g.addEventListener("pointerdown", e => {
    const handle = e.target.closest("[data-drag]");
    if (!handle || e.button !== 0) return;
    const track = handle.parentElement;
    const kind = handle.dataset.drag;
    const rec = kind === "ms"
      ? DB.milestones.find(m => m.id === handle.dataset.msid)
      : DB.tasks.find(t => t.id === handle.dataset.task);
    if (!rec) return;

    const mode = kind === "ms" ? "ms"
      : e.target.classList.contains("grip")
        ? (e.target.classList.contains("l") ? "start" : "end")
        : "move";

    drag = {
      handle, rec, mode, kind, moved:false,
      x0:e.clientX,
      perDay: track.clientWidth / spanDays,
      pctDay: 100 / spanDays,
      left0: parseFloat(handle.style.left) || 0,
      width0: parseFloat(handle.style.width) || 0,
      s0: kind === "ms" ? rec.date : (rec.start || shiftDays(rec.due, -21)),
      d0: kind === "ms" ? rec.date : rec.due
    };
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    handle.classList.add("dragging");
    e.preventDefault();
  });

  g.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x0;
    if (!drag.moved && Math.abs(dx) < 3) return;
    drag.moved = true;
    const days = Math.round(dx / drag.perDay);
    const shift = days * drag.pctDay;
    const h = drag.handle;

    if (drag.mode === "move" || drag.mode === "ms"){
      h.style.left = (drag.left0 + shift) + "%";
    } else if (drag.mode === "start"){
      const w = Math.max(drag.pctDay, drag.width0 - shift);
      h.style.left = (drag.left0 + drag.width0 - w) + "%";
      h.style.width = w + "%";
    } else {
      h.style.width = Math.max(drag.pctDay, drag.width0 + shift) + "%";
    }

    const [ns, nd] = previewDates(drag, days);
    tip.textContent = drag.kind === "ms" ? fmtDate(ns) : fmtDate(ns) + " → " + fmtDate(nd);
    tip.style.left = e.clientX + "px";
    tip.style.top = e.clientY + "px";
    tip.classList.add("show");
  });

  const finish = e => {
    if (!drag) return;
    const d = drag; drag = null;
    d.handle.classList.remove("dragging");
    tip.classList.remove("show");

    if (!d.moved){
      if (d.kind === "task") taskDrawer(d.rec.id);
      else { d.rec.hit = !d.rec.hit; save(); render(); }
      return;
    }
    const days = Math.round((e.clientX - d.x0) / d.perDay);
    const [ns, nd] = previewDates(d, days);
    if (d.kind === "ms") d.rec.date = ns;
    else { d.rec.start = ns; d.rec.due = nd; }
    save(); render();
    toast(d.kind === "ms" ? "Milestone moved to " + fmtDate(ns) : fmtDate(ns) + " → " + fmtDate(nd));
  };
  g.addEventListener("pointerup", finish);
  g.addEventListener("pointercancel", () => {
    if (!drag) return;
    drag.handle.classList.remove("dragging");
    drag = null; tip.classList.remove("show"); render();
  });
}

function previewDates(d, days){
  if (d.kind === "ms") return [shiftDays(d.s0, days), ""];
  if (d.mode === "move") return [shiftDays(d.s0, days), shiftDays(d.d0, days)];
  if (d.mode === "start"){
    const ns = shiftDays(d.s0, days);
    return [ns > d.d0 ? d.d0 : ns, d.d0];
  }
  const nd = shiftDays(d.d0, days);
  return [d.s0, nd < d.s0 ? d.s0 : nd];
}

let actFilter = {actor:"", kind:"", q:""};

const refLabel = e => {
  if (e.refType === "partner"){ const p = DB.partners.find(x => x.id === e.ref); return p ? p.name : e.ref; }
  if (e.refType === "task"){ const t = DB.tasks.find(x => x.id === e.ref); return t ? t.title : e.ref; }
  if (e.refType === "milestone"){ const m = DB.milestones.find(x => x.id === e.ref); return m ? m.name : e.ref; }
  return e.ref || "the board";
};

const initials = name => (name || "?").split(/[\s\-_]+/).filter(Boolean).slice(0, 2)
  .map(w => w[0]).join("").toUpperCase() || "?";

function eventRow(e, showRef){
  return `
  <div class="ev ${e.actorKind === "agent" ? "agent" : ""}">
    <span class="av" title="${e.actorKind === "agent" ? "Agent" : "Person"}">${initials(e.actor)}</span>

      <div class="hd">

        ${showRef && e.ref ? `<span class="on" data-goref="${e.refType}:${e.ref}">on ${esc(refLabel(e))}</span>` : ""}

      <div class="body">${esc(e.body || e.summary || "")}</div>

function viewActivity(){
  let list = DB.activity.slice().sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  if (actFilter.actor) list = list.filter(e => e.actor === actFilter.actor);
  if (actFilter.kind) list = list.filter(e => e.kind === actFilter.kind);
  if (actFilter.q){
    const q = actFilter.q.toLowerCase();
    list = list.filter(e => ((e.body || "") + (e.summary || "") + refLabel(e)).toLowerCase().includes(q));
  }

  const actors = [...new Set(DB.activity.map(e => e.actor))].sort();
  const agents = [...new Set(DB.activity.filter(e => e.actorKind === "agent").map(e => e.actor))];
  const open = DB.activity.filter(e => e.kind === "question").length;

  return `
  <div class="pagehead">
    <div>
      <div class="eyebrow">Shared log</div>
      <h1>Activity</h1>

  </div>

  <div class="grid" style="gap:14px">

      <div class="stat ${open ? "alert" : ""}"><b>${open}</b><small>Open questions</small></div>

    </div>

    <section class="card">
      <header>
        <div class="filters">
          <select id="actActor">
            <option value="">Everyone</option>
            ${actors.map(a => `<option value="${esc(a)}" ${actFilter.actor === a ? "selected" : ""}>${esc(a)}</option>`).join("")}
          </select>
          <select id="actKind">
            <option value="">All kinds</option>
            ${Object.entries(EVENT_KINDS).map(([k, v]) => `<option value="${k}" ${actFilter.kind === k ? "selected" : ""}>${v.label}</option>`).join("")}
          </select>
          <input type="text" id="actQ" placeholder="Search…" value="${esc(actFilter.q)}" style="width:170px">
          ${(actFilter.actor || actFilter.kind || actFilter.q) ? '<button class="btn ghost" id="actClear">Clear</button>' : ""}
        </div>
        <span class="spacer"></span>
        <span class="cat">${list.length} shown</span>
      </header>
      <div class="feed">
        ${list.length ? list.map(e => eventRow(e, true)).join("")
          : `<div class="empty">Nothing logged yet.<br><span style="font-size:12px">Comments you leave on a partner or task appear here, and so does anything an agent writes.</span></div>`}
      </div>
    </section>

    <div class="note">Agents write to this log through the repo — see <code style="font-family:var(--data)">AGENTS.md</code>. Entries are attributed and timestamped, and nothing here is deleted by the app.</div>
  </div>`;
}

function wireActivity(){
  const a = document.getElementById("actActor");
  if (a) a.onchange = e => { actFilter.actor = e.target.value; render(); };
  const k = document.getElementById("actKind");
  if (k) k.onchange = e => { actFilter.kind = e.target.value; render(); };
  const q = document.getElementById("actQ");
  if (q) q.oninput = e => {
    actFilter.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("actQ");
    if (el){ el.focus(); el.setSelectionRange(pos, pos); }
  };
  const c = document.getElementById("actClear");
  if (c) c.onclick = () => { actFilter = {actor:"", kind:"", q:""}; render(); };
}

/* A thread plus composer, embedded in the partner and task drawers. */
function threadBlock(refType, ref){
  const list = eventsFor(refType, ref);
  return `
  <div>
    <span class="eyebrow">Thread${list.length ? " · " + list.length : ""}</span>
    <div class="thread" style="margin-bottom:9px">
      ${list.length ? list.map(e => eventRow(e, false)).join("")
        : '<p style="color:var(--ink-3); font-size:12.5px; margin:6px 0 0">Nothing yet. Notes you add here are visible to everyone, including agents.</p>'}
    </div>
    <div class="composer">
      <textarea id="cmtBody" rows="2" placeholder="Add a note…"></textarea>
      <div class="row">
        <select id="cmtKind">
          ${Object.entries(EVENT_KINDS).filter(([k]) => k !== "change")
            .map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("")}
        </select>
        <button class="btn" id="cmtAdd">Post</button>
      </div>
    </div>
  </div>`;
}

function wireThread(refType, ref, after){
  const btn = drawer.querySelector("#cmtAdd");
  if (!btn) return;
  btn.onclick = () => {
    const body = drawer.querySelector("#cmtBody").value.trim();
    if (!body){ toast("Write something first"); return; }
    if (!me){
      const name = prompt("Your name, so the note is attributable:", "");
      if (!name) return;
      me = name.trim(); try { localStorage.setItem(ME_KEY, me); } catch (e) {}
    }
    logEvent({kind:drawer.querySelector("#cmtKind").value, refType, ref, body});
    save(); renderRail();
    if (after) after();
    toast("Posted");
  };
}

function wireOutreach(){
  document.getElementById("outPartner").onchange = e => { outState.partner = e.target.value; render(); };
  document.querySelectorAll("[data-tpl]").forEach(b =>
    b.onclick = () => { outState.tpl = b.dataset.tpl; render(); });

  document.getElementById("copyOut").onclick = async () => {
    const ta = document.getElementById("outText");
    try { await navigator.clipboard.writeText(ta.value); toast("Copied"); }
    catch (e) { ta.select(); toast("Press ⌘C to copy"); }
  };

  document.getElementById("dlOut").onclick = async () => {
    const p = DB.partners.find(x => x.id === outState.partner);
    const name = (p ? p.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" : "") + outState.tpl + ".txt";
    const data = document.getElementById("outText").value;
    if (!window.claude || !window.claude.downloads){ toast("Downloads unavailable here — use Copy"); return; }
    try { await window.claude.downloads.save({filename:name, data}); toast("Saved"); }
    catch (err){
      const code = err && err.code;
      if (code === "declined") return;
      if (code === "rate_limited") toast("Too many prompts — try again in a moment");
      else if (code === "too_large") toast("Too large to save");
      else toast("Could not save — use Copy instead");
    }
  };
}

const drawer = document.getElementById("drawer");
const scrim = document.getElementById("scrim");

function closeDrawer(){
  drawer.classList.remove("open"); scrim.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true"); drawer.innerHTML = "";
}
scrim.onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function openDrawer(html){
  drawer.innerHTML = html;
  drawer.classList.add("open"); scrim.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  const f = drawer.querySelector("input,select,textarea");
  if (f) f.focus();
  drawer.querySelectorAll("[data-close]").forEach(b => b.onclick = closeDrawer);
}

function field(label, name, value, type){
  return `<label class="field"><span>${label}</span>
    <input type="${type || "text"}" name="${name}" value="${esc(value)}"></label>`;
}
