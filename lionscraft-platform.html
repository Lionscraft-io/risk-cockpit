      ${field("Owner", "owner", t.owner)}
      <label class="field"><span>Linked partner</span><select name="partner">
        <option value="">— none —</option>
        ${DB.partners.slice().sort((a, b) => a.name.localeCompare(b.name))
          .map(p => `<option value="${p.id}" ${t.partner === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
      </select></label>
      ${isNew ? "" : threadBlock("task", t.id)}
    </div>
    <footer>
      ${isNew ? "" : '<button class="btn danger" data-del>Delete</button>'}
      <span class="spacer"></span>
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" data-save>Save</button>
    </footer>`);

  wireThread("task", t.id, () => taskDrawer(t.id));

  drawer.querySelector("[data-save]").onclick = () => {
    const wasStatus = t.status;
    drawer.querySelectorAll("[name]").forEach(el => t[el.name] = el.value.trim());
    if (!t.title){ toast("Give it a title first"); return; }
    if (isNew) DB.tasks.push(t);
    else if (wasStatus !== t.status){
      logEvent({kind:"change", refType:"task", ref:t.id,
        body:statusLabel[wasStatus] + " → " + statusLabel[t.status]});
    }
    save(); closeDrawer(); renderRail(); render(); toast(isNew ? "Task added" : "Saved");
  };
  const del = drawer.querySelector("[data-del]");
  if (del) del.onclick = () => {
    DB.tasks = DB.tasks.filter(x => x.id !== t.id);
    save(); closeDrawer(); renderRail(); render(); toast("Deleted");
  };
}

/* A note against the board as a whole, or aimed at a named actor — the way a
   person answers an agent's question without opening the record it came from. */
function noteDrawer(){
  openDrawer(`
    <header><h3>Add a note</h3><button class="btn ghost" data-close>Close</button></header>
    <div class="body">
      <label class="field"><span>Note</span><textarea id="nBody" rows="5" placeholder="What happened, what you found, or what someone should pick up."></textarea></label>
      <label class="field"><span>Kind</span><select id="nKind">
        ${Object.entries(EVENT_KINDS).filter(([k]) => k !== "change")
          .map(([k, v]) => `<option value="${k}">${v.label} — ${v.hint}</option>`).join("")}
      </select></label>
      <label class="field"><span>About</span><select id="nRef">
        <option value="board:">The board generally</option>
        <optgroup label="Partners">
          ${DB.partners.slice().sort((a, b) => a.name.localeCompare(b.name))
            .map(p => `<option value="partner:${p.id}">${esc(p.name)}</option>`).join("")}
        </optgroup>
        <optgroup label="Tasks">
          ${DB.tasks.map(t => `<option value="task:${t.id}">${esc(t.title)}</option>`).join("")}
        </optgroup>
      </select></label>
      <label class="field"><span>Directed at (optional)</span>
        <input type="text" id="nTo" placeholder="e.g. partner-researcher"></label>
      <div class="note">Anything here is readable by every agent working on this board, and by anyone with the link. It is a shared log, not a private note.</div>
    </div>
    <footer><span class="spacer"></span>
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="nSave">Post</button></footer>`);

  drawer.querySelector("#nSave").onclick = () => {
    const body = drawer.querySelector("#nBody").value.trim();
    if (!body){ toast("Write something first"); return; }
    if (!me){
      const name = prompt("Your name, so the note is attributable:", "");
      if (!name) return;
      me = name.trim(); try { localStorage.setItem(ME_KEY, me); } catch (e) {}
    }
    const [refType, ref] = drawer.querySelector("#nRef").value.split(":");
    const to = drawer.querySelector("#nTo").value.trim();
    logEvent({
      kind: drawer.querySelector("#nKind").value,
      refType, ref: ref || "", body,
      to: to || undefined
    });
    save(); closeDrawer(); renderRail(); render(); toast("Posted");
  };
}

function dataDrawer(){
  const state = {
    live:   `Connected to the live backend at <code>${esc(apiBase)}</code>, revision <code>${revOf(DB)}</code>. Saves push automatically; the repo file is now a backup, not the live truth.`,
    synced: `This browser matches shared revision <code>${revOf(DB)}</code>. Nothing to publish.`,
    ahead:  liveMode
      ? (apiToken ? `Pushing your edits to the live backend…`
                  : `The live backend is reachable but this browser has no write token, so your edits stay local. Set the token below.`)
      : `You have edits on top of shared revision <code>${sync.base}</code>. Publish them to put them in the repo.`,
    behind: `Shared revision <code>${revOf(shared)}</code> exists; your copy came from <code>${sync.base}</code>. Resolve that before publishing.`,
    local:  `No shared source could be reached, so this is a standalone copy. Open the desk on GitHub Pages to work against the shared version.`
  }[syncState];

  openDrawer(`
    <header><h3>Data</h3><button class="btn ghost" data-close>Close</button></header>
    <div class="body">
      <div class="${syncState === "synced" ? "note" : "note"}" style="${syncState === "synced" ? "border-left-color:var(--accent); background:var(--accent-soft)" : ""}">${state}</div>

      <div>
        <span class="eyebrow">Publish to the team</span>
        <p style="margin:6px 0 9px; color:var(--ink-2); font-size:12.5px">
          Stamps this data as revision <b>${Math.max(revOf(DB), revOf(shared)) + 1}</b> and copies it.
          Commit it to <code style="font-family:var(--data)">${SHARED_URL}</code> in the repo and everyone
          picks it up on their next reload.
        </p>
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <button class="btn primary" data-publish>Copy as revision ${Math.max(revOf(DB), revOf(shared)) + 1}</button>
          <button class="btn" data-publishfile>Download it</button>
        </div>
      </div>

      <div>
        <span class="eyebrow">Working copy</span>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:7px">
          <button class="btn" data-copy>Copy JSON as-is</button>
          <button class="btn danger" data-reset>${shared ? "Discard my edits" : "Reset to seed"}</button>
        </div>
      </div>

      <label class="field"><span>Your name — used to attribute notes and changes</span>
        <input type="text" id="meName" value="${esc(me)}" placeholder="e.g. Toni"></label>

      <div>
        <span class="eyebrow">Live backend</span>
        <div style="display:grid; gap:9px; margin-top:7px">
          <label class="field"><span>API URL — blank uses the built-in default</span>
            <input type="text" id="apiUrl" value="${esc((() => { try { return localStorage.getItem(API_KEY) || ""; } catch (e) { return ""; } })())}" placeholder="${esc(DEFAULT_API) || "https://…"}"></label>
          <label class="field"><span>Write token — needed to push changes</span>
            <input type="text" id="apiTok" value="${esc(apiToken)}" placeholder="paste the team write token"></label>
          <p style="margin:0; color:var(--ink-3); font-size:11.5px">Changes to either take effect after a reload. Without a token you can still read everything live; your edits just stay in this browser.</p>
        </div>
      </div>

      <label class="field"><span>Paste JSON to import</span>
        <textarea id="importBox" rows="7" placeholder="Paste an exported file here, then press Import."></textarea></label>
      <button class="btn" data-import style="align-self:flex-start">Import</button>

      <p style="color:var(--ink-3); font-size:12px; margin:0">
        ${DB.partners.length} partners · ${DB.tasks.length} tasks · ${DB.milestones.length} milestones
        · ${DB.activity.length} log entries · last published ${fmtDate(DB.meta.updated)}
      </p>
    </div>
    <footer><span class="spacer"></span><button class="btn" data-close>Done</button></footer>`);

  const copy = async (text, ok) => {
    try { await navigator.clipboard.writeText(text); toast(ok); return true; }
    catch (e) { toast("Clipboard blocked — use Download instead"); return false; }
  };

  drawer.querySelector("[data-publish]").onclick = async () => {
    const payload = publishPayload();
    if (await copy(JSON.stringify(payload, null, 2), "Copied revision " + payload.meta.revision + " — commit it to " + SHARED_URL))
      markPublished(payload.meta.revision);
  };
  drawer.querySelector("[data-publishfile]").onclick = async () => {
    const payload = publishPayload();
    if (!window.claude || !window.claude.downloads){ toast("Downloads only work on the claude.ai copy — use Copy"); return; }
    try {
      await window.claude.downloads.save({filename:"desk.json", data:JSON.stringify(payload, null, 2)});
      markPublished(payload.meta.revision);
      toast("Saved revision " + payload.meta.revision);
    } catch (err){
      if (err && err.code === "declined") return;
      toast("Could not save — use Copy instead");
    }
  };
  drawer.querySelector("[data-copy]").onclick = () => copy(JSON.stringify(DB, null, 2), "JSON copied");

  const nameBox = drawer.querySelector("#meName");
  if (nameBox) nameBox.onchange = () => {
    me = nameBox.value.trim();
    try { localStorage.setItem(ME_KEY, me); } catch (e) {}
    toast(me ? "Notes will be attributed to " + me : "Attribution cleared");
  };
  const apiBox = drawer.querySelector("#apiUrl");
  if (apiBox) apiBox.onchange = () => {
    try { localStorage.setItem(API_KEY, apiBox.value.trim()); } catch (e) {}
    toast("API URL saved — reload to connect");
  };
  const tokBox = drawer.querySelector("#apiTok");
  if (tokBox) tokBox.onchange = () => {
    apiToken = tokBox.value.trim();
    try { localStorage.setItem(TOKEN_KEY, apiToken); } catch (e) {}
    if (apiToken && liveMode && sync.dirty) queuePush();
    toast(apiToken ? "Token saved" : "Token cleared");
  };

  drawer.querySelector("[data-import]").onclick = () => {
    const raw = document.getElementById("importBox").value.trim();
    if (!raw){ toast("Paste some JSON first"); return; }
    let next;
    try { next = JSON.parse(raw); }
    catch (e){ toast("That is not valid JSON"); return; }
    if (!Array.isArray(next.partners) || !Array.isArray(next.tasks)){
      toast("That file is missing partners or tasks"); return;
    }
    DB = next; save(); closeDrawer(); renderRail(); renderBanner(); render(); toast("Imported");
  };
  drawer.querySelector("[data-reset]").onclick = () => {
    const target = shared || SEED;
    const what = shared ? "the shared version, revision " + revOf(shared) : "the seeded content";
    if (!confirm("Discard everything in this browser and go back to " + what + "?")) return;
    DB = structuredClone(target);
    sync = {base:revOf(target), dirty:false};
    save(true); saveSync();
    syncState = shared ? "synced" : "local";
    closeDrawer(); renderRail(); renderBanner(); render();
    toast("Reset to " + what);
  };
}

/* ══ Global wiring ════════════════════════════════════════════════════ */

document.getElementById("dataBtn").onclick = dataDrawer;

document.getElementById("view").addEventListener("click", e => {
  const nav = e.target.closest("[data-view]");
  if (nav){ go(nav.dataset.view); return; }

  const cyc = e.target.closest("[data-cycle]");
  if (cyc){
    e.stopPropagation();
    const t = DB.tasks.find(x => x.id === cyc.dataset.cycle);
    const was = t.status;
    t.status = STATUS_CYCLE[(STATUS_CYCLE.indexOf(t.status) + 1) % STATUS_CYCLE.length];
    logEvent({kind:"change", refType:"task", ref:t.id, body:statusLabel[was] + " → " + statusLabel[t.status]});
    save(); renderRail(); render(); return;
  }

  const mode = e.target.closest("[data-mode]");
  if (mode){ planMode = mode.dataset.mode; applyRoute(true); render(); return; }

  const col = e.target.closest("[data-collapse]");
  if (col){
    const id = col.dataset.collapse;
    collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
    render(); return;
  }

  const ref = e.target.closest("[data-goref]");
  if (ref){
    const [type, id] = ref.dataset.goref.split(":");
    if (type === "partner") partnerDrawer(id);
    else if (type === "task") taskDrawer(id);
    return;
  }

  const ms = e.target.closest("[data-ms]");
  if (ms && current === "plan"){
    const m = DB.milestones.find(x => x.id === ms.dataset.ms);
    m.hit = !m.hit;
    logEvent({kind:"change", refType:"milestone", ref:m.id, body:m.hit ? "Milestone reached" : "Milestone reopened"});
    save(); render(); return;
  }

  /* Timeline bars and diamonds are driven by pointer events, not clicks. */
  if (e.target.closest(".gbar, .gms")) return;

  const kc = e.target.closest("[data-card]");
  if (kc){ taskDrawer(kc.dataset.card); return; }

  const pr = e.target.closest("[data-partner]");
  if (pr){ partnerDrawer(pr.dataset.partner); return; }

  const tr = e.target.closest("[data-task]");
  if (tr){ taskDrawer(tr.dataset.task); return; }

  if (e.target.id === "addPartner"){ partnerDrawer(null); return; }
  if (e.target.id === "addTask"){ taskDrawer(null); return; }
  if (e.target.id === "newNote"){ noteDrawer(); return; }
  if (e.target.id === "fClear"){ filters = {stage:"", cat:"", q:""}; render(); return; }
});

document.getElementById("view").addEventListener("change", e => {
  if (e.target.id === "fStage"){ filters.stage = e.target.value; render(); }
  if (e.target.id === "fCat"){ filters.cat = e.target.value; render(); }
});
document.getElementById("view").addEventListener("input", e => {
  if (e.target.id === "fQ"){
    filters.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("fQ");
    if (el){ el.focus(); el.setSelectionRange(pos, pos); }
  }
});

document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
};

document.getElementById("syncChip").onclick = dataDrawer;

(async function init(){
  const r = routeFromHash();
  current = r.view;
  if (r.mode) planMode = r.mode;
  applyRoute(true);

  renderRail();
  render();
  renderBanner();
  await loadShared();
  renderRail();
  renderBanner();
  render();
})();
</script>
