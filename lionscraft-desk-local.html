/* Columns are edited in place. Every change is an ordinary board edit, so it
   commits and syncs like any other. */
function ensureColumns(){
  if (!Array.isArray(DB.columns) || !DB.columns.length) DB.columns = structuredClone(DEFAULT_COLUMNS);
}
const slug = t => (t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "col") ;

function addMilestone(){
  const name = prompt("Milestone:", "");
  if (!name || !name.trim()) return;
  const date = prompt("Date it is due (YYYY-MM-DD):", "");
  if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date.trim())){ if (date) toast("Needs a date like 2026-12-19"); return; }
  const m = {id:uid("m"), name:name.trim(), date:date.trim(), hit:false, note:""};
  DB.milestones.push(m);
  logEvent({kind:"change", refType:"milestone", ref:m.id, body:"Added — due " + fmtDate(m.date)});
  save(); render();
}

function milestoneMenu(id){
  const i = DB.milestones.findIndex(m => m.id === id);
  if (i < 0) return;
  const m = DB.milestones[i];
  const choice = prompt('"' + m.name + '" — due ' + fmtDate(m.date) + "\n\n" +
    "  rename   change its name\n  date     change the date\n  note     what it means\n  remove   delete it\n\nType one:", "date");
  if (!choice) return;
  const c = choice.trim().toLowerCase();
  if (c === "rename"){
    const v = prompt("Name:", m.name); if (!v || !v.trim()) return; m.name = v.trim();
  } else if (c === "date"){
    const v = prompt("Date (YYYY-MM-DD):", m.date);
    if (!v || !/^\d{4}-\d{2}-\d{2}$/.test(v.trim())){ if (v) toast("Needs a date like 2026-12-19"); return; }
    m.date = v.trim();
  } else if (c === "note"){
    const v = prompt("What it means:", m.note || ""); if (v === null) return; m.note = v.trim();
  } else if (c === "remove"){
    if (!confirm('Remove "' + m.name + '"?')) return;
    DB.milestones.splice(i, 1);
    logEvent({kind:"change", refType:"board", ref:"", body:"Removed the milestone " + m.name});
  } else { toast("Type rename, date, note or remove"); return; }
  save(); render();
}

function addColumn(){
  const title = prompt("New column name:", "");
  if (!title || !title.trim()) return;
  ensureColumns();
  let id = slug(title.trim()), n = 2;
  while (DB.columns.some(c => c.id === id)) id = slug(title.trim()) + "-" + n++;
  DB.columns.push({id, title:title.trim(), color:"#6B7C99"});
  logEvent({kind:"change", refType:"board", ref:"", body:"Added the column " + title.trim()});
  save(); renderRail(); render();
}

function columnMenu(id){
  ensureColumns();
  const i = DB.columns.findIndex(c => c.id === id);
  if (i < 0) return;
  const col = DB.columns[i];
  const used = DB.tasks.filter(t => t.status === id).length;
  const choice = prompt(
    'Column "' + col.title + '"' + (used ? " — " + used + " task" + (used === 1 ? "" : "s") : "") + "\n\n" +
    "  colour   set a new colour\n" +
    "  left     move it left\n" +
    "  right    move it right\n" +
    "  remove   delete it" + (used ? " (its tasks move to " + DB.columns[0].title + ")" : "") + "\n\n" +
    "Type one:", "colour");
  if (!choice) return;
  const c = choice.trim().toLowerCase();

  if (c === "colour" || c === "color"){
    const v = prompt("Colour as a hex value:", col.color || "#6B7C99");
    if (!v || !/^#[0-9a-f]{6}$/i.test(v.trim())) { if (v) toast("That is not a hex colour like #4C8C7A"); return; }
    col.color = v.trim();
  } else if (c === "left" || c === "right"){
    const j = c === "left" ? i - 1 : i + 1;
    if (j < 0 || j >= DB.columns.length) return;
    DB.columns.splice(j, 0, DB.columns.splice(i, 1)[0]);
  } else if (c === "remove"){
    if (DB.columns.length <= 1){ toast("A board needs at least one column"); return; }
    if (!confirm(used ? "Remove \"" + col.title + "\"? Its " + used + " task" + (used === 1 ? "" : "s") +
                        " move to " + DB.columns.find(x => x.id !== id).title + "."
                      : "Remove \"" + col.title + "\"?")) return;
    DB.columns.splice(i, 1);
    const fallback = DB.columns[0].id;
    DB.tasks.forEach(t => { if (t.status === id) t.status = fallback; });
    logEvent({kind:"change", refType:"board", ref:"", body:"Removed the column " + col.title +
      (used ? "; " + used + " task" + (used === 1 ? "" : "s") + " moved to " + DB.columns[0].title : "")});
  } else { toast("Type colour, left, right or remove"); return; }

  save(); renderRail(); render();
}

function addTaskTo(status){
  const title = prompt("New task in " + statusLabel[status] + ":", "");
  if (!title || !title.trim()) return;
  const t = {id:uid("t"), ws:DB.workstreams[0] ? DB.workstreams[0].id : "WS1",
             title:title.trim(), owner:"", start:"", due:"", status, partner:"", labels:[]};
  DB.tasks.push(t);
  logEvent({kind:"change", refType:"task", ref:t.id, body:"Added to " + statusLabel[status]});
  save(); renderRail(); render();
}

/* Moving an MoU card is moving the partner. Only the three columns that have a
   clear meaning for an agreement are accepted — anything else would be inventing
   a stage the CRM does not have. */
function moveMou(id, status){
  const p = DB.partners.find(x => x.id === id.slice(4));
  if (!p) return;
  const stage = MOU_STAGE[status];
  if (!stage){
    const allowed = Object.keys(MOU_STAGE).map(c => statusLabel[c]).join(", ");
    toast("An MoU can move to " + allowed + " — the rest have no meaning for an agreement");
    return;
  }
  if (p.stage === stage) return;
  const was = p.stage;
  p.stage = stage;
  logEvent({kind:"change", refType:"partner", ref:p.id,
    body: stageLabel(was) + " → " + stageLabel(stage) + " (moved on the board)"});
  save(); renderRail(); render();
  toast(p.name + " → " + stageLabel(stage));
}

/* Push a status change back to the other board. Optimistic, because the round
   trip is a commit — but it puts the card back if the write is refused. */
async function moveBridged(id, status){
  const t = bridged.find(x => x.id === id);
  if (!t || t.status === status) return;
  const was = t.status, wasSource = t.sourceStatus;
  t.status = status; t.sourceStatus = status;
  render();
  document.querySelector('[data-bridged="' + CSS.escape(id) + '"]')?.classList.add("saving");

  if (!useProxy){
    t.status = was; t.sourceStatus = wasSource; render();
    toast("Changing the other board needs the backend running");
    return;
  }
  try {
    const res = await fetch(proxyBase + "/api/bridge", {
      method:"PUT",
      headers:{"content-type":"application/json", "authorization":"Bearer " + (apiToken || "")},
      body: JSON.stringify({id: t.sourceId, status})
    });
    if (res.ok){
      try { localStorage.setItem(BRIDGE_KEY, JSON.stringify({at: Date.now(), tasks: bridged})); } catch (e) {}
      render();
      toast(t.sourceId + " → " + statusLabel[status] + " on the workforce board");
      return;
    }
    const out = await res.json().catch(() => ({}));
    t.status = was; t.sourceStatus = wasSource; render();
    toast(out.error === "bridge_read_only"
      ? "The backend has no token that can write to the workforce board"
      : out.error === "unauthorized" ? "Set the password under Data to change the other board"
      : "Could not update the workforce board" + (out.detail ? " — " + out.detail.slice(0, 60) : ""));
  } catch (e) {
    t.status = was; t.sourceStatus = wasSource; render();
    toast("Could not reach the backend");
  }
}

function wireBoard(){
  const addCol = document.getElementById("addColumn");
  if (addCol) addCol.onclick = addColumn;

  const mt = document.getElementById("mouToggle");
  if (mt) mt.onclick = () => setShowMou(!showMou);
  document.querySelectorAll("[data-mstage]").forEach(b =>
    b.onclick = () => { filters = {stage:b.dataset.mstage, cat:"", q:""}; go("partners"); });
  document.querySelectorAll("[data-colmenu]").forEach(b =>
    b.onclick = e => { e.stopPropagation(); columnMenu(b.dataset.colmenu); });
  document.querySelectorAll("[data-addto]").forEach(b =>
    b.onclick = () => addTaskTo(b.dataset.addto));

  /* Rename in place, saving as it is typed rather than on blur — the same rule
     as every other field here, and it does not depend on a blur event that a
     background tab or a stray click can swallow. Escape puts it back. */
  document.querySelectorAll("[data-rename]").forEach(el => {
    const id = el.dataset.rename;
    const original = el.textContent;
    let settle;
    const commit = () => {
      const title = el.textContent.trim();
      if (!title || title === original) return;
      ensureColumns();
      const col = DB.columns.find(c => c.id === id);
      if (!col || col.title === title) return;
      col.title = title;
      logEvent({kind:"change", refType:"board", ref:"",
        body: 'Renamed the column "' + original + '" to "' + title + '"'});
      save(); renderRail();
    };
    el.oninput = () => { clearTimeout(settle); settle = setTimeout(commit, 900); };
    el.onkeydown = ev => {
      if (ev.key === "Enter"){ ev.preventDefault(); clearTimeout(settle); commit(); el.blur(); }
      if (ev.key === "Escape"){ clearTimeout(settle); el.textContent = original; el.blur(); }
    };
    el.onblur = () => { clearTimeout(settle); commit(); };
  });

  const ow = document.getElementById("boardOwner");
  if (ow) ow.onchange = e => { boardOwner = e.target.value; render(); };
  const q = document.getElementById("boardQ");
  if (q) q.oninput = e => {
    boardQ = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("boardQ");
    if (el){ el.focus(); el.setSelectionRange(pos, pos); }
  };
  const cl = document.getElementById("boardClear");
  if (cl) cl.onclick = () => { boardOwner = boardQ = ""; render(); };

  let dragId = null;
  document.querySelectorAll(".kcard").forEach(card => {
    card.addEventListener("dragstart", e => {
      dragId = card.dataset.card || card.dataset.bridged || card.dataset.mou;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragId);
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      document.querySelectorAll(".col.over").forEach(c => c.classList.remove("over"));
    });
  });

  /* Where would a drop land? Among this column's own cards — bridged ones
     belong to the other board and are not reorderable. */
  const insertionPoint = (col, y, movingId) => {
    const cards = [...col.querySelectorAll(".kcard[data-card]")]
      .filter(c => c.dataset.card !== movingId);
    for (let i = 0; i < cards.length; i++){
      const r = cards[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) return {index: i, before: cards[i]};
    }
    return {index: cards.length, before: null};
  };
  const clearMarks = () => {
    document.querySelectorAll(".kcard.dropbefore").forEach(c => c.classList.remove("dropbefore"));
    document.querySelectorAll(".stack.dropend").forEach(c => c.classList.remove("dropend"));
  };

  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => {
      e.preventDefault();
      col.classList.add("over");
      clearMarks();
      const {before} = insertionPoint(col, e.clientY, dragId);
      if (before) before.classList.add("dropbefore");
      else col.querySelector(".stack").classList.add("dropend");
    });
    col.addEventListener("dragleave", e => {
      if (!col.contains(e.relatedTarget)){ col.classList.remove("over"); clearMarks(); }
    });
    col.addEventListener("drop", e => {
      e.preventDefault();
      col.classList.remove("over");
      clearMarks();
      const id = dragId || e.dataTransfer.getData("text/plain");
      const status = col.dataset.col;

      /* A task from the other board: its status lives in that repository, so
         the move has to go back there. */
      if (String(id).startsWith("wf:")) return moveBridged(id, status);

      /* An MoU card has no state of its own — it is the partner's stage. */
      if (String(id).startsWith("mou:")) return moveMou(id, status);

      const t = DB.tasks.find(x => x.id === id);
      if (!t) return;
      const moved = t.status !== status;
      const was = t.status;
      const {index} = insertionPoint(col, e.clientY, id);

      /* Rewrite this column's order so the sequence is explicit rather than
         implied by whatever the array happened to look like. */
      const rank = x => (typeof x.order === "number" ? x.order : Number.MAX_SAFE_INTEGER);
      const rest = DB.tasks
        .filter(x => x.status === status && x.id !== id)
        .sort((a, b) => (rank(a) - rank(b)) || (a.due || "9999").localeCompare(b.due || ""));
      t.status = status;
      rest.splice(Math.min(index, rest.length), 0, t);
      rest.forEach((x, i) => { x.order = i; });

      if (moved) logEvent({kind:"change", refType:"task", ref:t.id,
        body:statusLabel[was] + " → " + statusLabel[status]});
      save(); renderRail(); render();
      if (moved) toast("Moved to " + statusLabel[status]);
    });
  });
}

/* ── MoUs as work ─────────────────────────────────────────────────────
   Each MoU in flight is a card, derived from its partner record rather than
   stored, so the two can never disagree. The board vocabulary already fits:
   negotiating is Focus, sent and waiting on them is Review, signed is Done.
   Dragging one moves the partner's stage — the card has no state of its own. */
const MOU_COLUMN = {aligning:"focus", mou_sent:"review", mou_signed:"done", active:"done"};
const MOU_STAGE  = {focus:"aligning", review:"mou_sent", done:"mou_signed"};

/* Which workstream MoUs belong to. Mark one with "mou": true in
   workstreams.json to move them; Legal & regulatory is the sensible default,
   since an MoU is the instrument that carries rights and obligations. */
/* Taking the MoU cards off the board must not take the information with them.
   One line, four numbers, each one a way into the CRM filtered to that stage. */
function mouStrip(){
  const all = mouCards();
  const waiting = DB.partners.filter(p => isCounterparty(p) && stageRank(p.stage) >= 0 && !MOU_COLUMN[p.stage]);
  const groups = [
    {n: all.filter(m => m.status === "done").length,   label: "signed",    stage: "mou_signed"},
    {n: all.filter(m => m.status === "review").length, label: "sent",      stage: "mou_sent"},
    {n: all.filter(m => m.status === "focus").length,  label: "aligning",  stage: "aligning"},
    {n: waiting.length,                                label: "not started", stage: ""}
  ];
  return `
  <div class="moustrip">
    <span class="eyebrow">MoUs</span>
    ${groups.map(g => `
      <button class="moupill" data-mstage="${esc(g.stage)}" ${g.n ? "" : "data-zero"}
              title="Open the CRM${g.stage ? " filtered to this stage" : ""}">
        <b>${g.n}</b> ${g.label}
      </button>`).join("")}
    <span class="spacer"></span>
    <button class="btn ghost" id="mouToggle">${showMou ? "Hide MoU cards" : "Show as cards"}</button>
  </div>`;
}

function mouWs(){
  const w = DB.workstreams || [];
  return (w.find(x => x.mou) || w.find(x => x.id === "WS3") || w[0] || {id:"WS3", name:"Legal & regulatory"});
}

/* Advisors and network contacts are people, and people do not sign the MoU.
   They move through the same stages because the stages describe a
   conversation, but they must never turn into an MoU card or be counted as a
   counterparty. */
const PEOPLE_CATS = new Set(["advisor", "network"]);
const isCounterparty = p => !PEOPLE_CATS.has(p.cat);

/* An MoU card mirrors a partner's stage. That is status, not work: nothing can
   be done to "MoU — Sumitomo Insurance" except wait for them to countersign,
   and it will sit in Review until they do. Seven of them buried the two real
   cards on the board, so they are summarised in a strip instead and only drawn
   as cards on request. The Plan keeps them either way — there they sit in
   their own table under their own heading, which was never the problem. */
let showMou = false;
const MOU_KEY = "lc.showmou";
try { showMou = localStorage.getItem(MOU_KEY) === "1"; } catch (e) {}

function setShowMou(v){
  showMou = v;
  try { localStorage.setItem(MOU_KEY, v ? "1" : "0"); } catch (e) {}
  renderRail(); render();
}

/* The rail badges have to match what the tab actually draws, or they lie. */
function boardCards(){ return DB.tasks.concat(showMou ? mouCards() : [], bridged); }
function planCards(){  return DB.tasks.concat(mouCards()); }

function mouCards(){
  return DB.partners
    .filter(isCounterparty)
    .filter(p => MOU_COLUMN[p.stage])
    .map(p => ({
      id: "mou:" + p.id,
      partnerId: p.id,
      title: "MoU — " + p.name,
      ws: mouWs().id,
      status: MOU_COLUMN[p.stage],
      stage: p.stage,
      owner: p.owner || "",
      due: p.nextDate || "",
      mou: true
    }));
}

/* ── Timeline ─────────────────────────────────────────────────────── */

function planGantt(){
  /* MoUs belong on the timeline too, but only once they have a date to sit on;
     the legend says how many are missing rather than leaving them out silently. */
  const mous = mouCards();
  const ts = DB.tasks.filter(t => t.due).concat(mous.filter(m => m.due));
  const undatedMous = mous.length - mous.filter(m => m.due).length;
  if (!ts.length) return '<div class="card"><div class="empty">No dated tasks to plot yet.</div></div>';

  const starts = ts.map(t => t.start || shiftDays(t.due, -21));
  const ends = ts.map(t => t.due).concat(DB.milestones.map(m => m.date));
  const first = starts.concat(DB.milestones.map(m => m.date)).sort()[0];
  const last = ends.sort()[ends.length - 1];
  const months = monthsBetween(first, last);
  const t0 = toMs(monthStart(months[0]));
  const t1 = toMs(monthEnd(months[months.length - 1])) + DAY;
  const pct = d => ((toMs(d) - t0) / (t1 - t0) * 100);
  const clamp = n => Math.max(0, Math.min(100, n));

  const bar = (from, to) => {
    const l = clamp(pct(from));
    const w = Math.max(0.6, clamp(pct(to) + (100 / months.length / 30)) - l);
    return `left:${l.toFixed(3)}%; width:${w.toFixed(3)}%`;
  };

  const todayLine = pct(TODAY) >= 0 && pct(TODAY) <= 100
    ? `<div class="today" style="left:${pct(TODAY).toFixed(3)}%"></div>` : "";

  const rows = ts.slice()
    .sort((a, b) => (a.start || shiftDays(a.due, -21)).localeCompare(b.start || shiftDays(b.due, -21)))
    .map(t => {
      const st = t.start || shiftDays(t.due, -21);
      const late = isOverdue(t.due) && !isDone(t.status);
      return `
      <div class="grow">
        <div class="glabel" data-task="${t.id}" style="cursor:pointer">
          <span class="t" title="${esc(t.title)}">${esc(t.title)}</span>
          ${t.owner ? `<span class="gcode" style="margin-left:auto">${esc(t.owner)}</span>` : ""}
        </div>
        <div class="gtrack">
          ${todayLine}
          <div class="gbar ${t.status} ${late ? "late" : ""}" data-task="${t.id}" data-drag="task"
               style="${bar(st, t.due)}"
               title="${esc(t.title)} — ${fmtDate(st)} → ${fmtDate(t.due)}${late ? " (overdue)" : ""}"
            ><i class="grip l"></i><i class="grip r"></i></div>
        </div>
      </div>`;
    }).join("");

  return `
  <section class="card ws" style="margin-bottom:14px">
    <div class="gantt" style="--n:${months.length}" data-t0="${monthStart(months[0])}" data-t1="${shiftDays(monthEnd(months[months.length - 1]), 1)}">
      <div class="inner">
        <div class="ghead">
          <div class="glabel"><span class="eyebrow">Task</span></div>
          <div class="gmonths" style="grid-template-columns:repeat(${months.length},1fr)">
            ${months.map(mo => `<span class="${[1,4,7,10].includes(mo.m) ? "q" : ""}">${MONTHS[mo.m - 1]}${mo.m === 1 || mo === months[0] ? " " + String(mo.y).slice(2) : ""}</span>`).join("")}
          </div>
        </div>

        <div class="grow msrow">
          <div class="glabel"><span class="eyebrow">Milestones</span></div>
          <div class="gtrack">
            ${todayLine}
            ${DB.milestones.map((m, i) => `
              <div class="gms ${m.hit ? "hit" : ""}" style="left:${clamp(pct(m.date)).toFixed(3)}%"
                   data-drag="ms" data-msid="${m.id}"
                   title="M${i + 1} — ${esc(m.name)} · ${fmtDate(m.date)} — drag to move"></div>
              <div class="gmslabel" style="left:${clamp(pct(m.date)).toFixed(3)}%">M${i + 1}</div>`).join("")}
          </div>
        </div>

        ${rows}
      </div>
    </div>
    <div class="glegend">
      <span><b></b>Backlog / Weekly</span>
      <span><b class="focus"></b>Focus</span>
      <span><b class="review"></b>Review</span>
      <span><b class="done"></b>Done</span>
      <span><b class="today"></b>Today, ${fmtDate(TODAY)}</span>
      <span style="margin-left:auto">Drag to reschedule · dashed outline = past its due date</span>
      ${undatedMous ? `<span style="width:100%; margin-left:0!important; color:var(--ochre)">
        ${undatedMous} MoU${undatedMous === 1 ? " is" : "s are"} not plotted — give the partner a next-move date and it appears here.</span>` : ""}
    </div>
  </section>`;
}

/* Dragging on the timeline. Bars move or resize by whole days; milestone
   diamonds move their date. Nothing is written until the pointer is released,
   so an abandoned drag changes nothing. */
let ganttScroll = {x:0, y:0};
let drag = null;

function wireGantt(){
  const g = document.querySelector(".gantt");
  if (!g) return;

  g.scrollLeft = ganttScroll.x;
  g.scrollTop = ganttScroll.y;
  g.addEventListener("scroll", () => { ganttScroll = {x:g.scrollLeft, y:g.scrollTop}; }, {passive:true});

  const spanDays = Math.round((toMs(g.dataset.t1) - toMs(g.dataset.t0)) / DAY);
  const tip = document.getElementById("dragtip");

  g.addEventListener("pointerdown", e => {
    const handle = e.target.closest("[data-drag]");
    if (!handle || e.button !== 0) return;
    const track = handle.parentElement;
    const kind = handle.dataset.drag;
    const rec = kind === "ms"
      ? DB.milestones.find(m => m.id === handle.dataset.msid)
      : DB.tasks.find(t => t.id === handle.dataset.task);
    if (!rec) return;

    const mode = kind === "ms" ? "ms"
      : e.target.classList.contains("grip")
        ? (e.target.classList.contains("l") ? "start" : "end")
        : "move";

    drag = {
      handle, rec, mode, kind, moved:false,
      x0:e.clientX,
      perDay: track.clientWidth / spanDays,
      pctDay: 100 / spanDays,
      left0: parseFloat(handle.style.left) || 0,
      width0: parseFloat(handle.style.width) || 0,
      s0: kind === "ms" ? rec.date : (rec.start || shiftDays(rec.due, -21)),
      d0: kind === "ms" ? rec.date : rec.due
    };
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    handle.classList.add("dragging");
    e.preventDefault();
  });

  g.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x0;
    if (!drag.moved && Math.abs(dx) < 3) return;
    drag.moved = true;
    const days = Math.round(dx / drag.perDay);
    const shift = days * drag.pctDay;
    const h = drag.handle;

    if (drag.mode === "move" || drag.mode === "ms"){
      h.style.left = (drag.left0 + shift) + "%";
    } else if (drag.mode === "start"){
      const w = Math.max(drag.pctDay, drag.width0 - shift);
      h.style.left = (drag.left0 + drag.width0 - w) + "%";
      h.style.width = w + "%";
    } else {
      h.style.width = Math.max(drag.pctDay, drag.width0 + shift) + "%";
    }

    const [ns, nd] = previewDates(drag, days);
    tip.textContent = drag.kind === "ms" ? fmtDate(ns) : fmtDate(ns) + " → " + fmtDate(nd);
    tip.style.left = e.clientX + "px";
    tip.style.top = e.clientY + "px";
    tip.classList.add("show");
  });

  const finish = e => {
    if (!drag) return;
    const d = drag; drag = null;
    d.handle.classList.remove("dragging");
    tip.classList.remove("show");

    if (!d.moved){
      if (d.kind === "task") taskDrawer(d.rec.id);
      else { d.rec.hit = !d.rec.hit; save(); render(); }
      return;
    }
    const days = Math.round((e.clientX - d.x0) / d.perDay);
    const [ns, nd] = previewDates(d, days);
    if (d.kind === "ms") d.rec.date = ns;
    else { d.rec.start = ns; d.rec.due = nd; }
    save(); render();
    toast(d.kind === "ms" ? "Milestone moved to " + fmtDate(ns) : fmtDate(ns) + " → " + fmtDate(nd));
  };
  g.addEventListener("pointerup", finish);
  g.addEventListener("pointercancel", () => {
    if (!drag) return;
    drag.handle.classList.remove("dragging");
    drag = null; tip.classList.remove("show"); render();
  });
}

function previewDates(d, days){
  if (d.kind === "ms") return [shiftDays(d.s0, days), ""];
  if (d.mode === "move") return [shiftDays(d.s0, days), shiftDays(d.d0, days)];
  if (d.mode === "start"){
    const ns = shiftDays(d.s0, days);
    return [ns > d.d0 ? d.d0 : ns, d.d0];
  }
  const nd = shiftDays(d.d0, days);
  return [d.s0, nd < d.s0 ? d.s0 : nd];
}

/* ── List ─────────────────────────────────────────────────────────── */

function planList(){
  const order = Object.fromEntries(STATUS_CYCLE.map((id, i) => [id, i]));
  const tasks = DB.tasks.slice().sort((a, b) =>
    (order[a.status] - order[b.status]) || ((a.due || "9999") < (b.due || "9999") ? -1 : 1));
  const mous = mouCards().sort((a, b) =>
    (order[a.status] - order[b.status]) || a.title.localeCompare(b.title));

  return `
  <section class="card ws">
    <header>
      <h2>MoUs</h2>
      <span class="cat">Follow the partner records</span>
      <span class="spacer"></span>
      <button class="btn ghost" data-view="partners">Partners ›</button>
    </header>
    <div class="tablewrap"><table><tbody>
      ${mous.length ? mous.map(m => `
        <tr class="clickable" data-mou="${esc(m.id)}">
          <td style="width:88px"><span class="status" data-s="${esc(m.status)}">${esc(statusLabel[m.status])}</span></td>
          <td>${esc(m.title)}<span class="sub">${esc(stageLabel(m.stage))}</span></td>
          <td style="width:130px" class="hide-sm">${esc(m.owner) || '<span style="color:var(--ink-3)">unassigned</span>'}</td>
          <td style="width:82px" class="num">${fmtDate(m.due)}</td>
        </tr>`).join("") : '<tr><td class="empty">No MoUs in flight.</td></tr>'}
    </tbody></table></div>
  </section>

  ${wsSections(tasks)}`;
}

/* One section per workstream. This used to be a single flat Tasks table, which
   meant the workstreams existed in the data and nowhere on screen — adding one
   appeared to do nothing at all.

   Each section is a drop target and its name is editable in place. Empty ones
   stay folded into a line of chips rather than a run of empty tables, but the
   chips are drop targets too — otherwise a new workstream could be made and
   never filled. */
function wsSections(tasks){
  const byWs = {};
  for (const t of tasks) (byWs[t.ws] ??= []).push(t);

  const used = DB.workstreams.filter(w => byWs[w.id]);
  const empty = DB.workstreams.filter(w => !byWs[w.id]);
  /* A task pointing at a workstream that no longer exists would otherwise
     vanish silently. */
  const orphans = tasks.filter(t => !DB.workstreams.some(w => w.id === t.ws));

  const rows = list => list.map(t => {
    const p = DB.partners.find(x => x.id === t.partner);
    return `<tr class="clickable ${isDone(t.status) ? "done" : ""}" data-task="${t.id}" draggable="true">
      <td style="width:88px"><button class="status" data-cycle="${t.id}" data-s="${t.status}">${statusLabel[t.status]}</button></td>
      <td style="width:52px"><span class="kid">${esc(t.id)}</span></td>
      <td>${esc(t.title)}${p ? `<span class="sub">${esc(p.name)}</span>` : ""}</td>
      <td style="width:130px" class="hide-sm">${esc(t.owner) || '<span style="color:var(--ink-3)">unassigned</span>'}</td>
      <td style="width:82px" class="num ${isOverdue(t.due) && !isDone(t.status) ? "overdue" : ""}">${fmtDate(t.due)}</td>
    </tr>`;
  }).join("");

  const section = (w, list) => `
  <section class="card ws" ${w ? `data-ws="${esc(w.id)}"` : ""}>
    <header>
      <h2 ${w ? `data-wsrename="${esc(w.id)}" contenteditable="true" spellcheck="false"` : ""}>${
        esc(w ? w.name : "No workstream")}</h2>
      <span class="spacer"></span>
      <span class="num" style="color:var(--ink-3); font-size:11.5px">${
        list.filter(t => isDone(t.status)).length}/${list.length}</span>
    </header>
    <div class="tablewrap"><table><tbody>${rows(list)}</tbody></table></div>
  </section>`;

  return used.map(w => section(w, byWs[w.id])).join("")
    + (orphans.length ? section(null, orphans) : "")
    + `<div class="wsempty">
        ${empty.length ? `<span class="eyebrow">Nothing in yet</span>` : ""}
        ${empty.map(w => `<span class="wschip" data-ws="${esc(w.id)}"

/* Rename in place and drag between workstreams. Same rename behaviour as the
   board columns — saves as it is typed rather than on blur, because a blur can
   be swallowed by a background tab or a stray click, and Escape puts it back. */
function wirePlan(){
  const add = document.getElementById("addWs");
  if (add) add.onclick = addWorkstream;

  document.querySelectorAll("[data-wsrename]").forEach(el => {
    const id = el.dataset.wsrename;
    const original = el.textContent.trim();
    let settle;
    /* Compared against the live record, not against the text this element had
       when it was wired. Those diverge as soon as one rename saves without a
       re-render, and then typing the old name back is silently ignored — the
       data keeps the intermediate value. */
    const commit = () => {
      const name = el.textContent.trim();
      if (!name) return;
      const w = DB.workstreams.find(x => x.id === id);
      if (!w || w.name === name) return;
      const from = w.name;
      w.name = name;
      logEvent({kind:"change", refType:"board", ref:"",
        body: 'Renamed the workstream "' + from + '" to "' + name + '"'});
      save();
    };
    el.oninput = () => { clearTimeout(settle); settle = setTimeout(commit, 900); };
    el.onkeydown = ev => {
      if (ev.key === "Enter"){ ev.preventDefault(); clearTimeout(settle); commit(); el.blur(); }
      if (ev.key === "Escape"){ clearTimeout(settle); el.textContent = original; el.blur(); }
    };
    el.onblur = () => { clearTimeout(settle); commit(); };
  });

  let dragId = null;
  document.querySelectorAll("tr[data-task]").forEach(tr => {
    tr.addEventListener("dragstart", e => {
      dragId = tr.dataset.task;
      tr.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragId);
    });
    tr.addEventListener("dragend", () => { dragId = null; tr.classList.remove("dragging"); });
  });

  document.querySelectorAll("[data-ws]").forEach(box => {
    box.addEventListener("dragover", e => { e.preventDefault(); box.classList.add("wsover"); });
    box.addEventListener("dragleave", e => {
      if (!box.contains(e.relatedTarget)) box.classList.remove("wsover");
    });
    box.addEventListener("drop", e => {
      e.preventDefault();
      box.classList.remove("wsover");
      const id = dragId || e.dataTransfer.getData("text/plain");
      const ws = box.dataset.ws;
      const t = DB.tasks.find(x => x.id === id);
      if (!t || t.ws === ws) return;
      const from = (DB.workstreams.find(w => w.id === t.ws) || {}).name || t.ws;
      const to = (DB.workstreams.find(w => w.id === ws) || {}).name || ws;
      t.ws = ws;
      logEvent({kind:"change", refType:"task", ref:t.id, body: from + " → " + to});
      save(); renderRail(); render(); toast("Moved to " + to);
    });
  });
}

const nextWsId = () => {
  const n = DB.workstreams.map(w => +(String(w.id).match(/\d+/) || [0])[0]);
  return "WS" + (Math.max(0, ...n) + 1);
};

function addWorkstream(){
  const name = prompt("New workstream name:", "");
  if (!name || !name.trim()) return;
  const w = {id: nextWsId(), name: name.trim(), layer: "", lead: ""};
  DB.workstreams.push(w);
  logEvent({kind:"change", refType:"board", ref:"", body:"Added the workstream " + w.name});
  save(); renderRail(); render();
}

/* ── Events ───────────────────────────────────────────────────────── */

/* An event is over once its last day has passed, so a two-day conference is
   still "upcoming" on its second morning. */
const isPastEvent = e => (e.end || e.start) < TODAY;

const eventDates = e => {
  if (!e.end || e.end === e.start) return fmtDate(e.start);
  const a = e.start.split("-"), b = e.end.split("-");
  /* Same month reads better as "21–24 Sep 26" than as two full dates. The day
     keeps its padding so it lines up with every other date on the desk —
     unpadding only the first gave "8–09 Sep 26". */
  return (a[0] === b[0] && a[1] === b[1])
    ? a[2] + "–" + fmtDate(e.end)
    : fmtDate(e.start) + " – " + fmtDate(e.end);
};

const daysUntil = d => Math.round((toMs(d) - toMs(TODAY)) / DAY);

/* Just the host, so a long conference URL does not push the row around. */
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return "link"; } };

function viewEvents(){
  const all = DB.events.slice().sort((a, b) => a.start.localeCompare(b.start));
  const upcoming = all.filter(e => !isPastEvent(e));
  const past = all.filter(isPastEvent).reverse();
  const nextId = (upcoming[0] || {}).id;

  /* The tile carries the days, the label under it carries the month. A
     multi-day event inside one month shows its range in the tile; one that
     crosses a month boundary cannot, so it says so on the meta line instead. */
  const tile = e => {
    const a = e.start.split("-"), b = (e.end || "").split("-");
    const sameMonth = e.end && a[0] === b[0] && a[1] === b[1];
    return `<div class="evtile">
      <b class="${sameMonth ? "range" : ""}">${sameMonth ? +a[2] + "–" + +b[2] : +a[2]}</b>
    </div>`;
  };

  const row = e => {
    const p = DB.partners.find(x => x.id === e.partner);
    const n = daysUntil(e.start);
    const gone = isPastEvent(e);
    const when = gone ? fmtDate(e.start)
      : n <= 0 ? "today" : n === 1 ? "tomorrow" : n + " days";
    const spansMonths = e.end && e.end.slice(0, 7) !== e.start.slice(0, 7);
    const bits = [
      e.time,
      spansMonths ? "until " + fmtDate(e.end) : "",
      e.location
    ].filter(Boolean).map(esc);
    if (e.link) bits.push(
      `<a class="evlink" href="${esc(e.link)}" target="_blank" rel="noopener noreferrer"
          data-stop>${esc(hostOf(e.link))} ↗</a>`);

    return `
    <div class="evrow ${e.id === nextId ? "isnext" : ""} ${gone ? "gone" : ""}" data-event="${esc(e.id)}">
      ${tile(e)}
      <div>
        <div class="evname">${esc(e.name)}</div>
        <div class="evmeta">
          ${bits.join('<span class="sep">·</span>')}
          ${p ? `${bits.length ? '<span class="sep">·</span>' : ""}
                <span class="chip ${stageClass(p.stage)}"><i class="dot"></i>${esc(p.name)}</span>` : ""}
        </div>
      </div>
      <div class="evwhen">${esc(when)}</div>
    </div>`;
  };

  /* Grouped by month so a long diary stays scannable, and so an empty month
     between two events is visible as a gap rather than hidden by sorting. */
  const grouped = list => {
    let month = "";
    return list.map(e => {
      const k = e.start.slice(0, 7);
      const head = k === month ? "" :
        `<div class="evmonth">${MONTHS[+k.slice(5) - 1]} ${k.slice(2, 4)}</div>`;
      month = k;
      return head + row(e);
    }).join("");
  };

  return `
  <div class="pagehead">
    <div><h1>Events</h1></div>
    <div class="tools"><button class="btn primary" id="addEvent">Add event</button></div>
  </div>

  <div class="grid" style="gap:16px">
    <section class="card">
      <header><h2>Coming up</h2><span class="spacer"></span>
        <span class="cat">${upcoming.length}</span></header>
      ${upcoming.length ? grouped(upcoming)
        : '<div class="empty" style="padding:26px 15px">Nothing in the diary.</div>'}
    </section>
    ${past.length ? `
    <section class="card">
      <header><h2>Been and gone</h2><span class="spacer"></span>
        <span class="cat">${past.length}</span></header>
      ${grouped(past)}
    </section>` : ""}
  </div>`;
}

/* ── Investors ────────────────────────────────────────────────────── */

function viewInvestors(){
  let rows = DB.investors.slice();
  if (ifilters.tier)  rows = rows.filter(i => i.tier === ifilters.tier);
  if (ifilters.type)  rows = rows.filter(i => i.type === ifilters.type);
  if (ifilters.stage) rows = rows.filter(i => i.stage === ifilters.stage);
  if (ifilters.q){
    const q = ifilters.q.toLowerCase();
    rows = rows.filter(i => [i.name, i.thesis, i.evidence, i.precedents, i.warm, i.ask, i.geo, i.notes, i.source].join(" ").toLowerCase().includes(q));
  }
  /* Rank is set by hand against the rule in the note; anything unranked
     sinks to the bottom of its tier rather than landing somewhere plausible. */
  const sorter = (a, b) => {
    const k = ifilters.sort || "rank", d = ifilters.dir || 1;
    /* Undated years sink to the bottom whichever way the column is sorted. */
    const ya = a.year || (d > 0 ? 9999 : -1), yb = b.year || (d > 0 ? 9999 : -1);
    const v = k === "year" ? ya - yb
            : k === "name" ? a.name.localeCompare(b.name)
            : ((a.rank || 99) - (b.rank || 99));
    return (v * d) || ((a.rank || 99) - (b.rank || 99)) || a.name.localeCompare(b.name);
  };
  const arrow = k => ifilters.sort === k ? (ifilters.dir > 0 ? " ↑" : " ↓") : "";
  const tierCount = t => DB.investors.filter(i => i.tier === t).length;

  /* A decision table: the evidence sits in the row, dated and linked, so the
     list can be read without opening anything. The why, the ask and the path
     in live a click away in the profile. */
  const site = i => i.link
    ? ` <a class="evlink" href="${esc(i.link)}" target="_blank" rel="noopener noreferrer" data-stop title="${esc(hostOf(i.link))}">↗</a>` : "";
  const src = i => i.sourceUrl
    ? `<a class="evlink" href="${esc(i.sourceUrl)}" target="_blank" rel="noopener noreferrer" data-stop>${esc(hostOf(i.sourceUrl))} ↗</a>`
    : '<span style="color:var(--ink-3)">—</span>';
  const row = i => `
    <tr class="clickable" data-investor="${esc(i.id)}" title="${esc(i.thesis)}">
      <td class="num" data-label="#">${i.rank || "—"}</td>
      <td data-label="Investor"><b class="pn">${esc(i.name)}</b>${site(i)}
        <span class="sub">${esc(itypeLabel(i.type))}${i.geo ? " · " + esc(i.geo) : ""}</span></td>
      <td class="why" data-label="Why">${esc(i.thesis)}</td>
      <td class="evd" data-label="Evidence">${esc(i.evidence) || '<span style="color:var(--ink-3)">none recorded</span>'}</td>
      <td class="num" data-label="Year">${i.year || "—"}</td>
      <td data-label="Source">${src(i)}</td>
    </tr>`;

  const head = `<thead><tr>
      <th style="width:34px" data-sort="rank" title="Sort by rank">#${arrow("rank")}</th>
      <th style="width:210px" data-sort="name" title="Sort by name">Investor${arrow("name")}</th>
      <th style="width:27%">Why</th><th>Evidence</th>
      <th style="width:60px" data-sort="year" title="Sort by year">Year${arrow("year")}</th><th style="width:150px">Source</th>
    </tr></thead>`;

  const section = t => {
    if (ifilters.tier && ifilters.tier !== t) return "";
    const list = rows.filter(i => i.tier === t).sort(sorter);
    const table = `<div class="tablewrap"><table class="cardtable">${head}<tbody>${
        list.length ? list.map(row).join("") : '<tr><td colspan="6" class="empty">Nothing in this tier matches.</td></tr>'
      }</tbody></table></div>`;
    const count = `${list.length}${list.length !== tierCount(t) ? " of " + tierCount(t) : ""}`;
    /* The excluded list is the long one. It folds shut unless it is what was
       asked for, so it never buries the funds that matter. */
    if (t === "X") return list.length || ifilters.tier === "X" ? `
    <section class="card">
      <details ${(ifilters.tier === "X" || ifilters.q) ? "open" : ""}>
        <summary style="cursor:pointer; padding:14px 16px; display:flex; align-items:center; gap:10px; list-style:none">
          <h2 style="margin:0">Checked — no fit</h2><span class="cat">${esc(ITIERS.X.hint)}</span>
          <span class="spacer"></span><span class="cat">${count} · click to open</span></summary>
        ${table}
      </details>
    </section>` : "";
    return `
    <section class="card">
      <header><h2>Tier ${t}</h2><span class="cat" style="margin-left:10px">${esc(ITIERS[t].hint)}</span>
        <span class="spacer"></span><span class="cat">${count}</span></header>
      ${table}
    </section>`;
  };

  return `
  <div class="pagehead">
    <div>
      <h1>Investors</h1>
    </div>
    <div class="tools">
      <button class="btn primary" id="addInvestor">Add investor</button>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <header>
      <div class="filters">
        <input type="text" id="iQ" placeholder="Search ${DB.investors.length} funds — name, why, evidence, precedents…" value="${esc(ifilters.q)}" style="width:300px">
        <select id="iTier">
          <option value="">All tiers</option>
          ${Object.entries(ITIERS).map(([k, t]) => `<option value="${k}" ${ifilters.tier === k ? "selected" : ""}>${t.short ? "Checked, no fit" : "Tier " + t.label + " — " + t.hint} (${tierCount(k)})</option>`).join("")}
        </select>
        <select id="iType">
          <option value="">All types</option>
          ${Object.entries(ITYPES).map(([k, l]) => `<option value="${k}" ${ifilters.type === k ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <select id="iStage">
          <option value="">All stages</option>
          ${ISTAGES.map(st => `<option value="${st.id}" ${ifilters.stage === st.id ? "selected" : ""}>${st.label}</option>`).join("")}
        </select>
        ${(ifilters.tier || ifilters.type || ifilters.stage || ifilters.q || ifilters.sort !== "rank") ? '<button class="btn ghost" id="iClear">Clear</button>' : ""}
      </div>
      <span class="spacer"></span>
      <span class="cat">${rows.length} of ${DB.investors.length}</span>
    </header>
  </div>

  <div class="note" style="margin-bottom:14px">Ordered by tier, then by rank inside it: a path in through something already on this board first, then funds that can lead a round this size, then the freshest dated evidence. Year is the latest dated deal in the evidence. Funds that were checked and show no evidence of investing in this space sit folded at the bottom. Click a fund for the why, the ask and the path in.</div>

  <div class="grid" style="gap:16px">
    ${section("A")}${section("B")}${section("C")}${section("X")}
  </div>`;
}

    i.rank = parseInt(i.rank, 10) || 0;
    i.year = parseInt(i.year, 10) || 0;
    for (const k of ["link", "sourceUrl"]) if (i[k] && !/^https?:\/\//i.test(i[k])){ toast("A link has to start with http:// or https://"); return; }
    if (isNew){
      DB.investors.push(i);
      logEvent({kind:"change", refType:"investor", ref:i.id, body:"Added " + i.name + " to the investor list"});
    } else if (wasStage !== i.stage){
      logEvent({kind:"change", refType:"investor", ref:i.id, body:istageLabel(wasStage) + " → " + istageLabel(i.stage)});
    }
    save(); renderRail(); render(); toast(isNew ? "Investor added" : "Saved");
    if (isNew) closeDrawer(); else investorDrawer(i.id);
  };
  const del = drawer.querySelector("[data-del]");
  if (del) del.onclick = () => {
    if (!confirm("Delete " + i.name + "? This cannot be undone.")) return;
    DB.investors = DB.investors.filter(x => x.id !== i.id);
    logEvent({kind:"change", refType:"investor", ref:"", body:"Removed " + i.name + " from the investor list"});
    save(); closeDrawer(); renderRail(); render(); toast("Deleted");
  };
}

/* ── Activity ─────────────────────────────────────────────────────── */

let actFilter = {actor:"", kind:"", q:""};

const refLabel = e => {
  if (e.refType === "partner"){ const p = DB.partners.find(x => x.id === e.ref); return p ? p.name : e.ref; }
  if (e.refType === "task"){ const t = DB.tasks.find(x => x.id === e.ref); return t ? t.title : e.ref; }
  if (e.refType === "milestone"){ const m = DB.milestones.find(x => x.id === e.ref); return m ? m.name : e.ref; }
  if (e.refType === "event"){ const v = DB.events.find(x => x.id === e.ref); return v ? v.name : e.ref; }
  if (e.refType === "investor"){ const v = DB.investors.find(x => x.id === e.ref); return v ? v.name : e.ref; }
  return e.ref || "the board";
};

const initials = name => (name || "?").split(/[\s\-_]+/).filter(Boolean).slice(0, 2)
  .map(w => w[0]).join("").toUpperCase() || "?";

function eventRow(e, showRef){
  return `
  <div class="ev ${e.actorKind === "agent" ? "agent" : ""}">
    <span class="av" title="${e.actorKind === "agent" ? "Agent" : "Person"}">${initials(e.actor)}</span>
    <div>
      <div class="hd">
        <span class="who">${esc(e.actor)}</span>
        <span class="kind ${e.kind}">${(EVENT_KINDS[e.kind] || {label:e.kind}).label}</span>
        ${e.to ? `<span class="to">→ ${esc(e.to)}</span>` : ""}
        <span class="when">${ago(e.at)}</span>
        ${showRef && e.ref ? `<span class="on" data-goref="${e.refType}:${e.ref}">on ${esc(refLabel(e))}</span>` : ""}
      </div>
      <div class="body">${esc(e.body || e.summary || "")}</div>
    </div>
  </div>`;
}

function viewActivity(){
  let list = DB.activity.slice().sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  if (actFilter.actor) list = list.filter(e => e.actor === actFilter.actor);
  if (actFilter.kind) list = list.filter(e => e.kind === actFilter.kind);
  if (actFilter.q){
    const q = actFilter.q.toLowerCase();
    list = list.filter(e => ((e.body || "") + (e.summary || "") + refLabel(e)).toLowerCase().includes(q));
  }

  const actors = [...new Set(DB.activity.map(e => e.actor))].sort();
  const agents = [...new Set(DB.activity.filter(e => e.actorKind === "agent").map(e => e.actor))];
  const open = DB.activity.filter(e => e.kind === "question").length;

  return `
  <div class="pagehead">
    <div>
      <h1>Activity</h1>
    </div>
    <div class="tools"><button class="btn primary" id="newNote">Add a note</button></div>
  </div>

  <div class="grid" style="gap:14px">
    <div class="stats">
      <div class="stat"><b>${DB.activity.length}</b><small>Entries</small></div>
      <div class="stat"><b>${agents.length}</b><small>Agents active</small></div>
      <div class="stat ${open ? "alert" : ""}"><b>${open}</b><small>Open questions</small></div>
      <div class="stat"><b>${DB.activity.filter(e => e.kind === "finding").length}</b><small>Findings</small></div>
    </div>

    <section class="card">
      <header>
        <div class="filters">
          <select id="actActor">
            <option value="">Everyone</option>
            ${actors.map(a => `<option value="${esc(a)}" ${actFilter.actor === a ? "selected" : ""}>${esc(a)}</option>`).join("")}
          </select>
          <select id="actKind">
            <option value="">All kinds</option>
            ${Object.entries(EVENT_KINDS).map(([k, v]) => `<option value="${k}" ${actFilter.kind === k ? "selected" : ""}>${v.label}</option>`).join("")}
          </select>
          <input type="text" id="actQ" placeholder="Search…" value="${esc(actFilter.q)}" style="width:170px">
          ${(actFilter.actor || actFilter.kind || actFilter.q) ? '<button class="btn ghost" id="actClear">Clear</button>' : ""}
        </div>
        <span class="spacer"></span>
        <span class="cat">${list.length} shown</span>
      </header>
      <div class="feed">
        ${list.length ? list.map(e => eventRow(e, true)).join("")
          : `<div class="empty">Nothing logged yet.<br><span style="font-size:12px">Comments you leave on a partner or task appear here, and so does anything an agent writes.</span></div>`}
      </div>
    </section>

  </div>`;
}

function wireActivity(){
  const a = document.getElementById("actActor");
  if (a) a.onchange = e => { actFilter.actor = e.target.value; render(); };
  const k = document.getElementById("actKind");
  if (k) k.onchange = e => { actFilter.kind = e.target.value; render(); };
  const q = document.getElementById("actQ");
  if (q) q.oninput = e => {
    actFilter.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("actQ");
    if (el){ el.focus(); el.setSelectionRange(pos, pos); }
  };
  const c = document.getElementById("actClear");
  if (c) c.onclick = () => { actFilter = {actor:"", kind:"", q:""}; render(); };
}

/* A thread plus composer, embedded in the partner and task drawers. */
function threadBlock(refType, ref){
  const list = eventsFor(refType, ref);
  return `
  <div>
    <span class="eyebrow">Thread${list.length ? " · " + list.length : ""}</span>
    <div class="thread" style="margin-bottom:9px">
      ${list.length ? list.map(e => eventRow(e, false)).join("")
        : '<p style="color:var(--ink-3); font-size:12.5px; margin:6px 0 0">Nothing yet. Notes you add here are visible to everyone, including agents.</p>'}
    </div>
    <div class="composer">
      <textarea id="cmtBody" rows="2" placeholder="Add a note…"></textarea>
      <div class="row">
        <select id="cmtKind">
          ${Object.entries(EVENT_KINDS).filter(([k]) => k !== "change")
            .map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("")}
        </select>
        <button class="btn" id="cmtAdd">Post</button>
      </div>
    </div>
  </div>`;
}

function wireThread(refType, ref, after){
  const btn = drawer.querySelector("#cmtAdd");
  if (!btn) return;
  btn.onclick = () => {
    const body = drawer.querySelector("#cmtBody").value.trim();
    if (!body){ toast("Write something first"); return; }
    if (!me){
      const name = prompt("Your name, so the note is attributable:", "");
      if (!name) return;
      me = name.trim(); try { localStorage.setItem(ME_KEY, me); } catch (e) {}
    }
    logEvent({kind:drawer.querySelector("#cmtKind").value, refType, ref, body});
    save(); renderRail();
    if (after) after();
    toast("Posted");
  };
}

/* ══ Drawer ═══════════════════════════════════════════════════════════ */

const drawer = document.getElementById("drawer");
const scrim = document.getElementById("scrim");

/* Hold the board still while a dialog is open — scrolling the page behind a
   modal loses your place for no reason. */
const lockScroll = on => { document.documentElement.style.overflow = on ? "hidden" : ""; };

function closeDrawer(){
  drawer.classList.remove("open"); scrim.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true"); drawer.innerHTML = "";
  lockScroll(false);
}
scrim.onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function openDrawer(html){
  drawer.innerHTML = html;
  drawer.classList.remove("wide");
  lockScroll(true);
  drawer.classList.add("open"); scrim.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  const f = drawer.querySelector("input,select,textarea");
  if (f) f.focus();
  drawer.querySelectorAll("[data-close]").forEach(b => b.onclick = closeDrawer);
}

function field(label, name, value, type){
  return `<label class="field"><span>${label}</span>
    <input type="${type || "text"}" name="${name}" value="${esc(value)}"></label>`;
}

function partnerDrawer(id){
  const isNew = !id;
  const p = isNew
    ? {id:uid("p"), name:"", cat:"carrier", country:"", why:"", ask:"", stage:"identified",
       owner:"", contact:"", next:"", nextDate:"", lastDate:"", notes:""}
    : DB.partners.find(x => x.id === id);
  if (!p) return;

  openDrawer(`
    <header>
      <h3>${isNew ? "New partner" : esc(p.name)}</h3>
      <button class="btn ghost" data-close>Close</button>
    </header>
    <div class="body">
      ${field("Organisation", "name", p.name)}
      <div style="display:grid; grid-template-columns:1fr 96px; gap:10px">
        <label class="field"><span>Type</span><select name="cat">
          ${Object.entries(CATEGORIES).map(([k, c]) => `<option value="${k}" ${p.cat === k ? "selected" : ""}>${c.label}</option>`).join("")}
        </select></label>
        ${field("Country", "country", p.country)}
      </div>
      <label class="field"><span>Stage</span><select name="stage">
        ${ALL_STAGES.map(s => `<option value="${s.id}" ${p.stage === s.id ? "selected" : ""}>${s.label} — ${s.hint}</option>`).join("")}
      </select></label>
      <label class="field"><span>Why them</span><textarea name="why" rows="2">${esc(p.why)}</textarea></label>
      <label class="field"><span>What we want from them</span><textarea name="ask" rows="2">${esc(p.ask)}</textarea></label>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
        ${field("Owner (us)", "owner", p.owner)}
        ${field("Contact (them)", "contact", p.contact)}
      </div>
      <div style="display:grid; grid-template-columns:1fr 130px; gap:10px">
        ${field("Last contact", "lastDate", p.lastDate, "date")}
        <span></span>
      </div>
      <div style="display:grid; grid-template-columns:1fr 130px; gap:10px">
        ${field("Next move", "next", p.next)}
        ${field("Due", "nextDate", p.nextDate, "date")}
      </div>
      ${isNew ? "" : `<button class="btn" data-mktask style="align-self:flex-start">Put this next move on the board ›</button>`}
      <label class="field"><span>Notes</span><textarea name="notes" rows="5">${esc(p.notes)}</textarea></label>
      ${isNew ? "" : threadBlock("partner", p.id)}
    </div>
    <footer>
      ${isNew ? "" : '<button class="btn danger" data-del>Delete</button>'}
      <span class="spacer"></span>
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" data-save>Save</button>
    </footer>`);

  wireThread("partner", p.id, () => partnerDrawer(p.id));

  /* The next move is already the real task — "Chase countersignature",
     "Confirm market and entity". This copies it onto the board rather than
     making anyone retype it, and reads the live field so a move typed but not
     yet saved is the one that lands. */
  const mk = drawer.querySelector("[data-mktask]");
  if (mk) mk.onclick = () => {
    const val = n => { const el = drawer.querySelector(`[name="${n}"]`); return (el ? el.value : p[n] || "").trim(); };
    const title = val("next");
    if (!title){ toast("Write a next move first"); return; }
    const already = DB.tasks.find(t => t.partner === p.id && t.title === title && !isDone(t.status));
    if (already){ toast("Already on the board"); return; }
    DB.tasks.push({
      id: uid("t"), ws: mouWs().id, title,
      owner: val("owner"), start: "", due: val("nextDate"),
      status: columns()[0].id, partner: p.id
    });
    logEvent({kind:"change", refType:"partner", ref:p.id,
      body:"Next move put on the board as a task: " + title});
    save(); renderRail(); render();
    toast("On the board, in " + columns()[0].title);
  };

  drawer.querySelector("[data-save]").onclick = () => {
    const wasStage = p.stage;
    drawer.querySelectorAll("[name]").forEach(el => p[el.name] = el.value.trim());
    if (!p.name){ toast("Give it a name first"); return; }
    delete p.seeded;
    if (isNew) DB.partners.push(p);
    else if (wasStage !== p.stage){
      logEvent({kind:"change", refType:"partner", ref:p.id,
        body:stageLabel(wasStage) + " → " + stageLabel(p.stage)});
    }
    save(); closeDrawer(); renderRail(); render(); toast(isNew ? "Partner added" : "Saved");
  };
  const del = drawer.querySelector("[data-del]");
  if (del) del.onclick = () => {
    if (!confirm("Delete " + p.name + "? This cannot be undone.")) return;
    DB.partners = DB.partners.filter(x => x.id !== p.id);
    save(); closeDrawer(); renderRail(); render(); toast("Deleted");
  };
}

function taskDrawer(id){
  const isNew = !id;
  const t = isNew
    /* Status must be a real column id. This said "todo", which has not been a
       column since the board took the workforce vocabulary — the drawer's
       select quietly fell back to the first option, but anything created
       without going through that select was invalid and the validator
       rejected it. */
    ? {id:uid("t"), ws:DB.workstreams[0].id, title:"", owner:"", start:"", due:"", status:columns()[0].id, partner:""}
    : DB.tasks.find(x => x.id === id);
  if (!t) return;

  openDrawer(`
    <header><h3>${isNew ? "New task" : "Task"}</h3><button class="btn ghost" data-close>Close</button></header>
    <div class="body">
      <label class="field"><span>Task</span><textarea name="title" rows="2">${esc(t.title)}</textarea></label>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
        <label class="field"><span>Status</span><select name="status">
          ${STATUS_CYCLE.map(s => `<option value="${s}" ${t.status === s ? "selected" : ""}>${statusLabel[s]}</option>`).join("")}
        </select></label>
        <label class="field"><span>Workstream</span><select name="ws">
          ${DB.workstreams.map(w => `<option value="${w.id}" ${t.ws === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("")}
        </select></label>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
        ${field("Start", "start", t.start || "", "date")}
        ${field("Due", "due", t.due, "date")}
      </div>
      ${field("Owner", "owner", t.owner)}
      <label class="field"><span>Linked partner</span><select name="partner">
        <option value="">— none —</option>
        ${DB.partners.slice().sort((a, b) => a.name.localeCompare(b.name))
          .map(p => `<option value="${p.id}" ${t.partner === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
      </select></label>
      ${isNew ? "" : threadBlock("task", t.id)}
    </div>
    <footer>
      ${isNew ? "" : '<button class="btn danger" data-del>Delete</button>'}
      <span class="spacer"></span>
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" data-save>Save</button>
    </footer>`);

  wireThread("task", t.id, () => taskDrawer(t.id));

  drawer.querySelector("[data-save]").onclick = () => {
    const wasStatus = t.status;
    drawer.querySelectorAll("[name]").forEach(el => t[el.name] = el.value.trim());
    if (!t.title){ toast("Give it a title first"); return; }
    if (isNew) DB.tasks.push(t);
    else if (wasStatus !== t.status){
      logEvent({kind:"change", refType:"task", ref:t.id,
        body:statusLabel[wasStatus] + " → " + statusLabel[t.status]});
    }
    save(); closeDrawer(); renderRail(); render(); toast(isNew ? "Task added" : "Saved");
  };
  const del = drawer.querySelector("[data-del]");
  if (del) del.onclick = () => {
    DB.tasks = DB.tasks.filter(x => x.id !== t.id);
    save(); closeDrawer(); renderRail(); render(); toast("Deleted");
  };
}

/* A note against the board as a whole, or aimed at a named actor — the way a

function dataDrawer(){
  const state = {
    live:    localBackend
      ? `This backend is in <b>development mode</b>: it writes to its own working tree at revision <code>${revOf(DB)}</code> and does not commit. Your changes are saved to disk but reach nobody else until someone commits them. Give the server a <code style="font-family:var(--data)">GITHUB_TOKEN</code> to have it commit to <code>${esc(backendRepo)}</code> instead.`
      : `Connected to <code>${esc(backendRepo)}</code> at revision <code>${revOf(DB)}</code>. Every save is one commit under <code>data/</code> — git is the database and the audit trail.`,
    ahead:   !useProxy ? `This copy of the desk has no backend, so it is <b>read-only</b> — your edits stay in this browser. Open the desk through its Replit address to change the board.`
           : apiToken ? `Pushing your edits to the board…`
                      : `The board is reachable but this browser has no password, so your edits stay local. Set it below.`,
    behind:  `The board is at revision <code>${revOf(shared)}</code>; your unpushed edits started from <code>${sync.base}</code>. Use the banner to resolve it.`,
    offline: `The board's backend is unreachable right now. You are working from this browser's copy; it reconnects automatically and unpushed edits go up when it returns.`
  }[syncState];

  openDrawer(`
    <header><h3>Data</h3><button class="btn ghost" data-close>Close</button></header>

        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:7px">

          <button class="btn danger" data-reset>${shared ? "Discard my edits, reload the board" : "Reset to seed"}</button>
        </div>
      </div>

      <label class="field"><span>Your name — used to attribute notes and changes</span>
        <input type="text" id="meName" value="${esc(me)}" placeholder="e.g. Toni"></label>

        <span class="eyebrow">Access</span>

          <p style="margin:0; color:var(--ink-3); font-size:11.5px">${useProxy
            ? `Without it you can read the board but not change it. Saved as you type, kept in this browser. No GitHub token ever reaches this browser — it stays on the server at <code style="font-family:var(--data)">${esc(proxyBase)}</code>, so this password cannot touch the repository directly.`
            : "This copy of the desk is served read-only. The board is changed through the backend — open the desk's Replit address instead."}</p>
          ${apiToken && useProxy ? `
          <div style="border-top:1px solid var(--line); padding-top:10px; display:grid; gap:7px">
            <span class="eyebrow">Set up another browser or phone</span>
            <p style="margin:0; color:var(--ink-2); font-size:12.5px">Copy a link that configures whichever browser opens it — no pasting the password again. Open it once on your phone and that device is set up for good.</p>
            <button class="btn" data-setuplink style="justify-self:start">Copy setup link</button>
            <p style="margin:0; color:var(--ochre); font-size:11.5px">That link contains the team password. Anyone who opens it can edit the board.</p>
          </div>` : ""}
        </div>
      </div>

      <label class="field"><span>Paste JSON to import</span>
        <textarea id="importBox" rows="7" placeholder="Paste an exported file here, then press Import."></textarea></label>
      <button class="btn" data-import style="align-self:flex-start">Import</button>

      <p style="color:var(--ink-3); font-size:12px; margin:0">

      </p>
    </div>
    <footer><span class="spacer"></span><button class="btn" data-close>Done</button></footer>`);

  const copy = async (text, ok) => {
    try { await navigator.clipboard.writeText(text); toast(ok); return true; }
    catch (e) { toast("Clipboard blocked"); return false; }
  };

  const linkBtn = drawer.querySelector("[data-setuplink]");
  if (linkBtn) linkBtn.onclick = () => copy(setupLink(), "Setup link copied — open it on the other device");

  const nameBox = drawer.querySelector("#meName");
  if (nameBox) nameBox.oninput = () => {
    me = nameBox.value.trim();
    try { localStorage.setItem(ME_KEY, me); } catch (e) {}
  };
  /* Save as it is typed, not on blur: pasting a password and closing the
     drawer with Escape would otherwise lose it silently. */
  const tokBox = drawer.querySelector("#apiTok");
  if (tokBox){
    let settle;
    tokBox.oninput = () => {
      apiToken = tokBox.value.trim();
      try {
        if (apiToken) localStorage.setItem(TOKEN_KEY, apiToken);
        else localStorage.removeItem(TOKEN_KEY);
      } catch (e) {}
      clearTimeout(settle);
      settle = setTimeout(async () => {
        if (apiToken && useProxy){
          /* Pick up the head commit so the first save can write straight away,
             with no reload needed. */
          try { headSha = await headCommit(); liveMode = true; } catch (e) {}
          if (sync.dirty) queuePush();
          syncState = sync.dirty ? "ahead" : "live";
          renderBanner();
        }
        toast(apiToken ? "Password saved — it stays in this browser" : "Password cleared");
      }, 700);
    };
  }

  drawer.querySelector("[data-import]").onclick = () => {
    const raw = document.getElementById("importBox").value.trim();
    if (!raw){ toast("Paste some JSON first"); return; }
    let next;
    try { next = JSON.parse(raw); }
    catch (e){ toast("That is not valid JSON"); return; }
    if (!Array.isArray(next.partners) || !Array.isArray(next.tasks)){
      toast("That file is missing partners or tasks"); return;
    }
    DB = next; save(); closeDrawer(); renderRail(); renderBanner(); render(); toast("Imported");
  };
  drawer.querySelector("[data-reset]").onclick = async () => {
    if (!confirm(shared
      ? "Discard everything in this browser and reload the board from the backend?"
      : "Discard everything in this browser and go back to the built-in seed?")) return;
    if (liveMode){
      try {
        shared = await fetchBoard();
      } catch (e) {}
    }
    const target = shared || SEED;
    DB = structuredClone(target);
    sync = {base:revOf(target), dirty:false};
    save(true); saveSync();
    syncState = liveMode ? "live" : "offline";
    closeDrawer(); renderRail(); renderBanner(); render();
    toast(shared ? "Reloaded the board" : "Reset to seed");
  };
}

/* ══ Global wiring ════════════════════════════════════════════════════ */

document.getElementById("dataBtn").onclick = dataDrawer;

document.getElementById("view").addEventListener("click", e => {
  /* closest() walks all the way up to the delegation root, so the root itself
     must never be treated as a nav button — one stray attribute there takes
     every click in the app. */
  const nav = e.target.closest("[data-view]");
  if (nav && nav !== e.currentTarget){ go(nav.dataset.view); return; }

  const cyc = e.target.closest("[data-cycle]");
  if (cyc){
    e.stopPropagation();
    const t = DB.tasks.find(x => x.id === cyc.dataset.cycle);
    const was = t.status;
    t.status = STATUS_CYCLE[(STATUS_CYCLE.indexOf(t.status) + 1) % STATUS_CYCLE.length];
    logEvent({kind:"change", refType:"task", ref:t.id, body:statusLabel[was] + " → " + statusLabel[t.status]});
    save(); renderRail(); render(); return;
  }

  const mode = e.target.closest("[data-mode]");
  if (mode){ planMode = mode.dataset.mode; applyRoute(true); render(); return; }

  const ref = e.target.closest("[data-goref]");
  if (ref){
    const [type, id] = ref.dataset.goref.split(":");
    if (type === "partner") partnerDrawer(id);
    else if (type === "task") taskDrawer(id);
    return;
  }

  /* Checked ahead of the row toggle below: the ⋯ button lives inside the row
     it belongs to, which carries [data-ms] — closest() matches that ancestor
     too, and the toggle used to win and fire instead of the menu. */
  const msm = e.target.closest("[data-msmenu]");
  if (msm){ e.stopPropagation(); milestoneMenu(msm.dataset.msmenu); return; }

  const ms = e.target.closest("[data-ms]");
  if (ms && current === "plan"){
    const m = DB.milestones.find(x => x.id === ms.dataset.ms);
    m.hit = !m.hit;
    logEvent({kind:"change", refType:"milestone", ref:m.id, body:m.hit ? "Milestone reached" : "Milestone reopened"});
    save(); render(); return;
  }

  /* Timeline bars and diamonds are driven by pointer events, not clicks. */
  if (e.target.closest(".gbar, .gms")) return;

  const mc = e.target.closest("[data-mou]");
  if (mc){ partnerDrawer(mc.dataset.mou.slice(4)); return; }

  const bc = e.target.closest("[data-bridged]");
  if (bc){ window.open(BRIDGE.board, "_blank", "noopener"); return; }

  const kc = e.target.closest("[data-card]");
  if (kc){ taskDrawer(kc.dataset.card); return; }

  const pr = e.target.closest("[data-partner]");
  if (pr){ partnerDrawer(pr.dataset.partner); return; }

  const tr = e.target.closest("[data-task]");
  if (tr){ taskDrawer(tr.dataset.task); return; }

  /* A real link inside a clickable row. Without this the row wins and the
     editor opens on top of the tab that just started loading. */
  if (e.target.closest("[data-stop]")) return;

  const ev = e.target.closest("[data-event]");
  if (ev){ eventDrawer(ev.dataset.event); return; }

  const th = e.target.closest("th[data-sort]");
  if (th){
    const k = th.dataset.sort;
    if (ifilters.sort === k) ifilters.dir = -ifilters.dir;
    else { ifilters.sort = k; ifilters.dir = k === "year" ? -1 : 1; }
    render(); return;
  }

  const inv = e.target.closest("[data-investor]");
  if (inv){ investorDrawer(inv.dataset.investor); return; }

  if (e.target.id === "addPartner"){ partnerDrawer(null); return; }
  if (e.target.id === "addTask"){ taskDrawer(null); return; }
  if (e.target.id === "addEvent"){ eventDrawer(null); return; }
  if (e.target.id === "addInvestor"){ investorDrawer(null); return; }
  if (e.target.id === "newNote"){ noteDrawer(); return; }
  if (e.target.id === "addMilestone"){ addMilestone(); return; }
  if (e.target.id === "fClear"){ filters = {stage:"", cat:"", q:""}; render(); return; }
  if (e.target.id === "iClear"){ ifilters = {tier:"", type:"", stage:"", q:"", sort:"rank", dir:1}; render(); return; }
});

document.getElementById("view").addEventListener("change", e => {
  if (e.target.id === "fStage"){ filters.stage = e.target.value; render(); }
  if (e.target.id === "fCat"){ filters.cat = e.target.value; render(); }
  if (e.target.id === "iTier"){ ifilters.tier = e.target.value; render(); }
  if (e.target.id === "iType"){ ifilters.type = e.target.value; render(); }
  if (e.target.id === "iStage"){ ifilters.stage = e.target.value; render(); }
});
document.getElementById("view").addEventListener("input", e => {
  if (e.target.id === "fQ"){
    filters.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("fQ");
    if (el){ el.focus(); el.setSelectionRange(pos, pos); }
  }
  if (e.target.id === "iQ"){
    ifilters.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("iQ");
    if (el){ el.focus(); el.setSelectionRange(pos, pos); }
  }
});

document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
};

document.getElementById("syncChip").onclick = dataDrawer;

(async function init(){
  const arrivedWithToken = takeTokenFromHash();

  const r = routeFromHash();
  current = r.view;
  if (r.mode) planMode = r.mode;
  applyRoute(true);

  if (arrivedWithToken) setTimeout(() => toast("This browser can now edit the board"), 400);

  renderRail();
  render();
  renderBanner();
  await connectBackend();
  renderRail();
  renderBanner();
  render();

  /* Non-blocking: the board is useful without it. */
  /* The bridge lands after first paint and adds cards, so the rail badges have
     to be recounted — not just the board redrawn — or Plan and Board sit on a
     number that was already wrong by the time it was painted. */
  loadBridge().then(() => { renderRail(); if (current === "board" || current === "overview") render(); });
})();
</script>
